name: Compilar o mostrador do Snoop

# Só roda quando muda algo do mostrador (pasta mostrador/).
on:
  push:
    branches: [ main ]
    paths:
      - 'mostrador/**'
      - '.github/workflows/mostrador.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v5

      - name: Instalar o Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar o Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.13'

      - name: Compilar
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -o pipefail
          gradle -p mostrador assembleRelease --stacktrace --no-daemon 2>&1 | tee build.log

      - name: Garantir que o APK é só recursos (sem classes.dex)
        run: |
          APK=mostrador/app/build/outputs/apk/release/app-release.apk
          if unzip -l "$APK" | grep -q 'classes.*\.dex'; then
            BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
            cp "$APK" sem-codigo.apk
            zip -q -d sem-codigo.apk 'classes*.dex'
            "$BT/zipalign" -f -p 4 sem-codigo.apk alinhado.apk
            "$BT/apksigner" sign --ks app/eiclaude.keystore --ks-type pkcs12 --ks-pass pass:eiclaude \
              --ks-key-alias eiclaude --key-pass pass:eiclaude --out "$APK" alinhado.apk
            echo "classes.dex removido e APK assinado de novo"
          fi
          unzip -l "$APK"

      - name: Guardar o registro do erro no ramo "logs-mostrador"
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          if [ -f build.log ]; then cp build.log "$RUNNER_TEMP/logs/build.log"; else echo "A compilação nem começou; veja a aba Actions." > "$RUNNER_TEMP/logs/build.log"; fi
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan logs-mostrador-tmp
          git rm -rf --cached . > /dev/null
          cp "$RUNNER_TEMP/logs/build.log" build.log
          git add build.log
          git commit -m "Registro do build do mostrador ${{ github.run_number }}"
          git push -f origin HEAD:logs-mostrador

      - name: Publicar o APK
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          APK="SnoopMostrador-v${BUILD_NUMBER}.apk"
          cp mostrador/app/build/outputs/apk/release/app-release.apk "$APK"
          ls -l "$APK"
          gh release create "mostrador-v${BUILD_NUMBER}" "$APK" \
            --title "Mostrador do Snoop v${BUILD_NUMBER}" \
            --notes "Mostrador (tela principal) do Snoop para o Galaxy Watch. Instale pelo Wear Installer 2 e escolha o mostrador Snoop no relógio (veja o README, seção Mostrador). Tocar no Snoop abre o app Snoop." \
            --latest=false
