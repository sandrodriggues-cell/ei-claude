name: Compilar APK do relógio

# Só roda quando muda algo do app do relógio (pasta relogio/).
on:
  push:
    branches: [ main ]
    paths:
      - 'relogio/**'
      - '.github/workflows/relogio.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v5

      - name: Instalar o Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar o Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.13'

      - name: Compilar
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -o pipefail
          gradle -p relogio assembleRelease --stacktrace --no-daemon 2>&1 | tee build.log

      - name: Guardar o registro do erro no ramo "logs-relogio"
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          if [ -f build.log ]; then cp build.log "$RUNNER_TEMP/logs/build.log"; else echo "A compilação nem começou; veja a aba Actions." > "$RUNNER_TEMP/logs/build.log"; fi
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan logs-relogio-tmp
          git rm -rf --cached . > /dev/null
          cp "$RUNNER_TEMP/logs/build.log" build.log
          git add build.log
          git commit -m "Registro do build do relógio ${{ github.run_number }}"
          git push -f origin HEAD:logs-relogio

      - name: Publicar o APK
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          APK="EiClaudeRelogio-v${BUILD_NUMBER}.apk"
          cp relogio/app/build/outputs/apk/release/app-release.apk "$APK"
          ls -l "$APK"
          gh release create "relogio-v${BUILD_NUMBER}" "$APK" \
            --title "Ei Claude no relógio v${BUILD_NUMBER}" \
            --notes "Controle remoto do Claude para o Galaxy Watch: instale no relógio pelo Wear Installer 2 (veja o README). Precisa do Ei Claude v4 ou mais novo no celular." \
            --latest=false
