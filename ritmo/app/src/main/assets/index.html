    const k=newCat(v,pick?pick.dataset.v:freeColor());
    const seg=document.querySelector(`.seg[data-seg="${name}"]`);
    if(seg){const tmp=document.createElement('div');tmp.innerHTML=catSeg(name,k,{req:!!seg.dataset.req});seg.replaceWith(tmp.children[0]);box.replaceWith(tmp.children[0]);}
    toast(`Lista “${v}” criada`);
  },
  'set-perfil':()=>openSetPerfil(),'set-aparencia':()=>openSetAparencia(),'set-meudia':()=>{closeMenu();openSetMeuDia();},
  'set-pomo':()=>openSetPomo(),'set-alarmes':()=>openSetAlarmes(),'set-dados':()=>openSetDados(),'set-sobre':()=>openSobre(),
  'set-theme'(el){setSettings({theme:el.dataset.v});render();openSetAparencia();},
  'set-home'(el){setSettings({home:el.dataset.v});saveView();openSetAparencia();},
  'set-sugg'(){const on=!(S.settings.myday&&S.settings.myday.sugg===false);setSettings({myday:Object.assign({},S.settings.myday,{sugg:!on})});render();openSetMeuDia();},
  'al-open'(el){try{AND.openAlarmSetting(el.dataset.w);}catch(e){}},
  'al-test'(){if(!AND||!AND.testAlarm){toast('O teste funciona no app Feito do celular.');return;}try{AND.testAlarm();toast('Bloqueie a tela: o alarme toca em 5 segundos.');}catch(e){}},
  export:()=>exportData(),
  import(){const i=$('#impFile');if(i){i.value='';i.click();}},
  'imp-go':()=>applyImport(),
  'imp-cancel'(){S.imp=null;const b=$('#impBox');if(b)b.innerHTML='';},
  'clear-ex'(el){
    if(!armed(el,'Toque de novo para apagar'))return;
    S.tasks.filter(t=>t.ex).map(t=>t.id).forEach(id=>Store.delTask(id));
    S.events.filter(e=>e.ex).map(e=>e.id).forEach(id=>Store.delEvent(id));
    S.habits.filter(h=>h.ex).map(h=>h.id).forEach(id=>Store.delHabit(id));
    if(sheetOpen())closeSheet();else render();toast('Exemplos apagados');
  },
  wipe(el){if(!armed(el,'Toque de novo para apagar tudo'))return;wipeAll();},
  't-play'(){if(T.running){if(flowFocus())tFlowStop();else tPause();}else tStart();},
  't-reset':()=>tReset(),
  't-skip':()=>tSkip(),
  't-method'(el){const v=el.dataset.v;if(v===T.method)return;if(T.running){toast('Pause o timer para trocar de modo.');return;}Object.assign(T,{method:v,phase:'focus',remain:null,flowAcc:0,cycle:1,doneFx:0});saveT();focusChanged();},
  't-box'(el){T.box=+el.dataset.v;T.remain=null;saveT();openFocus(true);},
  bar(el){S.chartSel=+el.dataset.i;openFocus(true);},
  undo(){const f=undoFn;undoFn=null;clearTimeout(toastT);$('#toast').hidden=true;if(f){f();render();if(S.sheet&&S.sheet.type==='task')openTask(S.sheet.id,true);}}
};

/* ---------- eventos globais ---------- */
let justSwiped=0,lpFired=false;
document.addEventListener('click',e=>{
  if(Date.now()-justSwiped<380){e.preventDefault();return;}
  const m=$('#menu'),inMenu=m&&m.contains(e.target);
  if(m&&!m.hidden&&!inMenu)closeMenu();
  if(e.target===$('#sheetWrap')){closeSheet();return;}
  const el=e.target.closest('[data-act]');
  if(S.ask.focus&&!inMenu&&!e.target.closest('#dock')&&document.activeElement!==$('#askIn')){S.ask.focus=false;if(!$('#askIn').value.trim())askReset();renderDock();}
  if(!el||el.disabled)return;
  const f=ACT[el.dataset.act];if(f){f(el,e);}
});
document.addEventListener('submit',e=>{const f=e.target;if(!f.dataset||!f.dataset.form)return;e.preventDefault();const h=FORMS[f.dataset.form];if(h)h(f);});
document.addEventListener('change',e=>{
  const id=e.target.id;
  if(id==='impFile'&&e.target.files&&e.target.files[0])readImport(e.target.files[0]);
  else if(id==='tdDate'){if(e.target.value)tdPatch({date:e.target.value});}
  else if(id==='tdRem'){if(e.target.value)tdPatch({rem:e.target.value});}
  else if(id==='tdTitle'||id==='tdNotes'||(e.target.dataset&&e.target.dataset.sub))tdCommitText();
});
document.addEventListener('input',e=>{
  const t=e.target,id=t.id;
  if(id==='askIn')renderDock();
  else if(id==='homeQ'){const q=t.value,nav=$('#homeNav'),res=$('#homeRes');if(!nav||!res)return;nav.hidden=!!q.trim();res.hidden=!q.trim();res.innerHTML=searchHtml(q);}
  else if(id==='tdTitle'){autoGrow(t);tdText();}
  else if(id==='tdNotes'){autoGrow(t);tdText();}
  else if(t.dataset&&t.dataset.sub)tdText();
  else if(id==='hName'||id==='eTitle'||id==='eNotes')autoGrow(t);
});
document.addEventListener('keydown',e=>{
  const t=e.target;
  if(e.key==='Escape'){if(!$('#menu').hidden){closeMenu();return;}if(sheetOpen()){closeSheet();return;}if(t&&t.id==='askIn'){t.blur();return;}}
  if(e.key==='Enter'&&t&&t.id==='tdTitle'){e.preventDefault();t.blur();tdCommitText();}
  if(e.key==='Enter'&&t&&(t.id==='hName'||t.id==='eTitle')){e.preventDefault();const f=t.closest('form');if(f&&f.requestSubmit)f.requestSubmit();}
  if((e.key==='Enter'||e.key===',')&&t&&t.id==='tdTag'){e.preventDefault();const v=t.value;t.value='';addTag(v);}
  if(e.key==='Enter'&&t&&t.id==='tdSub'){e.preventDefault();const v=t.value.trim();if(!v)return;const s=S.sheet;if(!s||s.type!=='task')return;tdCommitText();const t2=S.tasks.find(x=>x.id===s.id);if(!t2)return;tdPatch({subs:subsOf(t2).concat([{id:uid('s'),t:v,done:false}])},'tdSub');}
  if(e.key==='Enter'&&t&&t.dataset&&t.dataset.sub){e.preventDefault();t.blur();tdCommitText();}
});
/* a barra "Eu quero…" mostra os atalhos enquanto está em uso */
let askBlurT=null;
document.addEventListener('focusin',e=>{if(e.target&&e.target.id==='askIn'){clearTimeout(askBlurT);if(!S.ask.focus){S.ask.focus=true;renderDock();}}});
document.addEventListener('focusout',e=>{if(e.target&&e.target.id==='askIn'){clearTimeout(askBlurT);askBlurT=setTimeout(()=>{const m=$('#menu');if(document.activeElement===$('#askIn')||(m&&!m.hidden))return;S.ask.focus=false;if(!$('#askIn').value.trim())askReset();renderDock();},180);}});
['#askOpts','#askGo'].forEach(sel=>{const n=$(sel);if(n)n.addEventListener('pointerdown',e=>{if(e.target.closest('[data-act="ask-list"]'))return;e.preventDefault();});});

/* ---------- gestos: deslizar tarefas e dias, segurar no hábito, puxar a folha ---------- */
let SW=null,lpT=null,lpXY=null,PD=null;
document.addEventListener('pointerdown',e=>{
  const ring=e.target.closest('.hctl[data-act="h-ring"]');
  if(ring&&e.pointerType!=='mouse'){clearTimeout(lpT);lpFired=false;lpXY=[e.clientX,e.clientY];lpT=setTimeout(()=>{const h=S.habits.find(x=>x.id===ring.dataset.id);if(!h||!hVal(h,ring.dataset.d))return;lpFired=true;hInc(h,ring.dataset.d,h.type==='count'?-1:-hVal(h,ring.dataset.d));buzz(30);render();toast(h.type==='count'?'Tirei 1':'Desmarcado');},550);return;}
  const sh=$('#sheet');
  if(sheetOpen()&&e.target.closest('#sheet .sb,#sheet .grab')&&sh.scrollTop<=0&&!e.target.closest('button,input,textarea')){PD={y:e.clientY,dy:0};return;}
  if(e.pointerType==='mouse')return;
  const row=e.target.closest('.tr');
  if(row&&!row.classList.contains('done')&&!e.target.closest('.cb')&&!sheetOpen()){SW={row,x:e.clientX,y:e.clientY,dx:0,on:false};return;}
  const zone=e.target.closest('[data-swipe]');
  if(zone&&!sheetOpen())SW={zone:zone.dataset.swipe,x:e.clientX,y:e.clientY,dx:0,on:false};
},{passive:true});
document.addEventListener('pointermove',e=>{
  if(lpT&&lpXY&&Math.hypot(e.clientX-lpXY[0],e.clientY-lpXY[1])>10){clearTimeout(lpT);lpT=null;}
  if(PD){PD.dy=Math.max(0,e.clientY-PD.y);$('#sheet').style.transform=PD.dy?`translateY(${PD.dy}px)`:'';return;}
  if(!SW)return;const dx=e.clientX-SW.x,dy=e.clientY-SW.y;
  if(!SW.on){if(Math.abs(dy)>12&&Math.abs(dy)>Math.abs(dx)){SW=null;return;}if(Math.abs(dx)>16&&Math.abs(dx)>Math.abs(dy)*1.4){SW.on=true;if(SW.row)SW.row.classList.add('drag');}else return;}
  SW.dx=dx;
  if(SW.row){const inn=SW.row.querySelector('.tr-in');inn.style.transform=`translateX(${dx}px)`;SW.row.classList.toggle('go-r',dx>0);SW.row.classList.toggle('go-l',dx<0);}
},{passive:true});
function endSwipe(cancel){
  clearTimeout(lpT);lpT=null;
  if(PD){const p=PD;PD=null;const sh=$('#sheet');if(!cancel&&p.dy>110){closeSheet();}sh.style.transform='';return;}
  const s=SW;SW=null;if(!s||!s.on)return;justSwiped=Date.now();
  if(s.row){
    const inn=s.row.querySelector('.tr-in'),id=s.row.dataset.id;s.row.classList.remove('drag');
    if(!cancel&&s.dx>90){inn.style.transform='translateX(105%)';setTimeout(()=>completeTask(id),170);}
    else if(!cancel&&s.dx<-90){inn.style.transform='translateX(-105%)';setTimeout(()=>deleteTask(id),170);}
    else{inn.style.transform='';s.row.classList.remove('go-r','go-l');}
  }else if(!cancel&&Math.abs(s.dx)>60){const dir=s.dx<0?1:-1;if(s.zone==='mon')monStep(dir);else if(s.zone==='week'){S.sel=addDays(S.sel,dir*7);render();}else calStep(dir);}
}
document.addEventListener('pointerup',()=>endSwipe(false));
document.addEventListener('pointercancel',()=>endSwipe(true));
document.addEventListener('contextmenu',e=>{if(e.target.closest('.hctl'))e.preventDefault();});

/* ---------- celular: voltar e retomar ---------- */
window.ritmoBack=function(){
  if(!$('#menu').hidden){closeMenu();return true;}
  if(sheetOpen()){closeSheet();return true;}
  const ai=$('#askIn');if(ai&&document.activeElement===ai){ai.blur();return true;}
  const prev=S.hist.pop();
  if(prev){S.tab=prev.tab;if(prev.tab==='tarefas'&&prev.list){S.list=prev.list;saveView();}render();window.scrollTo(0,0);return true;}
  const home=S.settings.home||'tarefas';
  if(S.tab!==home){S.tab=home;render();return true;}
  return false;
};
window.ritmoResume=function(){
  const b=$('#alStatus');if(b&&sheetOpen())b.innerHTML=alStatusHtml();
  if(!sheetOpen())render();
};

/* ---------- início ---------- */
function onReady(){
  if(!S.nav&&TABS.some(t=>t[0]===S.settings.home))S.tab=S.settings.home;
  saveView();
  const real=S.tasks.some(t=>!t.ex)||S.events.some(e=>!e.ex)||S.habits.some(h=>!h.ex);
  if(!S.settings.onboarded&&!real&&!sheetOpen())setTimeout(()=>{if(!sheetOpen())openWelcome();},300);
}
let lastMin=-1,lastDay=today();
setInterval(()=>{
  if(T.running&&!flowFocus()&&T.endAt<=Date.now())tComplete();
  tickUI();
  const m=nowMin();
  if(m!==lastMin){
    const first=lastMin<0;lastMin=m;
    if(!first&&!sheetOpen()&&!S.ask.focus){const a=document.activeElement;if(!(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))){if(today()!==lastDay){lastDay=today();S.hDay=today();}render();}}
  }
},500);
window.addEventListener('scroll',()=>{const t=$('#top');if(t)t.classList.toggle('scrolled',window.scrollY>4);},{passive:true});
render();
Store.init();
if(T.running)nativeAlarm();
</script>
