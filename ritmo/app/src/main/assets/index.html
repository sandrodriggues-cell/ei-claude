let fxTimer=null;
function openFocus(keep){
  S.sheet={type:'focus'};
  const busy=timerActive(),task=S.tasks.find(t=>t.id===T.task);
  const ev=T.method==='pomodoro'?Math.max(1,+S.settings.pomo.every):0;
  let dots='';if(ev){const k=(T.cycle-1)%ev+(T.phase!=='focus'?1:0);for(let i=0;i<ev;i++)dots+=`<i class="${i<k?'on':''}"></i>`;}
  const brk=T.phase!=='focus',phase=T.phase==='focus'?(flowFocus()?'Foco livre':'Foco'):T.phase==='long'?'Pausa longa':'Pausa';
  const fx=T.doneFx&&Date.now()-T.doneFx<3500;
  let h=shBar('Modo foco',closeBtn(),'<span></span>');
  h+=`<div class="fmodes" role="group" aria-label="Modo">${Object.keys(METHODS).map(k=>`<button type="button" class="fchip" data-act="t-method" data-v="${k}" aria-pressed="${T.method===k}">${METHODS[k].n}</button>`).join('')}</div>`;
  if(T.method==='box'&&T.phase==='focus'&&!busy)h+=`<div class="fmodes" style="margin-top:8px" role="group" aria-label="Duração">${[15,25,30,45,60,90].map(v=>`<button type="button" class="fchip" data-act="t-box" data-v="${v}" aria-pressed="${+T.box===v}">${v} min</button>`).join('')}</div>`;
  h+=`<div class="fring"><svg class="r" viewBox="0 0 220 220" aria-hidden="true"><circle cx="110" cy="110" r="100" style="fill:none;stroke:var(--surface-2)" stroke-width="10"/><circle id="tRing" cx="110" cy="110" r="100" style="fill:none;stroke:${brk?'var(--ok)':'var(--hi)'}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${FCIRC.toFixed(1)}" stroke-dashoffset="${fx?0:FCIRC.toFixed(1)}"/></svg><div class="c">${fx?`<svg viewBox="0 0 24 24" width="74" height="74" fill="none" stroke="var(--hi)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="donemark-p"><path d="M5 12.5l4.5 4.5L19 7.5" style="stroke-dasharray:24;stroke-dashoffset:24;animation:draw .6s .1s ease-out forwards"/></svg><div class="t-phase">Feito!</div>`:`<div class="t-phase ${brk?'brk':''}">${phase}${T.method!=='flow'&&T.method!=='box'?`, ciclo ${T.cycle}`:''}</div><div class="t-big" id="tTime" aria-live="off"></div>${dots?`<div class="cyc" aria-label="Ciclos até a pausa longa">${dots}</div>`:''}`}<div class="t-task">${task?esc(task.title):'Sem tarefa escolhida'}</div></div></div>`;
  const playIcon=T.running?(flowFocus()?'stop':'pause'):'play',playLbl=T.running?(flowFocus()?'Parar':'Pausar'):'Começar';
  h+=`<div class="ctrl"><button type="button" class="rbtn" data-act="t-reset" aria-label="Reiniciar">${ic('reset')}</button><button type="button" class="play" data-act="t-play" aria-label="${playLbl}">${ic(playIcon)}</button><button type="button" class="rbtn" data-act="t-skip" aria-label="${flowFocus()?'Encerrar foco':'Pular etapa'}">${ic(flowFocus()?'stop':'skip')}</button></div><p class="mdesc">${esc(METHODS[T.method].d())}</p>`;
  const mine=S.tasks.filter(inMyDay).sort(mySort),rest=S.tasks.filter(t=>!isDone(t)&&!inMyDay(t)).sort(byDate);
  const opt=t=>`<option value="${esc(t.id)}" ${t.id===T.task?'selected':''}>${esc(t.title)}</option>`;
  h+=`<div class="field" style="margin-top:18px"><label class="lbl" for="focTask">Tarefa em foco</label><select class="inp" id="focTask"><option value="">Sem tarefa escolhida</option>${mine.length?`<optgroup label="Meu dia">${mine.map(opt).join('')}</optgroup>`:''}${rest.length?`<optgroup label="Outras tarefas">${rest.slice(0,80).map(opt).join('')}</optgroup>`:''}</select></div>`;
  h+=focusStats();
  openSheet(h,{keep,tall:true});
  tickUI();
  clearTimeout(fxTimer);if(fx)fxTimer=setTimeout(()=>{if(S.sheet&&S.sheet.type==='focus')openFocus(true);},3600-(Date.now()-T.doneFx));
}
function focusStats(){
  const days=[];for(let i=6;i>=0;i--)days.push(addDays(today(),-i));
  const vals=days.map(focusMinOn),sel=Math.min(6,Math.max(0,S.chartSel));
  const top=Math.max(60,Math.ceil(Math.max(...vals)/30)*30),tot=vals.reduce((a,b)=>a+b,0);
  const W=320,H=150,L=34,R=8,Tp=10,B=26,pw=W-L-R,ph=H-Tp-B,bw=pw/7;
  let g='';[0,.5,1].forEach(f=>{const y=Tp+ph-f*ph;g+=`<line x1="${L}" x2="${W-R}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" style="stroke:var(--line)" stroke-width="1"/><text x="${L-6}" y="${(y+3.5).toFixed(1)}" text-anchor="end" font-size="10" style="fill:var(--faint);font-family:var(--f-ui)">${Math.round(top*f)}</text>`;});
  vals.forEach((v,i)=>{const x=L+i*bw,bh=v/top*ph,y=Tp+ph-bh,on=i===sel;g+=`<g data-act="bar" data-i="${i}" style="cursor:pointer"><rect x="${x.toFixed(1)}" y="${Tp}" width="${bw.toFixed(1)}" height="${ph+B}" style="fill:transparent"/>${v?`<rect x="${(x+bw*.2).toFixed(1)}" y="${y.toFixed(1)}" width="${(bw*.6).toFixed(1)}" height="${Math.max(2,bh).toFixed(1)}" rx="4" style="fill:var(--hi)" fill-opacity="${on?1:.45}"/>`:''}<text x="${(x+bw/2).toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="10.5" style="fill:var(${on?'--ink':'--muted'});font-family:var(--f-ui)" font-weight="${on?700:400}">${DOWS[parseISO(days[i]).getDay()]}</text></g>`;});
  const sd=days[sel],items=(S.focus[sd]&&S.focus[sd].items)||[];
  let h=`<div class="field" style="margin-top:18px"><div class="td-l"><b>Tempo de foco</b><small>${dur(tot)} nos últimos 7 dias</small></div><div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Minutos de foco por dia nos últimos 7 dias">${g}</svg></div>`;
  h+=`<div class="readout"><span><b>${relDay(sd)}</b>: ${dur(vals[sel])} de foco</span><span class="muted">${items.length} ${items.length===1?'sessão':'sessões'}</span></div>`;
  if(items.length)h+=`<div style="margin-top:6px">${items.slice().reverse().map(x=>{const t=x.task&&S.tasks.find(k=>k.id===x.task);return `<div class="log-row"><span class="tm">${esc(x.at)}</span><span>${esc((METHODS[x.m]||{n:x.m}).n)}${t?`, <span class="muted">${esc(t.title)}</span>`:''}</span><span>${x.min} min</span></div>`;}).join('')}</div>`;
  else h+=`<p class="hint" style="margin-top:6px">Conclua uma sessão de foco para ela aparecer aqui.</p>`;
  return h+'</div>';
}

/* ---------- backup ---------- */
async function exportData(){
  const data={app:'Feito',version:3,exportedAt:new Date().toISOString(),settings:S.settings,tasks:S.tasks,events:S.events,habits:S.habits,focus:S.focus};
  const json=JSON.stringify(data,null,1),name=`feito-backup-${today()}.json`;
  if(AND&&AND.saveFile){try{AND.saveFile(name,json);}catch(e){toast('Não foi possível exportar.');}return;}
  let dl=null;try{if(window.claude&&typeof window.claude.use==='function')dl=await window.claude.use('downloads');}catch(e){}
  if(dl){try{await dl.save({filename:name,data:json});toast('Backup salvo');return;}catch(e){if(e&&(e.code==='declined'||e.code==='rate_limited'))return;}}
  try{await navigator.clipboard.writeText(json);toast('Backup copiado. Cole num arquivo .json para guardar.');}catch(e){toast('Não foi possível exportar nesta tela.');}
}
const okId=id=>typeof id==='string'&&/^[A-Za-z0-9_\-.~:@+]{1,200}$/.test(id)&&id!=='.'&&id!=='..';
function readImport(file){
  const box=$('#impBox');if(!file||!box)return;
  const r=new FileReader();
  r.onload=()=>{
    let o=null;try{o=JSON.parse(String(r.result));}catch(e){}
    if(!o||typeof o!=='object'||!(Array.isArray(o.tasks)||Array.isArray(o.events)||Array.isArray(o.habits))){box.innerHTML='<p class="hint" style="color:var(--danger)">Este arquivo não é um backup do Feito.</p>';return;}
    const pick=a=>(Array.isArray(a)?a:[]).filter(x=>x&&typeof x==='object'&&okId(x.id));
    S.imp={tasks:pick(o.tasks),events:pick(o.events),habits:pick(o.habits),focus:o.focus&&typeof o.focus==='object'?o.focus:{},settings:o.settings&&typeof o.settings==='object'?o.settings:null};
    const fd=Object.keys(S.imp.focus).length;
    box.innerHTML=`<div class="banner" style="flex-direction:column;align-items:stretch"><span>O backup tem <b>${S.imp.tasks.length}</b> tarefas, <b>${S.imp.events.length}</b> eventos, <b>${S.imp.habits.length}</b> hábitos e <b>${fd}</b> dias de foco${S.imp.settings?', além dos ajustes':''}. Itens iguais são atualizados; nada é apagado.</span><div class="btns"><button type="button" class="btn primary" data-act="imp-go">Importar</button><button type="button" class="btn ghost" data-act="imp-cancel">Cancelar</button></div></div>`;
  };
  r.onerror=()=>{box.innerHTML='<p class="hint" style="color:var(--danger)">Não foi possível ler o arquivo.</p>';};
  r.readAsText(file);
}
async function applyImport(){
  const o=S.imp;if(!o)return;const box=$('#impBox');if(box)box.innerHTML='<div class="loading"><i></i>Importando…</div>';
  const items=[];o.tasks.forEach(t=>items.push(['tasks',t]));o.events.forEach(e=>items.push(['events',e]));o.habits.forEach(h=>items.push(['habits',h]));
  items.forEach(([c,it])=>{const arr=S[c],i=arr.findIndex(x=>x.id===it.id),v=clone(it);if(i>=0)arr[i]=v;else arr.push(v);});
  const fdays={};
  Object.keys(o.focus).forEach(d=>{if(!/^\d{4}-\d{2}-\d{2}$/.test(d))return;const inc=(o.focus[d]&&Array.isArray(o.focus[d].items))?o.focus[d].items:[],cur=(S.focus[d]&&S.focus[d].items)||[];const seen=new Set(cur.map(x=>`${x.at}|${x.m}|${x.min}`));fdays[d]={date:d,items:cur.concat(inc.filter(x=>x&&!seen.has(`${x.at}|${x.m}|${x.min}`)))};S.focus[d]=fdays[d];});
  if(o.settings)S.settings=merge(S.settings,o.settings);
  S._cats=null;let failed=false;
  if(S.mode==='db'&&Store.db){
    try{
      let n=0;const pause=()=>new Promise(r=>setTimeout(r,250));
      for(const [c,it] of items){await Store.db.doc(c+'/'+it.id).set(Store.body(it));if(++n%20===0)await pause();}
      for(const d of Object.keys(fdays)){await Store.db.doc('focus/'+d).set(clone(fdays[d]));if(++n%20===0)await pause();}
      if(o.settings)await Store.db.doc('config/settings').set(clone(S.settings));
    }catch(e){failed=true;Store.err(e);}
  }else Store.saveLocal();
  S.imp=null;closeSheet();
  if(!failed)toast(`Importado: ${o.tasks.length} tarefas, ${o.events.length} eventos e ${o.habits.length} hábitos.`);
}
async function wipeAll(){
  const tk=S.tasks.map(t=>t.id),ev=S.events.map(e=>e.id),hb=S.habits.map(h=>h.id),fd=Object.keys(S.focus);
  if(S.mode==='db'&&Store.db){
    S.tasks=[];S.events=[];S.habits=[];S.focus={};S._cats=null;render();
    try{let n=0;const pause=()=>new Promise(r=>setTimeout(r,250));
      for(const id of tk){await Store.db.doc('tasks/'+id).delete();if(++n%20===0)await pause();}
      for(const id of ev){await Store.db.doc('events/'+id).delete();if(++n%20===0)await pause();}
      for(const id of hb){await Store.db.doc('habits/'+id).delete();if(++n%20===0)await pause();}
      for(const d of fd){await Store.db.doc('focus/'+d).delete();if(++n%20===0)await pause();}
    }catch(e){Store.err(e);}
  }else{S.tasks=[];S.events=[];S.habits=[];S.focus={};S._cats=null;Store.saveLocal();}
  T.task='';saveT();closeSheet();toast('Todos os dados foram apagados.');
}

/* ---------- formulários ---------- */
const FORMS={
  addbar(f){
    const i=f.elements.namedItem('t'),raw=i.value.trim();if(!raw)return;
    const r=parseQuick(raw,false),kind=f.dataset.kind,td=today(),l=S.list;
    if(!r.title){toast('Escreva o nome da tarefa.');return;}
    let date=r.date||null;const rem=r.start!=null?hhmm(r.start):null;
    if(rem&&!date)date=r.start>nowMin()?td:addDays(td,1);
    if(!date&&kind==='task'&&l==='next7')date=td;
    let ctx=r.cat||null;if(!ctx&&kind==='task'&&l.startsWith('cat:'))ctx=l.slice(4);
    const tags=kind==='task'&&l.startsWith('tag:')?[l.slice(4)]:[];
    const t={id:uid('t'),title:r.title,created:Date.now(),status:'todo',date,rem,ctx,prio:r.prio||0,tags};
    if(kind==='myday'){t.my=td;t.myAt=Date.now();}
    Store.putTask(t);i.value='';render();
    const n=document.getElementById('addInput');if(n)n.focus();
    toast(kind==='myday'?'Adicionada ao meu dia':date?`Tarefa criada para ${relDay(date).toLowerCase()}`:'Tarefa criada',()=>Store.delTask(t.id));
  },
  quick(){
    const v=qResolve();if(!v.title){const i=$('#qText');if(i)i.focus();toast('Escreva o que você quer criar.');return;}
    const more=S.q&&S.q.more;
    if(v.type==='event'){
      const ev={id:uid('e'),created:Date.now(),title:v.title,date:v.date,start:v.start,end:v.end,cat:v.cat,rep:'',notes:null};
      if(more){S.q=null;openEvent(null,ev);return;}
      Store.putEvent(ev);S.sel=ev.date;closeSheet();toast(`Evento criado: ${relDay(ev.date).toLowerCase()}, ${ev.start}`,()=>Store.delEvent(ev.id));
    }else if(v.type==='task'){
      const t={id:uid('t'),created:Date.now(),title:v.title,date:v.date,rem:v.rem,prio:v.prio,ctx:v.ctx,status:'todo',tags:v.tags||[]};
      if(v.my){t.my=today();t.myAt=Date.now();}
      Store.putTask(t);
      if(more){S.q=null;render();openTask(t.id);return;}
      closeSheet();toast(v.my?'Adicionada ao meu dia':v.date?`Tarefa criada para ${relDay(v.date).toLowerCase()}`:'Tarefa criada',()=>Store.delTask(t.id));
    }else{
      const pre={name:v.title,type:v.target?'count':'check',target:v.target||1,unit:v.unit||'',freq:v.freq,days:v.days.length?v.days:[1,2,3,4,5],per:v.per,cat:v.cat};
      if(more){S.q=null;openHabitEdit(null,pre);return;}
      const x=Object.assign({id:uid('h'),created:Date.now(),log:{},order:S.habits.length+1,time:'',start:today()},pre,{days:v.days});
      Store.putHabit(x);S.tab='habitos';closeSheet();toast('Hábito criado',()=>Store.delHabit(x.id));
    }
  },
  ev(f){
    const el=n=>f.elements.namedItem(n),seg=segOf(f),tg=tgOf(f),title=el('title').value.trim();
    if(!title){el('title').focus();return;}
    const id=f.dataset.id,old=id?S.events.find(x=>x.id===id):null,allDay=tg('allday');
    let start=el('start').value||'09:00',end=el('end').value||'10:00';
    if(!allDay&&toMin(end)<=toMin(start)&&toMin(end)!==0){toast('O fim precisa ser depois do início.');el('end').focus();return;}
    const ev=Object.assign({},old||{id:uid('e'),created:Date.now()},{title,date:el('date').value||S.sel,start,end,allDay,cat:seg('cat')||firstCat(),rep:seg('rep')||'',alert:seg('alert')||'alarm',lead:+seg('lead')||0,notes:el('notes').value.trim()||null});
    delete ev.ex;if(f.dataset.task)ev.task=f.dataset.task;
    Store.putEvent(ev);S.sel=ev.date;S.calMonth=ev.date.slice(0,7);closeSheet();toast(old?'Evento salvo':'Evento criado');
  },
  habit(f){
    const el=n=>f.elements.namedItem(n),seg=segOf(f),name=el('name').value.trim();
    if(!name){el('name').focus();return;}
    const type=seg('type')||'check',freq=seg('freq')||'daily';
    const days=[...f.querySelectorAll('[data-seg="days"] [aria-pressed="true"]')].map(b=>+b.dataset.v);
    if(freq==='days'&&!days.length){toast('Escolha pelo menos um dia da semana.');return;}
    const num=(n,d,a,b)=>{const v=parseInt(el(n).value,10);return isNaN(v)?d:Math.min(b,Math.max(a,v));};
    const id=f.dataset.id,old=id?S.habits.find(x=>x.id===id):null;
    const h=Object.assign({},old||{id:uid('h'),created:Date.now(),log:{},order:S.habits.length+1});
    Object.assign(h,{name,type,target:type==='count'?num('target',1,1,999):1,unit:type==='count'?el('unit').value.trim():'',freq,days,per:num('per',3,1,7),time:el('time').value||'',cat:seg('cat')||firstCat(),start:el('start').value||today()});
    delete h.ex;delete h.shift;
    Store.putHabit(h);
    if(old){openHabit(h.id);render();}else{S.tab='habitos';closeSheet();}
    toast(old?'Hábito salvo':'Hábito criado');
  },
  cat(f){
    const name=f.elements.namedItem('name').value.trim();if(!name){f.elements.namedItem('name').focus();return;}
    const color=segOf(f)('color')||freeColor(),k=f.dataset.k,sh=S.sheet||{};
    if(k){Store.putSettings(Object.assign({},S.settings,{cats:cats().map(c=>c.k===k?Object.assign({},c,{n:name,c:color}):Object.assign({},c))}));toast('Lista salva');render();openCats();return;}
    const nk=newCat(name,color);toast(`Lista “${name}” criada`);
    if(sh.ret==='task'&&sh.task){const t=S.tasks.find(x=>x.id===sh.task);if(t)Store.putTask(Object.assign({},t,{ctx:nk}));render();openTask(sh.task);return;}
    render();openCats();
  },
  'set-perfil'(f){setSettings({name:f.elements.namedItem('pName').value.trim().slice(0,40)});render();openSettings();toast('Nome salvo');},
  'set-aparencia'(f){const sg=segOf(f);setSettings({theme:sg('theme')||'auto',home:sg('home')||'tarefas'});saveView();render();openSettings();toast('Aparência salva');},
  'set-meudia'(f){setSettings({myday:Object.assign({},S.settings.myday,{sugg:tgOf(f)('sugg')})});render();openSettings();toast('Ajuste salvo');},
  'set-pomo'(f){const v=(n,d,a,b)=>{const x=parseInt(f.elements.namedItem(n).value,10);return isNaN(x)?d:Math.min(b,Math.max(a,x));};setSettings({pomo:{focus:v('pF',25,1,180),short:v('pS',5,1,60),long:v('pL',15,1,90),every:v('pE',4,1,12)}});render();openSettings();toast('Tempos salvos');},
  'set-alarmes'(f){const sg=segOf(f);setSettings({alerts:{mode:sg('alMode')||'alarm',lead:+sg('alLead')||0},rem:{mode:sg('remMode')||'notif'}});render();openSettings();toast('Avisos salvos');},
  welcome(f){const n=f.elements.namedItem('wName').value.trim().slice(0,40);setSettings({name:n,onboarded:true});closeSheet();toast(n?`Que bom ter você aqui, ${n}!`:'Tudo pronto. Bom proveito!');}
};

  'plan-end'(){closeSheet();switchTab('meudia');},
  'focus-open'(){closeMenu();if(!T.task){const first=S.tasks.filter(inMyDay).sort(mySort)[0];if(first&&!timerActive()){T.task=first.id;saveT();}}openFocus();renderFocusBar();},
  'focus-task'(el){tdCommitText();T.task=el.dataset.id;saveT();openFocus();renderFocusBar();},
  'block-task'(el){
    tdCommitText();const t=S.tasks.find(x=>x.id===el.dataset.id);if(!t)return;
    const base=t.rem?toMin(t.rem):t.date&&t.date>today()?9*60:Math.min(22*60,(Math.floor(nowMin()/60)+1)*60),end=Math.min(1439,base+(+t.est||30));
    openEvent(null,{title:t.title,date:t.date&&t.date>=today()?t.date:today(),start:hhmm(base),end:hhmm(end),cat:catOf(t.ctx)?t.ctx:firstCat(),task:t.id});
  },
  'del-task'(el){if(!armed(el,'Toque de novo para excluir'))return;const id=el.dataset.id;S.sheet=null;$('#sheetWrap').hidden=true;$('#sheet').innerHTML='';document.body.style.overflow='';deleteTask(id);},
  'td-done'(){const s=S.sheet;if(!s)return;tdCommitText();const t=S.tasks.find(x=>x.id===s.id);if(!t)return;if(isDone(t)){reopenTask(t.id);openTask(t.id,true);}else{completeTask(t.id);openTask(t.id,true);}},
  'td-my'(){const s=S.sheet;if(!s)return;const t=S.tasks.find(x=>x.id===s.id);if(!t)return;tdCommitText();setMyDay(t.id,!inMyDay(t));render();openTask(t.id,true);},
  'td-pin'(){const s=S.sheet;if(!s)return;const t=S.tasks.find(x=>x.id===s.id);if(!t)return;tdPatch({pin:!t.pin,my:today(),myAt:t.myAt||Date.now()});},
  tf(el){
    const f=el.dataset.f,v=el.dataset.v;
    if(f==='date')tdPatch({date:v||null});
    else if(f==='rem')tdPatch({rem:v||null});
    else if(f==='prio')tdPatch({prio:+v||0});
    else if(f==='ctx')tdPatch({ctx:v||null});
    else if(f==='rep'){const s=S.sheet,t=s&&S.tasks.find(x=>x.id===s.id);tdPatch(v&&t&&!t.date?{rep:v,date:today()}:{rep:v||''});}
    else if(f==='remMode')tdPatch({remMode:v});
    else if(f==='status')tdPatch({status:v});
  },
  'tag-rm'(el){const s=S.sheet,t=s&&S.tasks.find(x=>x.id===s.id);if(t)tdPatch({tags:tagsOf(t).filter(g=>g!==el.dataset.v)});},
  'tag-add'(el){addTag(el.dataset.v);},
  'sub-tog'(el){const s=S.sheet,t=s&&S.tasks.find(x=>x.id===s.id);if(!t)return;tdCommitText();const t2=S.tasks.find(x=>x.id===s.id);tdPatch({subs:subsOf(t2).map(x=>x.id===el.dataset.v?Object.assign({},x,{done:!x.done}):x)});},
  'sub-rm'(el){const s=S.sheet,t=s&&S.tasks.find(x=>x.id===s.id);if(!t)return;tdCommitText();const t2=S.tasks.find(x=>x.id===s.id);tdPatch({subs:subsOf(t2).filter(x=>x.id!==el.dataset.v)});},
  'td-menu'(el){const s=S.sheet;if(!s)return;openMenu(el,[{act:'td-dup',icon:'copy',label:'Duplicar'},{act:'td-later',icon:'later',label:'Adiar para amanhã'},{sep:1},{act:'td-del',icon:'trash',label:'Excluir',danger:true}]);},
  'td-dup'(){closeMenu();const s=S.sheet;if(!s)return;tdCommitText();const t=S.tasks.find(x=>x.id===s.id);if(!t)return;const n=Object.assign(clone(t),{id:uid('t'),created:Date.now(),status:'todo',doneAt:null,doneTs:null,title:t.title+' (cópia)'});delete n.ex;Store.putTask(n);render();openTask(n.id);toast('Tarefa duplicada');},
  'td-later'(){closeMenu();const s=S.sheet;if(!s)return;tdPatch({date:addDays(today(),1)});toast('Adiada para amanhã');},
  'td-del'(){closeMenu();const s=S.sheet;if(!s)return;const id=s.id;S.sheet=null;$('#sheetWrap').hidden=true;$('#sheet').innerHTML='';document.body.style.overflow='';deleteTask(id);},
  'menu-habits'(el){openMenu(el,[{act:'show-arch',icon:'archive',label:S.showArch?'Ocultar arquivados':'Mostrar arquivados'},{act:'new-habit',icon:'plus',label:'Novo hábito'},{sep:1},{act:'settings',icon:'gear',label:'Ajustes'}]);},
  'show-arch'(){S.showArch=!S.showArch;closeMenu();render();if(S.showArch&&!S.habits.some(h=>h.archived))toast('Nenhum hábito arquivado');},
  'new-habit'(el){closeMenu();openHabitEdit(null,el&&el.dataset&&el.dataset.name?{name:el.dataset.name}:null);},
  'h-open':el=>openHabit(el.dataset.id),
  'h-edit':el=>openHabitEdit(el.dataset.id),
  'h-ring'(el){if(lpFired){lpFired=false;return;}const h=S.habits.find(x=>x.id===el.dataset.id);if(!h)return;const d=el.dataset.d||today();if(h.type==='count'&&!hDone(h,d))hInc(h,d,1);else hToggle(h,d);render();},
  'h-tog'(el){const h=S.habits.find(x=>x.id===el.dataset.id);if(!h)return;hToggle(h,el.dataset.d||today());render();openHabit(h.id,true);},
  'h-inc'(el){const h=S.habits.find(x=>x.id===el.dataset.id);if(!h)return;hInc(h,el.dataset.d||today(),+el.dataset.v);render();openHabit(h.id,true);},
  'h-cell'(el){const h=S.habits.find(x=>x.id===el.dataset.id);if(!h)return;hToggle(h,el.dataset.d);render();openHabit(h.id,true);},
  'h-mon'(el){const h=S.habits.find(x=>x.id===el.dataset.id);if(!h)return;const cur=S.hMonth[h.id]||today().slice(0,7),nx=addMonths(cur+'-01',+el.dataset.v).slice(0,7);if(nx>today().slice(0,7))return;S.hMonth[h.id]=nx;openHabit(h.id,true);},
  'h-sel'(el){S.hDay=el.dataset.d;render();},
  'h-arch'(el){const h=S.habits.find(x=>x.id===el.dataset.id);if(!h)return;Store.putHabit(Object.assign({},h,{archived:!h.archived}));if(sheetOpen())closeSheet();else render();toast(h.archived?'Hábito reativado':'Hábito arquivado');},
  'h-del'(el){if(!armed(el,'Toque de novo para excluir'))return;const x=S.habits.find(y=>y.id===el.dataset.id);Store.delHabit(el.dataset.id);closeSheet();toast('Hábito excluído',x?()=>Store.putHabit(x):null);},
  seg(el){
    const g=el.parentElement,was=el.getAttribute('aria-pressed')==='true';
    if(g.dataset.multi){el.setAttribute('aria-pressed',was?'false':'true');return;}
    if(was&&g.dataset.req)return;
    g.querySelectorAll('button[data-act="seg"]').forEach(b=>b.setAttribute('aria-pressed','false'));
    if(!was)el.setAttribute('aria-pressed','true');
    hFormSync(el.closest('form'));
  },
  tg(el){el.setAttribute('aria-pressed',el.getAttribute('aria-pressed')==='true'?'false':'true');evFormSync(el.closest('form'));},
  setv(el){const i=document.getElementById(el.dataset.t);if(i){i.value=el.dataset.v;i.focus();}},
  qtype(el){if(!S.q)return;S.q.type=el.dataset.v;S.q.touched=true;syncQType();qUpdate();const i=$('#qText');if(i)i.focus();},
  'q-tok'(el){const i=$('#qText');if(!i)return;i.value=(i.value.replace(/\s+$/,'')+' '+el.dataset.t+' ').replace(/^\s+/,'');i.focus();qUpdate();},
  'q-date'(el){if(!S.q)return;S.q.date=S.q.date===el.dataset.v?null:el.dataset.v;qUpdate();},
  'q-my'(){if(!S.q)return;S.q.my=!S.q.my;qUpdate();},
  'q-more'(){if(!S.q)return;S.q.more=true;const v=qResolve();
    if(!v.title){S.q.more=false;
      if(v.type==='event'){S.q=null;openEvent(null,{date:v.date,start:v.start,end:v.end,cat:v.cat});}
      else if(v.type==='habit'){S.q=null;openHabitEdit(null);}
      else{const t={id:uid('t'),created:Date.now(),title:'Nova tarefa',status:'todo',date:v.date,ctx:v.ctx,my:v.my?today():null,myAt:v.my?Date.now():null};Store.putTask(t);S.q=null;render();openTask(t.id);const ti=$('#tdTitle');if(ti){ti.focus();ti.select();}}
      return;}
    FORMS.quick();},
  'cat-edit'(el){closeMenu();openCatEdit(el.dataset.k||null,el.dataset.ret||null);},
  cats:()=>openCats(),
  'back-task'(){const s=S.sheet;if(s&&s.task)openTask(s.task);else closeSheet();},
  'cat-del'(el){if(!armed(el,'Toque de novo para excluir'))return;delCat(el.dataset.k);render();openCats();toast('Lista excluída');},
  'cat-inline'(el){const b=document.getElementById('catNew-'+el.dataset.for);if(!b)return;b.hidden=!b.hidden;if(!b.hidden){const i=document.getElementById('catNewName-'+el.dataset.for);if(i)i.focus();}},
  'cat-add-inline'(el){
    const name=el.dataset.for,i=document.getElementById('catNewName-'+name),v=i?i.value.trim():'';
    if(!v){if(i)i.focus();toast('Dê um nome para a lista.');return;}
    const box=document.getElementById('catNew-'+name),pick=box&&box.querySelector('[aria-pressed="true"]');
    const k=newCat(v,pick?pick.dataset.v:freeColor());
    const seg=document.querySelector(`.seg[data-seg="${name}"]`);
    if(seg){const tmp=document.createElement('div');tmp.innerHTML=catSeg(name,k,{req:!!seg.dataset.req});seg.replaceWith(tmp.children[0]);box.replaceWith(tmp.children[0]);}
    toast(`Lista “${v}” criada`);
  },
  'set-perfil':()=>openSetPerfil(),'set-aparencia':()=>openSetAparencia(),'set-meudia':()=>{closeMenu();openSetMeuDia();},
  'set-pomo':()=>openSetPomo(),'set-alarmes':()=>openSetAlarmes(),'set-dados':()=>openSetDados(),'set-sobre':()=>openSobre(),
  'al-open'(el){try{AND.openAlarmSetting(el.dataset.w);}catch(e){}},
  'al-test'(){if(!AND||!AND.testAlarm){toast('O teste funciona no app Feito do celular.');return;}try{AND.testAlarm();toast('Bloqueie a tela: o alarme toca em 5 segundos.');}catch(e){}},
  export:()=>exportData(),
  import(){const i=$('#impFile');if(i){i.value='';i.click();}},
  'imp-go':()=>applyImport(),
  'imp-cancel'(){S.imp=null;const b=$('#impBox');if(b)b.innerHTML='';},
  'clear-ex'(el){
    if(!armed(el,'Toque de novo para apagar'))return;
    S.tasks.filter(t=>t.ex).map(t=>t.id).forEach(id=>Store.delTask(id));
    S.events.filter(e=>e.ex).map(e=>e.id).forEach(id=>Store.delEvent(id));
    S.habits.filter(h=>h.ex).map(h=>h.id).forEach(id=>Store.delHabit(id));
    if(sheetOpen())closeSheet();else render();toast('Exemplos apagados');
  },
  wipe(el){if(!armed(el,'Toque de novo para apagar tudo'))return;wipeAll();},
  't-play'(){if(T.running){if(flowFocus())tFlowStop();else tPause();}else tStart();},
  't-reset':()=>tReset(),
  't-skip':()=>tSkip(),
  't-method'(el){const v=el.dataset.v;if(v===T.method)return;if(T.running){toast('Pause o timer para trocar de modo.');return;}Object.assign(T,{method:v,phase:'focus',remain:null,flowAcc:0,cycle:1,doneFx:0});saveT();focusChanged();},
  't-box'(el){T.box=+el.dataset.v;T.remain=null;saveT();openFocus(true);},
  bar(el){S.chartSel=+el.dataset.i;openFocus(true);},
  undo(){const f=undoFn;undoFn=null;clearTimeout(toastT);$('#toast').hidden=true;if(f){f();render();if(S.sheet&&S.sheet.type==='task')openTask(S.sheet.id,true);}}
};

/* ---------- eventos globais ---------- */
let justSwiped=0,lpFired=false;
document.addEventListener('click',e=>{
  if(Date.now()-justSwiped<380){e.preventDefault();return;}
  const m=$('#menu');
  if(m&&!m.hidden&&!m.contains(e.target)&&!e.target.closest('[data-act^="menu-"],[data-act="td-menu"]')){closeMenu();}
  if(e.target===$('#sheetWrap')){closeSheet();return;}
  if(e.target===$('#drawerScrim')){closeDrawer();return;}
  const el=e.target.closest('[data-act]');if(!el||el.disabled)return;
  const f=ACT[el.dataset.act];if(f){f(el,e);if(m&&m.contains(el))closeMenu();}
});
document.addEventListener('submit',e=>{const f=e.target;if(!f.dataset||!f.dataset.form)return;e.preventDefault();const h=FORMS[f.dataset.form];if(h)h(f);});
document.addEventListener('change',e=>{
  const id=e.target.id;
  if(id==='focTask'){T.task=e.target.value;saveT();openFocus(true);renderFocusBar();}
  else if(id==='impFile'&&e.target.files&&e.target.files[0])readImport(e.target.files[0]);
  else if(id==='tdDate')tdPatch({date:e.target.value||null});
  else if(id==='tdRem')tdPatch({rem:e.target.value||null});
  else if(id==='tdTitle'||id==='tdNotes'||(e.target.dataset&&e.target.dataset.sub))tdCommitText();
});
document.addEventListener('input',e=>{
  const t=e.target,id=t.id;
  if(id==='qText')qUpdate();
  else if(id==='sInp')renderSearch(t.value);
  else if(id==='addInput'){const b=t.closest('.addbar').querySelector('.go');if(b)b.hidden=!t.value.trim();}
  else if(id==='tdTitle'){t.style.height='auto';t.style.height=t.scrollHeight+'px';tdText();}
  else if(id==='tdNotes'||(t.dataset&&t.dataset.sub))tdText();
});
document.addEventListener('keydown',e=>{
  const t=e.target;
  if(e.key==='Escape'){if(!$('#menu').hidden){closeMenu();return;}if(sheetOpen()){closeSheet();return;}if(drawerOpen()){closeDrawer();return;}}
  if(e.key==='Enter'&&t&&t.id==='tdTitle'){e.preventDefault();t.blur();tdCommitText();}
  if((e.key==='Enter'||e.key===',')&&t&&t.id==='tdTag'){e.preventDefault();const v=t.value;t.value='';addTag(v);}
  if(e.key==='Enter'&&t&&t.id==='tdSub'){e.preventDefault();const v=t.value.trim();if(!v)return;const s=S.sheet,task=s&&S.tasks.find(x=>x.id===s.id);if(!task)return;tdCommitText();const t2=S.tasks.find(x=>x.id===s.id);tdPatch({subs:subsOf(t2).concat([{id:uid('s'),t:v,done:false}])},'tdSub');}
  if(e.key==='Enter'&&t&&t.dataset&&t.dataset.sub){e.preventDefault();t.blur();tdCommitText();}
});

/* ---------- gestos: deslizar tarefas e dias, segurar no hábito ---------- */
let SW=null,lpT=null,lpXY=null;
document.addEventListener('pointerdown',e=>{
  if(e.pointerType==='mouse')return;
  const ring=e.target.closest('.ring[data-act="h-ring"],.hchip[data-act="h-ring"]');
  if(ring){clearTimeout(lpT);lpFired=false;lpXY=[e.clientX,e.clientY];lpT=setTimeout(()=>{const h=S.habits.find(x=>x.id===ring.dataset.id);if(!h||!hVal(h,ring.dataset.d))return;lpFired=true;hInc(h,ring.dataset.d,h.type==='count'?-1:-hVal(h,ring.dataset.d));buzz(30);render();toast(h.type==='count'?'Tirei 1':'Desmarcado');},550);return;}
  const row=e.target.closest('.trow');
  if(row&&!row.classList.contains('done')&&!e.target.closest('.chk')){SW={row,x:e.clientX,y:e.clientY,dx:0,on:false};return;}
  if(e.target.closest('#calBody')&&!e.target.closest('.trow'))SW={cal:true,x:e.clientX,y:e.clientY,dx:0,on:false};
},{passive:true});
document.addEventListener('pointermove',e=>{
  if(lpT&&lpXY&&Math.hypot(e.clientX-lpXY[0],e.clientY-lpXY[1])>10){clearTimeout(lpT);lpT=null;}
  if(!SW)return;const dx=e.clientX-SW.x,dy=e.clientY-SW.y;
  if(!SW.on){if(Math.abs(dy)>12&&Math.abs(dy)>Math.abs(dx)){SW=null;return;}if(Math.abs(dx)>16&&Math.abs(dx)>Math.abs(dy)*1.4){SW.on=true;if(SW.row)SW.row.classList.add('drag');}else return;}
  SW.dx=dx;
  if(SW.row){const inn=SW.row.querySelector('.trow-in');inn.style.transform=`translateX(${dx}px)`;SW.row.classList.toggle('go-r',dx>0);SW.row.classList.toggle('go-l',dx<0);}
},{passive:true});
function endSwipe(cancel){
  clearTimeout(lpT);lpT=null;
  const s=SW;SW=null;if(!s||!s.on)return;justSwiped=Date.now();
  if(s.row){
    const inn=s.row.querySelector('.trow-in'),id=s.row.dataset.id;s.row.classList.remove('drag');
    if(!cancel&&s.dx>90){inn.style.transform='translateX(105%)';setTimeout(()=>completeTask(id),170);}
    else if(!cancel&&s.dx<-90){inn.style.transform='translateX(-105%)';setTimeout(()=>deleteTask(id),170);}
    else{inn.style.transform='';s.row.classList.remove('go-r','go-l');}
  }else if(s.cal&&!cancel&&Math.abs(s.dx)>60)calShift(s.dx<0?1:-1);
}
document.addEventListener('pointerup',()=>endSwipe(false));
document.addEventListener('pointercancel',()=>endSwipe(true));
document.addEventListener('contextmenu',e=>{if(e.target.closest('.ring,.hchip'))e.preventDefault();});

/* ---------- celular: voltar e retomar ---------- */
window.ritmoBack=function(){
  if(!$('#menu').hidden){closeMenu();return true;}
  if(sheetOpen()){closeSheet();return true;}
  if(drawerOpen()){closeDrawer();return true;}
  const home=S.settings.home||'tarefas';
  if(S.tab!==home){switchTab(home);return true;}
  return false;
};
window.ritmoResume=function(){
  const b=$('#alStatus');if(b&&sheetOpen())b.innerHTML=alStatusHtml();
  if(!sheetOpen())render();
};

/* ---------- início ---------- */
function onReady(){
  if(!S.nav&&TABS.some(t=>t[0]===S.settings.home))S.tab=S.settings.home;
  saveView();
  const real=S.tasks.some(t=>!t.ex)||S.events.some(e=>!e.ex)||S.habits.some(h=>!h.ex);
  if(!S.settings.onboarded&&!real&&!sheetOpen())setTimeout(()=>{if(!sheetOpen())openWelcome();},300);
}
let lastMin=-1,lastDay=today();
setInterval(()=>{
  if(T.running&&!flowFocus()&&T.endAt<=Date.now())tComplete();
  tickUI();
  const m=nowMin();
  if(m!==lastMin){
    const first=lastMin<0;lastMin=m;
    if(!first&&!sheetOpen()){const a=document.activeElement;if(!(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))){if(today()!==lastDay){lastDay=today();S.hDay=today();}render();}}
  }
},500);
window.addEventListener('scroll',()=>{$('#bar').classList.toggle('sh',window.scrollY>4);},{passive:true});
renderTabs();
render();
Store.init();
if(T.running)nativeAlarm();
</script>
