<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Feito</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Figtree:wght@400..800&display=swap">
<style>
/* Layout: coluna única de celular no estilo Any.do — barra superior fixa com o título da tela, listas em linhas com seções por prazo, barra de abas com o + no centro e folhas que sobem de baixo para editar. Marca: azul-marinho com o âmbar do "feito". */
:root{
  --bg:#ffffff; --bg-2:#f4f5f8; --surface:#ffffff; --surface-2:#f2f4f7; --surface-3:#e8ebf1;
  --line:#e7eaf0; --line-2:#d5dae3;
  --ink:#172033; --muted:#636d84; --faint:#98a1b3;
  --accent:#1d2b4f; --accent-ink:#ffffff; --accent-soft:rgba(29,43,79,.07);
  --hi:#f2a417; --hi-ink:#1d1405; --hi-soft:rgba(242,164,23,.17); --hi-text:#975f00;
  --danger:#d93f3f; --danger-soft:rgba(217,63,63,.1); --ok:#1f9d61; --ok-soft:rgba(31,157,97,.12);
  --pri-1:#3b78e7; --pri-2:#e8930c; --pri-3:#d93f3f;
  --p-ouro:#c9900a; --p-azul:#2f6fe4; --p-violeta:#7b5ce0; --p-verde:#1f9d61; --p-terracota:#e0663a; --p-ardosia:#64748b;
  --p-turquesa:#0d9e9d; --p-rosa:#dc4c8b; --p-ambar:#ea8a00; --p-indigo:#4f55d9; --p-oliva:#78961c; --p-vinho:#c0394a;
  --logo-bg:#1d2b4f; --logo-f:#ffffff; --logo-c:#f5ad24;
  --scrim:rgba(13,18,32,.42); --shadow:0 12px 32px rgba(23,32,51,.16); --shadow-s:0 2px 10px rgba(23,32,51,.10);
  --f-display:"Bricolage Grotesque","Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-ui:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --tabbar:66px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1220; --bg-2:#131a2b; --surface:#141b2b; --surface-2:#1b2336; --surface-3:#242e45;
  --line:#222b3f; --line-2:#2f3b55;
  --ink:#eceff6; --muted:#9ca6ba; --faint:#6a748b;
  --accent:#f5b83d; --accent-ink:#1d1405; --accent-soft:rgba(245,184,61,.13);
  --hi:#f5b83d; --hi-ink:#1d1405; --hi-soft:rgba(245,184,61,.16); --hi-text:#f5b83d;
  --danger:#f06a6a; --danger-soft:rgba(240,106,106,.14); --ok:#4cc38a; --ok-soft:rgba(76,195,138,.14);
  --pri-1:#78a4f5; --pri-2:#f5b83d; --pri-3:#f06a6a;
  --p-ouro:#f0b43c; --p-azul:#6e9cf5; --p-violeta:#a38bf2; --p-verde:#4cc38a; --p-terracota:#f28b63; --p-ardosia:#94a3b8;
  --p-turquesa:#3cc8c6; --p-rosa:#f27aae; --p-ambar:#ffaa33; --p-indigo:#8a8ff0; --p-oliva:#a9c24b; --p-vinho:#ee6f7f;
  --logo-bg:#24345f; --logo-f:#ffffff; --logo-c:#f5b83d;
  --scrim:rgba(0,0,0,.58); --shadow:0 14px 36px rgba(0,0,0,.5); --shadow-s:0 2px 10px rgba(0,0,0,.4);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0d1220; --bg-2:#131a2b; --surface:#141b2b; --surface-2:#1b2336; --surface-3:#242e45;
  --line:#222b3f; --line-2:#2f3b55;
  --ink:#eceff6; --muted:#9ca6ba; --faint:#6a748b;
  --accent:#f5b83d; --accent-ink:#1d1405; --accent-soft:rgba(245,184,61,.13);
  --hi:#f5b83d; --hi-ink:#1d1405; --hi-soft:rgba(245,184,61,.16); --hi-text:#f5b83d;
  --danger:#f06a6a; --danger-soft:rgba(240,106,106,.14); --ok:#4cc38a; --ok-soft:rgba(76,195,138,.14);
  --pri-1:#78a4f5; --pri-2:#f5b83d; --pri-3:#f06a6a;
  --p-ouro:#f0b43c; --p-azul:#6e9cf5; --p-violeta:#a38bf2; --p-verde:#4cc38a; --p-terracota:#f28b63; --p-ardosia:#94a3b8;
  --p-turquesa:#3cc8c6; --p-rosa:#f27aae; --p-ambar:#ffaa33; --p-indigo:#8a8ff0; --p-oliva:#a9c24b; --p-vinho:#ee6f7f;
  --logo-bg:#24345f; --logo-f:#ffffff; --logo-c:#f5b83d;
  --scrim:rgba(0,0,0,.58); --shadow:0 14px 36px rgba(0,0,0,.5); --shadow-s:0 2px 10px rgba(0,0,0,.4);
  color-scheme:dark;
}

/* Base */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;padding-bottom:calc(var(--tabbar) + 18px + env(safe-area-inset-bottom,0px));min-height:100%}
body.fb-on{padding-bottom:calc(var(--tabbar) + 76px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:12;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
h1,h2,h3,p{margin:0}
h1,h2,h3{text-wrap:balance}
svg{flex:none}
.wrap{width:100%;max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Barra superior */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.bar.sh{box-shadow:0 1px 0 var(--line)}
.bar-in{display:flex;align-items:center;gap:4px;min-height:58px;padding-block:6px}
.bar-t{flex:1;min-width:0;display:flex;align-items:center;gap:6px;font-family:var(--f-display);font-weight:750;font-size:22px;letter-spacing:-.01em;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:4px}
.bar-t.btn-t{cursor:pointer;border-radius:10px;padding:4px 6px 4px 4px;margin-left:-2px}
.bar-t.btn-t svg{width:18px;height:18px;color:var(--muted);transition:transform .18s}
.bar-t.btn-t[aria-expanded="true"] svg{transform:rotate(180deg)}
.bar-t span{overflow:hidden;text-overflow:ellipsis}
.ibtn{position:relative;width:42px;height:42px;border-radius:13px;display:grid;place-items:center;color:var(--ink);flex:none}
@media (hover:hover){.ibtn:hover{background:var(--surface-2)}}
.ibtn svg{width:23px;height:23px}
.ibtn .badge{position:absolute;top:5px;right:4px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--hi);color:var(--hi-ink);font-size:11px;font-weight:700;line-height:17px;text-align:center}
.tbtn{height:34px;padding:0 13px;border-radius:999px;border:1px solid var(--line-2);font-size:14px;font-weight:600;flex:none;margin-right:4px}

/* Telas */
main{padding-block:2px 24px;display:flex;flex-direction:column;gap:18px}
.hello{padding-top:6px}
.hello h1{font-family:var(--f-display);font-weight:780;font-size:clamp(28px,8vw,36px);letter-spacing:-.02em;line-height:1.08}
.hello p{color:var(--muted);font-size:15px;margin-top:6px}
.sec{display:flex;flex-direction:column}
.sec-h{display:flex;align-items:center;gap:8px;width:100%;padding:6px 0 4px;text-align:left}
.sec-h h2{font-size:16px;font-weight:700;letter-spacing:-.005em}
.sec-h .n{font-size:14px;color:var(--faint);font-weight:600;font-variant-numeric:tabular-nums}
.sec-h .sp{flex:1}
.sec-h .chev{width:18px;height:18px;color:var(--faint);transition:transform .18s}
.sec.closed .sec-h .chev{transform:rotate(-90deg)}
.sec.late .sec-h h2{color:var(--danger)}
.sec-h .act{font-size:14px;font-weight:600;color:var(--accent)}
.link{color:var(--accent);font-weight:650;font-size:14px;white-space:nowrap}
.hint{font-size:13.5px;color:var(--muted);max-width:60ch}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:34px 18px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:17px;font-weight:700}
.empty svg{width:42px;height:42px;color:var(--faint)}
.empty .btn{flex:none}
.banner{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px 12px;padding:11px 14px;border-radius:14px;background:var(--hi-soft);font-size:14px}
.loading{display:flex;align-items:center;gap:10px;color:var(--muted);padding:20px 0}
.loading i{width:9px;height:9px;border-radius:50%;background:var(--hi);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}

/* Campo de adicionar */
.addbar{display:flex;align-items:center;gap:10px;min-height:50px;padding:0 6px 0 14px;border-radius:15px;background:var(--surface-2);border:1px solid transparent}
.addbar:focus-within{border-color:var(--line-2);background:var(--surface)}
.addbar>svg{width:21px;height:21px;color:var(--muted)}
.addbar input{flex:1;min-width:0;border:0;background:transparent;font-size:16px;padding:12px 0;outline:none}
.addbar input::placeholder{color:var(--muted)}
.addbar .go{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);flex:none}
.addbar .go svg{width:20px;height:20px}
.addbar .go[hidden]{display:none}

/* Linhas de tarefa */
.rows{display:flex;flex-direction:column}
.trow{position:relative;overflow:hidden;touch-action:pan-y}
.trow-in{position:relative;display:flex;align-items:flex-start;gap:13px;padding:11px 2px 11px 0;background:var(--bg);transition:transform .2s ease}
.trow+.trow .trow-in::before{content:"";position:absolute;left:36px;right:0;top:0;height:1px;background:var(--line)}
.trow.drag .trow-in{transition:none}
.swipe-bg{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 20px;font-size:14px;font-weight:700}
.swipe-bg span{display:flex;align-items:center;gap:8px}
.swipe-bg svg{width:20px;height:20px}
.swipe-bg .r{color:var(--hi-ink);opacity:0}
.swipe-bg .l{color:#fff;opacity:0;margin-left:auto}
.trow.go-r .swipe-bg{background:var(--hi)} .trow.go-r .swipe-bg .r{opacity:1}
.trow.go-l .swipe-bg{background:var(--danger)} .trow.go-l .swipe-bg .l{opacity:1}
.chk{flex:none;width:23px;height:23px;margin-top:1px;border-radius:50%;border:2px solid var(--faint);display:grid;place-items:center;position:relative}
.chk::before{content:"";position:absolute;inset:-10px}
.chk.p1{border-color:var(--pri-1)} .chk.p2{border-color:var(--pri-2)} .chk.p3{border-color:var(--pri-3)}
@media (hover:hover){.chk:hover{background:var(--surface-2)}}
.chk svg{width:14px;height:14px;opacity:0;color:var(--hi-ink)}
.chk.on{background:var(--hi);border-color:var(--hi)}
.chk.on svg{opacity:1}
.chk.pop{animation:pop .32s ease-out}
@keyframes pop{40%{transform:scale(1.22)}100%{transform:scale(1)}}
.trow-main{flex:1;min-width:0;text-align:left;display:flex;flex-direction:column;gap:4px}
.trow-t{font-size:16px;line-height:1.35;overflow-wrap:anywhere}
.trow.done .trow-t{color:var(--faint);text-decoration:line-through;text-decoration-color:var(--faint)}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;font-size:13px;color:var(--muted);line-height:1.3}
.mi{display:inline-flex;align-items:center;gap:4px;white-space:nowrap;max-width:100%}
.mi svg{width:14px;height:14px}
.mi.late{color:var(--danger);font-weight:600}
.mi.today{color:var(--hi-text);font-weight:600}
.mi.sun{color:var(--hi-text)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--c,var(--faint));flex:none}
.flag{flex:none;margin-top:2px;width:20px;height:20px;display:grid;place-items:center}
.flag svg{width:17px;height:17px}
.flag.p1{color:var(--pri-1)} .flag.p2{color:var(--pri-2)} .flag.p3{color:var(--pri-3)}
.tag{display:inline-flex;align-items:center;font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.tag.ex{background:transparent;border:1px dashed var(--line-2)}
.more-row{display:flex;align-items:center;gap:8px;padding:8px 0 6px 36px;font-size:14px;font-weight:600;color:var(--accent)}
.more-row svg{width:18px;height:18px}

/* Quadro */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,86%);gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:8px;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px))) calc(-1 * max(16px,env(safe-area-inset-right,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));scroll-padding-inline:max(16px,env(safe-area-inset-left,0px))}
@media (min-width:760px){.board{grid-auto-flow:row;grid-template-columns:repeat(3,minmax(0,1fr));overflow:visible;margin-inline:0;padding-inline:0}}
.bcol{scroll-snap-align:start;background:var(--bg-2);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:9px;min-width:0;align-self:start}
.bcol-h{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;padding:2px 4px}
.bcol-h .n{color:var(--faint);font-weight:600}
.bcol-h .dot{width:8px;height:8px}
.bcard{background:var(--surface);border-radius:13px;padding:11px 12px;display:flex;flex-direction:column;gap:8px;box-shadow:0 1px 0 var(--line),0 0 0 1px var(--line);min-width:0}
.bcard .t{font-size:15px;line-height:1.35;overflow-wrap:anywhere;text-align:left}
.bcard.done .t{color:var(--faint);text-decoration:line-through}
.bmove{display:flex;justify-content:space-between;gap:6px}
.bmove button{font-size:12.5px;font-weight:600;color:var(--muted);padding:5px 9px;border-radius:9px;background:var(--surface-2)}
.bmove button:disabled{opacity:.35;cursor:default}
.bcol .empty-s{font-size:13px;color:var(--faint);padding:6px 4px}

/* Gaveta de listas */
.scrim{position:fixed;inset:0;z-index:30;background:var(--scrim);animation:fade .18s ease-out}
@keyframes fade{from{opacity:0}}
.drawer{position:fixed;z-index:31;top:0;bottom:0;left:0;width:min(86vw,350px);background:var(--surface);box-shadow:var(--shadow);overflow-y:auto;overscroll-behavior:contain;padding:calc(14px + env(safe-area-inset-top,0px)) 12px calc(20px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));animation:slide .22s ease-out}
@keyframes slide{from{transform:translateX(-24px);opacity:.4}}
.dr-brand{display:flex;align-items:center;gap:11px;padding:6px 8px 16px}
.dr-brand b{font-family:var(--f-display);font-size:24px;font-weight:800;letter-spacing:-.02em}
.logo{width:36px;height:36px;flex:none;display:block}
.dr-search{display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;border-radius:13px;background:var(--surface-2);color:var(--muted);font-size:15px;margin-bottom:10px}
.dr-search svg{width:19px;height:19px}
.dr-h{display:flex;align-items:center;justify-content:space-between;font-size:13.5px;font-weight:700;color:var(--muted);padding:16px 10px 6px}
.dr-h button{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:var(--accent)}
.dr-h button svg{width:19px;height:19px}
.dr-item{display:flex;align-items:center;gap:13px;width:100%;padding:11px 10px;border-radius:12px;font-size:15.5px;font-weight:550;text-align:left}
@media (hover:hover){.dr-item:hover{background:var(--surface-2)}}
.dr-item[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
.dr-item>svg{width:21px;height:21px;color:var(--muted)}
.dr-item[aria-current="true"]>svg{color:var(--accent)}
.dr-item .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dr-item .n{font-size:13.5px;color:var(--faint);font-weight:600;font-variant-numeric:tabular-nums}
.dr-item .dot{width:11px;height:11px;margin:0 5px}
.dr-sep{height:1px;background:var(--line);margin:10px 8px}

/* Menu suspenso */
.menu{position:fixed;z-index:40;min-width:230px;max-width:calc(100vw - 24px);background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:6px;animation:menu .14s ease-out}
@keyframes menu{from{opacity:0;transform:translateY(-4px)}}
.mitem{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;border-radius:11px;font-size:15px;text-align:left}
@media (hover:hover){.mitem:hover{background:var(--surface-2)}}
.mitem svg{width:20px;height:20px;color:var(--muted)}
.mitem .ck{margin-left:auto;color:var(--accent)}
.mitem.danger{color:var(--danger)} .mitem.danger svg{color:var(--danger)}
.mh{font-size:12.5px;font-weight:700;color:var(--faint);padding:8px 12px 4px}
.msep{height:1px;background:var(--line);margin:5px 6px}

/* Calendário */
.cal-strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;padding-block:2px 6px}
.wd{display:flex;flex-direction:column;align-items:center;gap:5px;padding:7px 0 6px;border-radius:14px;min-width:0}
.wd .w{font-size:12px;font-weight:600;color:var(--muted)}
.wd .d{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.wd.today .d{color:var(--hi-text);box-shadow:inset 0 0 0 2px var(--hi)}
.wd.sel .d{background:var(--accent);color:var(--accent-ink);box-shadow:none}
.wd .dots{display:flex;gap:3px;height:5px}
.wd .dots i,.md .dots i{width:5px;height:5px;border-radius:50%;background:var(--c,var(--faint))}
.mon{padding-bottom:8px}
.mon-h{display:flex;align-items:center;justify-content:space-between;padding:2px 0 6px}
.mon-h b{font-size:15px;font-weight:700}
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.mgrid .dw{font-size:12px;font-weight:600;color:var(--faint);text-align:center;padding:4px 0}
.md{display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0 6px;border-radius:12px;min-width:0}
.md .d{width:32px;height:32px;display:grid;place-items:center;border-radius:50%;font-size:15px;font-weight:550;font-variant-numeric:tabular-nums}
.md.out{opacity:.35}
.md.today .d{color:var(--hi-text);box-shadow:inset 0 0 0 2px var(--hi);font-weight:700}
.md.sel .d{background:var(--accent);color:var(--accent-ink);box-shadow:none}
.md .dots{display:flex;gap:3px;height:5px}
.cal-body{touch-action:pan-y;min-height:50vh}
.ag-day{display:flex;flex-direction:column}
.ag-h{position:sticky;top:calc(58px + env(safe-area-inset-top,0px));z-index:3;background:var(--bg);display:flex;align-items:baseline;gap:10px;padding:12px 0 6px}
.ag-h b{font-size:16px;font-weight:700}
.ag-h b::first-letter{text-transform:uppercase}
.ag-h span{font-size:14px;color:var(--muted)}
.ag-h.today b{color:var(--hi-text)}
.ag-item{display:flex;align-items:stretch;gap:12px;width:100%;text-align:left;padding:8px 0}
.ag-time{width:48px;flex:none;font-size:13.5px;font-weight:650;line-height:1.3;font-variant-numeric:tabular-nums;padding-top:1px}
.ag-time small{display:block;font-weight:500;color:var(--muted);font-size:12.5px}
.ag-bar{width:4px;border-radius:4px;background:var(--c);flex:none}
.ag-tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.ag-tx b{font-size:15.5px;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.ag-tx span{font-size:13px;color:var(--muted)}
.ag-item.past{opacity:.55}
.ag-gap{font-size:13.5px;color:var(--faint);padding:10px 0 10px 60px}
.ag-day .rows .trow-in{padding-left:0}
.ag-day .trow+.trow .trow-in::before{left:36px}
.allday{display:flex;flex-direction:column;gap:5px;padding:6px 0 10px 50px;border-bottom:1px solid var(--line)}
.ad-chip{display:flex;align-items:center;gap:8px;width:100%;padding:7px 10px;border-radius:10px;font-size:14px;font-weight:600;text-align:left;background:color-mix(in srgb,var(--c) 15%,var(--surface));min-width:0}
.ad-chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ad-chip .chk{width:18px;height:18px;border-width:2px}
.ad-chip .chk svg{width:11px;height:11px}
.ad-chip.done span{text-decoration:line-through;color:var(--faint)}
.tl-wrap{display:flex;padding-top:8px}
.tl-axis{width:46px;flex:none;position:relative;height:calc(24 * var(--hh))}
.tl-axis span{position:absolute;right:8px;transform:translateY(-50%);font-size:11.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.tl-cols{flex:1;min-width:0;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);border-left:1px solid var(--line)}
.tl{position:relative;height:calc(24 * var(--hh));border-right:1px solid var(--line)}
.tl:last-child{border-right:0}
.tl-wrap{--hh:52px}
.tl-wrap.dense{--hh:44px}
.hr{position:absolute;left:0;right:0;height:var(--hh);border-top:1px solid var(--line);display:block;width:100%}
@media (hover:hover){.hr:hover{background:var(--surface-2)}}
.blk{position:absolute;border-radius:9px;padding:4px 7px;font-size:12px;line-height:1.25;overflow:hidden;text-align:left;z-index:2;background:color-mix(in srgb,var(--c) 17%,var(--surface));border-left:3px solid var(--c);min-width:0}
.blk b{display:block;font-size:13px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
.blk span{color:var(--muted);font-size:11.5px;font-variant-numeric:tabular-nums}
.tl-wrap.dense .blk{padding:3px 4px;border-left-width:2px}
.tl-wrap.dense .blk b{font-size:11.5px;white-space:normal;line-height:1.15}
.tl-wrap.dense .blk span{display:none}
.nowl{position:absolute;left:-1px;right:0;height:0;border-top:2px solid var(--danger);z-index:3;pointer-events:none}
.nowl::before{content:"";position:absolute;left:-5px;top:-6px;width:10px;height:10px;border-radius:50%;background:var(--danger)}
.mcols{position:sticky;top:calc(58px + env(safe-area-inset-top,0px));z-index:4;background:var(--bg);display:flex;padding-left:46px;box-shadow:0 1px 0 var(--line)}
.mcols .mc{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0 8px;border-radius:12px}
.mcols .mc .w{font-size:12px;font-weight:600;color:var(--muted)}
.mcols .mc .d{width:30px;height:30px;display:grid;place-items:center;border-radius:50%;font-size:15px;font-weight:650;font-variant-numeric:tabular-nums}
.mcols .mc.today .d{color:var(--hi-text);box-shadow:inset 0 0 0 2px var(--hi)}
.mcols .mc.sel .d{background:var(--accent);color:var(--accent-ink);box-shadow:none}
.mcols .mc .x{font-size:11px;font-weight:700;color:var(--muted);background:var(--surface-2);border-radius:999px;padding:0 6px;margin-top:2px}
.mcols .mc .x:empty{visibility:hidden}

/* Meu dia */
.prog{display:flex;flex-direction:column;gap:8px}
.prog-row{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px;color:var(--muted)}
.prog-row b{color:var(--ink);font-weight:700}
.bar-p{height:7px;border-radius:7px;background:var(--surface-2);overflow:hidden}
.bar-p i{display:block;height:100%;border-radius:7px;background:var(--hi);transition:width .3s ease}
.cta-row{display:flex;gap:10px;flex-wrap:wrap}
.pillbtn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 15px 0 12px;border-radius:999px;background:var(--surface-2);font-size:14.5px;font-weight:650}
.pillbtn svg{width:19px;height:19px}
.pillbtn.hi{background:var(--hi);color:var(--hi-ink)}
.pillbtn .n{font-weight:700;color:var(--hi-text)}
.pillbtn.hi .n{color:var(--hi-ink)}
.sugg{border-radius:18px;background:var(--bg-2);padding:6px 14px 8px}
.sg-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.sg-row:first-of-type{border-top:0}
.sg-main{flex:1;min-width:0;text-align:left;display:flex;flex-direction:column;gap:3px}
.sg-main b{font-size:15px;font-weight:600;overflow-wrap:anywhere}
.sg-btn{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;flex:none}
.sg-btn svg{width:20px;height:20px}
.sg-btn.add{background:var(--accent);color:var(--accent-ink)}
.sg-btn.no{color:var(--muted)}
.evm{display:flex;flex-direction:column}
.chips-h{display:flex;flex-wrap:wrap;gap:8px}
.hchip{display:inline-flex;align-items:center;gap:9px;height:42px;padding:0 15px 0 6px;border-radius:999px;background:var(--surface-2);font-size:14.5px;font-weight:600;max-width:100%}
.hchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hchip.done{background:color-mix(in srgb,var(--c) 18%,var(--surface))}
.focus-card{display:flex;align-items:center;gap:14px;width:100%;padding:14px 16px;border-radius:18px;background:var(--bg-2);text-align:left}
.focus-card .fi{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--hi);color:var(--hi-ink);flex:none}
.focus-card .fi svg{width:22px;height:22px}
.focus-card b{display:block;font-size:15.5px}
.focus-card small{display:block;color:var(--muted);font-size:13px}

/* Hábitos */
.hweek{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.hwd{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0;border-radius:16px;min-width:0}
.hwd .w{font-size:12px;font-weight:600;color:var(--muted)}
.hwd svg{width:38px;height:38px}
.hwd .d{font-size:13px;font-weight:650;font-variant-numeric:tabular-nums}
.hwd.today .d{color:var(--hi-text)}
.hwd.sel{background:var(--surface-2)}
.hsum{display:flex;align-items:center;gap:16px;padding:14px 16px;border-radius:18px;background:var(--bg-2)}
.hsum .big{font-family:var(--f-display);font-weight:780;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.hsum .big small{font-size:17px;color:var(--muted);font-weight:650}
.hsum .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.hsum .tx span{font-size:13.5px;color:var(--muted)}
.hstat-row{display:flex;gap:16px;flex-wrap:wrap;font-size:13.5px;color:var(--muted)}
.hstat-row b{color:var(--ink);font-weight:700}
.hlist{display:flex;flex-direction:column}
.hrow{display:flex;align-items:center;gap:14px;padding:12px 0;border-top:1px solid var(--line)}
.hlist .hrow:first-child{border-top:0}
.hrow.off{opacity:.55}
.ring{position:relative;flex:none;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring .v{position:relative;font-size:14px;font-weight:750;font-variant-numeric:tabular-nums;color:var(--ink)}
.ring .ok{position:relative;width:22px;height:22px;color:var(--surface)}
.ring.full .v{color:var(--surface)}
.hmain{flex:1;min-width:0;text-align:left;display:flex;flex-direction:column;gap:5px}
.hname{font-size:16px;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.hmeta{font-size:13px;color:var(--muted)}
.h7{display:flex;gap:4px}
.h7 i{width:14px;height:5px;border-radius:3px;background:var(--surface-3)}
.h7 i.on{background:var(--c)}
.h7 i.ns{background:transparent;box-shadow:inset 0 0 0 1px var(--line-2)}
.streak{flex:none;display:flex;align-items:center;gap:3px;font-size:15px;font-weight:750;font-variant-numeric:tabular-nums;color:var(--muted)}
.streak svg{width:17px;height:17px}
.streak.on{color:var(--hi-text)}
.hcal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.hcal .dw{font-size:12px;font-weight:600;color:var(--faint);text-align:center;padding:2px 0}
.hc{aspect-ratio:1;max-width:100%;border-radius:12px;display:grid;place-items:center;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;background:var(--surface-2);color:var(--ink);position:relative}
.hc.done{background:var(--c);color:var(--surface)}
.hc.part{background:color-mix(in srgb,var(--c) 35%,var(--surface-2))}
.hc.ns{background:transparent;color:var(--faint);box-shadow:inset 0 0 0 1px var(--line)}
.hc.future,.hc.before{background:transparent;color:var(--faint);cursor:default}
.hc.today{box-shadow:inset 0 0 0 2px var(--ink)}
.hc.blank{visibility:hidden}
.stats4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.st{background:var(--bg-2);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.st b{font-family:var(--f-display);font-size:26px;font-weight:780;line-height:1.1;font-variant-numeric:tabular-nums}
.st span{font-size:13px;color:var(--muted)}
.stepper{display:flex;align-items:center;justify-content:center;gap:18px;padding:6px 0}
.stepper .sv{min-width:110px;text-align:center;font-family:var(--f-display);font-size:34px;font-weight:780;font-variant-numeric:tabular-nums;line-height:1}
.stepper .sv small{display:block;font-family:var(--f-ui);font-size:13px;font-weight:600;color:var(--muted);margin-top:4px}
.rbtn{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--ink)}
.rbtn svg{width:24px;height:24px}
.bigcheck{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:54px;border-radius:16px;font-size:16px;font-weight:700;background:var(--surface-2)}
.bigcheck svg{width:22px;height:22px}
.bigcheck.on{background:var(--c);color:var(--surface)}

/* Foco */
.fmodes{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding:2px;margin-inline:-2px}
.fmodes::-webkit-scrollbar{display:none}
.fchip{flex:none;padding:9px 15px;border-radius:999px;background:var(--surface-2);font-size:14px;font-weight:600;color:var(--muted);white-space:nowrap}
.fchip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.fring{position:relative;width:min(280px,76vw);aspect-ratio:1;max-width:100%;margin:8px auto 0}
.fring svg.r{width:100%;height:100%;transform:rotate(-90deg);display:block}
.fring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;text-align:center;padding:0 34px}
.t-big{font-family:var(--f-display);font-weight:760;font-size:clamp(46px,14vw,64px);letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1}
.t-phase{font-size:14px;font-weight:700;color:var(--hi-text)}
.t-phase.brk{color:var(--ok)}
.t-task{font-size:13.5px;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fring .donemark{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.fring .donemark svg{width:38%;height:38%;color:var(--hi)}
.fring .donemark path{stroke-dasharray:60;stroke-dashoffset:60;animation:draw .6s .1s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.cyc{display:flex;gap:6px;justify-content:center}
.cyc i{width:7px;height:7px;border-radius:50%;background:var(--surface-3)}
.cyc i.on{background:var(--hi)}
.ctrl{display:flex;justify-content:center;align-items:center;gap:22px;margin-top:16px}
.play{width:74px;height:74px;border-radius:50%;background:var(--hi);color:var(--hi-ink);display:grid;place-items:center;box-shadow:var(--shadow-s)}
.play svg{width:30px;height:30px}
.mdesc{font-size:13.5px;color:var(--muted);text-align:center;max-width:44ch;margin:12px auto 0}
.chart svg{width:100%;height:auto;display:block}
.chart rect.b{fill:var(--hi)}
.readout{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:14px;margin-top:8px}
.log-row{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px;align-items:baseline}
.log-row .tm{color:var(--muted);font-variant-numeric:tabular-nums}

/* Folhas */
.sheet-wrap{position:fixed;inset:0;z-index:20;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;animation:fade .16s ease-out}
.sheet{width:100%;max-width:640px;max-height:92%;overflow:auto;overscroll-behavior:contain;background:var(--surface);border-radius:24px 24px 0 0;padding-block:6px calc(26px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));box-shadow:var(--shadow);animation:up .24s cubic-bezier(.2,.8,.2,1)}
.sheet.tall{min-height:min(88%,760px)}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.grab{width:42px;height:5px;border-radius:5px;background:var(--line-2);margin:4px auto 10px}
.sh-bar{position:sticky;top:-6px;z-index:4;display:grid;grid-template-columns:minmax(64px,auto) minmax(0,1fr) minmax(64px,auto);align-items:center;gap:8px;margin:-6px calc(-1 * max(18px,env(safe-area-inset-right,0px))) 12px calc(-1 * max(18px,env(safe-area-inset-left,0px)));padding:12px max(18px,env(safe-area-inset-right,0px)) 10px max(18px,env(safe-area-inset-left,0px));background:var(--surface)}
.sh-bar h2{font-size:16.5px;font-weight:700;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sh-btn{font-size:15.5px;font-weight:600;color:var(--muted);padding:6px 0;display:inline-flex;align-items:center;gap:3px;white-space:nowrap;justify-self:start}
.sh-btn.r{justify-self:end;color:var(--accent);font-weight:700}
.sh-btn.ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;padding:0;color:var(--ink)}
.sh-btn.ic.r{color:var(--ink)}
@media (hover:hover){.sh-btn.ic:hover{background:var(--surface-2)}}
.sh-btn svg{width:22px;height:22px}
.sh-title{font-family:var(--f-display);font-size:27px;font-weight:780;line-height:1.12;letter-spacing:-.015em;overflow-wrap:anywhere}
.form{display:flex;flex-direction:column;gap:18px}
.field{display:flex;flex-direction:column;gap:8px;min-width:0}
.lbl{font-size:13.5px;font-weight:700;color:var(--muted)}
.inp{width:100%;min-width:0;background:var(--surface-2);border:1.5px solid transparent;border-radius:13px;padding:12px 13px;font-size:16px;color:var(--ink)}
.inp:focus{outline:none;border-color:var(--accent);background:var(--surface)}
.inp.big{font-size:19px;font-weight:600;padding:13px 14px}
textarea.inp{resize:vertical;min-height:84px;line-height:1.45}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.seg{display:flex;gap:7px;flex-wrap:wrap}
.seg button{padding:8px 13px;border-radius:999px;background:var(--surface-2);font-size:14px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:7px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg button .dot{width:9px;height:9px}
.seg button svg{width:16px;height:16px}
.seg button[aria-pressed="true"] .dot{box-shadow:0 0 0 2px var(--accent-ink)}
.seg .add{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line-2);color:var(--accent)}
.segctl{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);padding:4px;border-radius:14px;background:var(--surface-2)}
.segctl button{padding:9px 6px;border-radius:10px;font-size:14px;font-weight:650;color:var(--muted);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.segctl button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-s)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:14px;width:100%;padding:12px 14px;border-radius:14px;background:var(--surface-2);text-align:left;font-size:15px}
.toggle small{display:block;color:var(--muted);font-size:13px;margin-top:1px}
.swt{width:44px;height:26px;border-radius:13px;background:var(--line-2);position:relative;flex:none;transition:background .15s}
.swt::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.toggle[aria-pressed="true"] .swt{background:var(--accent)}
.toggle[aria-pressed="true"] .swt::after{transform:translateX(18px)}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{flex:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:14px;font-weight:700;font-size:15.5px;background:var(--surface-2);text-align:center}
.btn svg{width:20px;height:20px}
.btns .btn{flex:1 1 140px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.hi{background:var(--hi);color:var(--hi-ink)}
.btn.danger{color:var(--danger);background:var(--danger-soft)}
.btn.danger.armed{background:var(--danger);color:#fff}
.btn.ghost{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line-2)}
.qchips{display:flex;gap:7px;flex-wrap:wrap}
.qchips button{font-size:13.5px;font-weight:600;padding:7px 12px;border-radius:999px;background:var(--surface-2);color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.qchips button svg{width:16px;height:16px}
.qchips button[aria-pressed="true"]{background:var(--hi-soft);color:var(--hi-text)}
.qprev{display:flex;flex-wrap:wrap;gap:7px;min-height:30px}
.qp{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;padding:6px 11px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.qp svg{width:15px;height:15px}
.qp.warn{background:var(--hi-soft);color:var(--hi-text)}
.qp .dot{width:8px;height:8px}
.divider{height:1px;background:var(--line);margin:2px 0}
.pal{gap:8px}
.pal button{width:38px;height:38px;padding:0;border-radius:50%;display:grid;place-items:center;background:transparent;box-shadow:none}
.pal button i{width:26px;height:26px;border-radius:50%;display:block}
.pal button[aria-pressed="true"]{background:transparent;box-shadow:inset 0 0 0 2.5px var(--ink)}
.catnew{display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:14px;background:var(--surface-2)}
.catnew .inp{background:var(--surface)}

/* Detalhe da tarefa */
.td-head{display:flex;align-items:flex-start;gap:12px;padding:2px 0 6px}
.td-head .chk{width:28px;height:28px;margin-top:6px}
.td-head .chk svg{width:16px;height:16px}
.td-title{flex:1;min-width:0;border:0;background:transparent;font-family:var(--f-display);font-size:24px;font-weight:760;line-height:1.2;letter-spacing:-.01em;resize:none;padding:4px 0;outline:none;overflow:hidden;color:var(--ink)}
.td-title.done{text-decoration:line-through;color:var(--faint)}
.td-list{display:flex;flex-direction:column}
.td-row{display:flex;align-items:flex-start;gap:14px;padding:13px 0;border-top:1px solid var(--line)}
.td-row>.ico{width:22px;height:22px;color:var(--muted);flex:none;margin-top:6px}
.td-row>.ico.on{color:var(--hi-text)}
.td-c{flex:1;min-width:0;display:flex;flex-direction:column;gap:9px}
.td-l{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:34px}
.td-l b{font-size:15.5px;font-weight:600}
.td-l small{font-size:13.5px;color:var(--muted)}
.td-l .x{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:var(--muted)}
.td-l .x svg{width:17px;height:17px}
.td-c input[type=date],.td-c input[type=time]{max-width:220px}
.sub{display:flex;align-items:center;gap:11px;padding:6px 0}
.sub .chk{width:20px;height:20px;border-width:2px}
.sub .chk svg{width:12px;height:12px}
.sub input{flex:1;min-width:0;border:0;background:transparent;font-size:15.5px;padding:4px 0;outline:none}
.sub.done input{text-decoration:line-through;color:var(--faint)}
.sub .rm{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:var(--faint)}
.sub .rm svg{width:16px;height:16px}
.sub-add{display:flex;align-items:center;gap:11px;padding:4px 0}
.sub-add svg{width:20px;height:20px;color:var(--accent)}
.sub-add input{flex:1;min-width:0;border:0;background:transparent;font-size:15.5px;padding:6px 0;outline:none}
.tags-e{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.tags-e .tag{font-size:13.5px;padding:5px 6px 5px 11px;gap:4px;background:var(--accent-soft);color:var(--accent)}
.tags-e .tag button{width:20px;height:20px;border-radius:50%;display:grid;place-items:center}
.tags-e .tag svg{width:13px;height:13px}
.tags-e input{flex:1 1 120px;min-width:0;border:0;background:transparent;font-size:15px;padding:6px 0;outline:none}
.td-acts{display:flex;flex-direction:column;gap:10px;padding-top:16px}

/* Abas */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--surface);box-shadow:0 -1px 0 var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:center;max-width:680px;margin:0 auto;height:var(--tabbar);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:100%;font-size:11.5px;font-weight:600;color:var(--faint);min-width:0;white-space:nowrap}
.tab svg{width:25px;height:25px}
.tab[aria-current="page"]{color:var(--accent)}
.tab .ti{position:relative;display:grid;place-items:center}
.tab .ti i{position:absolute;top:-2px;right:-6px;width:8px;height:8px;border-radius:50%;background:var(--hi);box-shadow:0 0 0 2px var(--surface)}
.fab{width:56px;height:56px;border-radius:50%;background:var(--hi);color:var(--hi-ink);display:grid;place-items:center;justify-self:center;box-shadow:0 6px 16px rgba(242,164,23,.38);transform:translateY(-12px);transition:transform .12s ease}
.fab svg{width:28px;height:28px;stroke-width:2.4}
.fab:active{transform:translateY(-12px) scale(.93)}

/* Barra do foco em andamento */
.focusbar{position:fixed;left:0;right:0;z-index:8;bottom:calc(var(--tabbar) + env(safe-area-inset-bottom,0px) + 8px);padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.fb-in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:8px 8px 8px 16px;border-radius:18px;background:var(--accent);color:var(--accent-ink);box-shadow:var(--shadow)}
.fb-in .t{flex:1;min-width:0;text-align:left;display:flex;flex-direction:column;line-height:1.2}
.fb-in .t b{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.fb-in .t span{font-size:12.5px;opacity:.8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fb-in button.p{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--hi);color:var(--hi-ink);flex:none}
.fb-in button.p svg{width:19px;height:19px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabbar) + 18px + env(safe-area-inset-bottom,0px));z-index:45;display:flex;align-items:center;gap:14px;background:var(--ink);color:var(--bg);padding:11px 12px 11px 16px;border-radius:14px;font-size:14.5px;font-weight:550;box-shadow:var(--shadow);width:max-content;max-width:calc(100% - 32px)}
body.fb-on .toast{bottom:calc(var(--tabbar) + 82px + env(safe-area-inset-bottom,0px))}
.toast-act{color:var(--hi);font-weight:750;font-size:14.5px;padding:4px 6px;flex:none}

/* Boas-vindas */
.welcome{display:flex;flex-direction:column;align-items:flex-start;gap:16px;padding:8px 2px 4px}
.welcome .logo{width:64px;height:64px}
.welcome h2{font-family:var(--f-display);font-size:32px;font-weight:800;letter-spacing:-.02em;line-height:1.05}
.welcome ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.welcome li{display:flex;align-items:center;gap:12px;font-size:15.5px}
.welcome li span{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--hi-soft);color:var(--hi-text);flex:none}
.welcome li svg{width:20px;height:20px}
.about{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding:20px 8px}
.about .logo{width:72px;height:72px}
.about b{font-family:var(--f-display);font-size:30px;font-weight:800;letter-spacing:-.02em}

/* Ajustes */
.set-h{font-size:13.5px;font-weight:700;color:var(--muted);margin:20px 4px 8px}
.set-h:first-of-type{margin-top:2px}
.set-list{display:flex;flex-direction:column;border-radius:16px;overflow:hidden;background:var(--surface-2)}
.set-row{display:flex;align-items:center;gap:13px;padding:13px 14px;text-align:left;width:100%;border-top:1px solid var(--line)}
.set-row:first-child{border-top:0}
.set-ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--surface);color:var(--accent);flex:none}
.set-ic svg{width:19px;height:19px}
.set-tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.set-tx b{font-weight:600;font-size:15.5px}
.set-tx small{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.set-row>svg{width:18px;height:18px;color:var(--faint)}
.perms{display:flex;flex-direction:column;border-radius:14px;background:var(--surface-2)}
.perm{display:flex;align-items:center;gap:11px;padding:11px 14px;border-top:1px solid var(--line)}
.perm:first-child{border-top:0}
.pdot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--danger)}
.pdot.ok{background:var(--ok)}
.ptx{flex:1;min-width:0;font-size:15px}
.ptx small{display:block;color:var(--muted);font-size:13px}
.pok{font-size:13px;color:var(--ok);font-weight:700}
.catlist{display:flex;flex-direction:column;border-radius:16px;overflow:hidden;background:var(--surface-2)}
.catrow{display:flex;align-items:center;gap:13px;padding:13px 14px;border-top:1px solid var(--line);text-align:left;width:100%}
.catrow:first-child{border-top:0}
.catrow .dot{width:13px;height:13px}
.res-h{font-size:13.5px;font-weight:700;color:var(--muted);margin:16px 0 4px}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- listas (categorias) ---------- */
function cats(){
  if(S._cats)return S._cats;
  const c=S.settings.cats;let out;
  if(Array.isArray(c)&&c.length)out=c.filter(x=>x&&x.k);
  else{const used=new Set();S.tasks.forEach(t=>used.add(t.ctx));S.events.forEach(e=>used.add(e.cat));S.habits.forEach(h=>used.add(h.cat));
    out=DEF_CATS.slice();OLD_CATS.forEach(o=>{if(used.has(o.k)&&!out.some(x=>x.k===o.k))out.push(o);});}
  S._cats=out;return out;
}
const catOf=k=>k?cats().find(c=>c.k===k)||null:null;
const catName=(k,none)=>{const c=catOf(k);return c?c.n:(none||'Entrada');};

/* ---------- armazenamento ---------- */
const Store={
  db:null,qs:{},
  async init(){
    let db=null;
    try{if(window.claude&&typeof window.claude.use==='function')db=await window.claude.use('db');}catch(e){db=null;}
    if(!db){this.local();return;}
    this.db=db;S.mode='db';
    const got={t:0,e:0,f:0,c:0,h:0};
    const ready=()=>{S._cats=null;if(!S.ready&&got.t&&got.e&&got.f&&got.c&&got.h){S.ready=true;onReady();}render();};
    const fail=e=>{console.warn('db',e);if(e&&e.code==='revoked'){S.mode='local';toast('A sincronização foi interrompida nesta tela.');}render();};
    db.collection('tasks').onSnapshot(s=>{S.tasks=s.docs.map(d=>Object.assign({},d.data(),{id:d.id}));got.t=1;ready();},fail);
    db.collection('events').onSnapshot(s=>{S.events=s.docs.map(d=>Object.assign({},d.data(),{id:d.id}));got.e=1;ready();},fail);
    db.collection('habits').onSnapshot(s=>{S.habits=s.docs.map(d=>Object.assign({},d.data(),{id:d.id}));got.h=1;ready();},fail);
    db.collection('focus').onSnapshot(s=>{const f={};s.docs.forEach(d=>{f[d.id]=d.data();});S.focus=f;got.f=1;ready();},fail);
    db.doc('config/settings').onSnapshot(s=>{S.settings=merge(DEF_SETTINGS,s.exists?s.data():{});got.c=1;ready();},fail);
  },
  local(){
    S.mode='local';
    let raw=null;try{raw=localStorage.getItem('ritmo.data');}catch(e){}
    try{if(raw){const o=JSON.parse(raw);S.tasks=o.tasks||[];S.events=o.events||[];S.habits=o.habits||[];S.focus=o.focus||{};S.settings=merge(DEF_SETTINGS,o.settings||{});}
      else if(AND){const x=exampleData();S.tasks=x.tasks;S.events=x.events;S.habits=x.habits;this.saveLocal();}}catch(e){}
    S._cats=null;S.ready=true;onReady();render();
  },
  saveLocal(){try{localStorage.setItem('ritmo.data',JSON.stringify({tasks:S.tasks,events:S.events,habits:S.habits,focus:S.focus,settings:S.settings}));}catch(e){toast('Não foi possível salvar neste aparelho.');}},
  q(path,fn){
    const run=async()=>{try{return await fn();}catch(e){if(e&&e.code==='unavailable'){await new Promise(r=>setTimeout(r,600+Math.random()*900));return fn();}throw e;}};
    const p=(this.qs[path]||Promise.resolve()).then(run).catch(e=>this.err(e));
    this.qs[path]=p;return p;
  },
  err(e){
    const c=e&&e.code;console.warn('save',e);
    toast(c==='quota_exceeded'?'Espaço cheio. Exclua itens antigos para continuar salvando.':c==='invalid_argument'?'Sem permissão para salvar nesta conta.':'Não foi possível salvar agora. Tente de novo.');
  },
  body(o){const b=clone(o);delete b.id;return b;},
  put(col,arr,item){
    const i=arr.findIndex(x=>x.id===item.id);if(i>=0)arr[i]=item;else arr.push(item);S._cats=null;
    if(S.mode==='db'&&this.db)this.q(col+'/'+item.id,()=>this.db.doc(col+'/'+item.id).set(this.body(item)));else this.saveLocal();
  },
  del(col,key,id){
    S[key]=S[key].filter(x=>x.id!==id);S._cats=null;
    if(S.mode==='db'&&this.db)this.q(col+'/'+id,()=>this.db.doc(col+'/'+id).delete());else this.saveLocal();
  },
  putTask(t){this.put('tasks',S.tasks,t);},
  delTask(id){this.del('tasks','tasks',id);},
  putEvent(e){this.put('events',S.events,e);},
  delEvent(id){this.del('events','events',id);},
  putHabit(h){this.put('habits',S.habits,h);},
  delHabit(id){this.del('habits','habits',id);},
  putFocus(d,doc){S.focus[d]=doc;if(S.mode==='db'&&this.db)this.q('focus/'+d,()=>this.db.doc('focus/'+d).set(clone(doc)));else this.saveLocal();},
  delFocus(d){delete S.focus[d];if(S.mode==='db'&&this.db)this.q('focus/'+d,()=>this.db.doc('focus/'+d).delete());else this.saveLocal();},
  putSettings(s){S.settings=s;S._cats=null;if(S.mode==='db'&&this.db)this.q('config/settings',()=>this.db.doc('config/settings').set(clone(s)));else this.saveLocal();}
};
const setSettings=patch=>Store.putSettings(Object.assign({},S.settings,patch));

/* ---------- tarefas ---------- */
const isDone=t=>t.status==='done';
const listOf=t=>catOf(t.ctx)?t.ctx:null;
const prioOf=t=>{if(t.prio!=null)return Math.max(0,Math.min(3,+t.prio||0));return t.pri==='A'?3:t.pri==='B'?2:t.pri==='C'?1:0;};
const subsOf=t=>Array.isArray(t.subs)?t.subs.filter(x=>x&&typeof x==='object'):[];
const tagsOf=t=>Array.isArray(t.tags)?t.tags.filter(x=>typeof x==='string'&&x):[];
const inMyDay=t=>!isDone(t)&&(!!t.pin||t.my===today());
const cmpRem=(a,b)=>(a.rem||'99').localeCompare(b.rem||'99');
const taskSort=(a,b)=>prioOf(b)-prioOf(a)||cmpRem(a,b)||(a.created||0)-(b.created||0);
const byDate=(a,b)=>(a.date||'9999').localeCompare(b.date||'9999')||taskSort(a,b);
const byDoneAt=(a,b)=>(b.doneAt||'').localeCompare(a.doneAt||'')||(b.doneTs||0)-(a.doneTs||0)||(b.created||0)-(a.created||0);
const mySort=(a,b)=>(!!b.pin-!!a.pin)||prioOf(b)-prioOf(a)||cmpRem(a,b)||(a.myAt||a.created||0)-(b.myAt||b.created||0);
function nextRep(d,rep){
  if(rep==='daily')return addDays(d,1);
  if(rep==='weekdays'){let x=addDays(d,1);while([0,6].includes(parseISO(x).getDay()))x=addDays(x,1);return x;}
  if(rep==='weekly')return addDays(d,7);
  if(rep==='monthly')return addMonths(d,1);
  if(rep==='yearly')return addMonths(d,12);
  return null;
}
function allTags(){const m={};S.tasks.forEach(t=>{if(isDone(t))return;tagsOf(t).forEach(g=>{m[g]=(m[g]||0)+1;});});return Object.keys(m).sort((a,b)=>a.localeCompare(b)).map(g=>[g,m[g]]);}
function listName(id){if(LISTS[id])return LISTS[id][0];if(id.startsWith('cat:'))return catName(id.slice(4));if(id.startsWith('tag:'))return '#'+id.slice(4);return 'Tarefas';}
function listFilter(id){
  if(id==='inbox')return t=>!listOf(t);
  if(id.startsWith('cat:')){const k=id.slice(4);return t=>t.ctx===k;}
  if(id.startsWith('tag:')){const g=id.slice(4);return t=>tagsOf(t).includes(g);}
  if(id==='next7'){const end=addDays(today(),6);return t=>!!t.date&&t.date<=end;}
  return ()=>true;
}
function validList(id){if(LISTS[id])return true;if(id.startsWith('cat:'))return !!catOf(id.slice(4));if(id.startsWith('tag:'))return allTags().some(g=>g[0]===id.slice(4));return false;}
const hasExamples=()=>S.tasks.some(t=>t.ex)||S.events.some(e=>e.ex)||S.habits.some(h=>h.ex);

/* ---------- eventos ---------- */
function evOccurs(e,d){
  if(!e||!e.date)return false;if(e.date===d)return true;if(d<e.date)return false;
  switch(e.rep){
    case 'daily':return true;
    case 'weekdays':{const w=parseISO(d).getDay();return w>0&&w<6;}
    case 'weekly':return dayDiff(e.date,d)%7===0;
    case 'monthly':return parseISO(e.date).getDate()===parseISO(d).getDate();
    case 'yearly':return e.date.slice(5)===d.slice(5);
    default:return false;
  }
}
function eventsOn(d){
  return S.events.filter(e=>evOccurs(e,d)).map(e=>{
    if(e.allDay)return {id:e.id,title:e.title,cat:e.cat,allDay:true,s:0,e:1440,ex:e.ex,rep:e.rep};
    const s=toMin(e.start)??480;let en=toMin(e.end);if(en==null||en<=s)en=en!=null&&en<s?1440:s+60;
    return {id:e.id,title:e.title,cat:e.cat,s,e:Math.max(en,s+15),ex:e.ex,rep:e.rep};
  }).sort((a,b)=>(b.allDay?1:0)-(a.allDay?1:0)||a.s-b.s||a.e-b.e);
}
const tasksOn=d=>S.tasks.filter(t=>t.date===d&&(!isDone(t)||t.doneAt===d)).sort((a,b)=>isDone(a)-isDone(b)||taskSort(a,b));

/* ---------- hábitos ---------- */
const hTarget=h=>h.type==='count'?Math.max(1,+h.target||1):1;
const hVal=(h,d)=>+((h.log||{})[d]||0);
const hDone=(h,d)=>hVal(h,d)>=hTarget(h);
const hPer=h=>Math.min(7,Math.max(1,+h.per||1));
const activeHabits=()=>S.habits.filter(h=>!h.archived).sort((a,b)=>(a.order||0)-(b.order||0)||(a.created||0)-(b.created||0));
function hSched(h,d){
  if(h.start&&d<h.start)return false;
  if(h.freq==='days')return (h.days||[]).indexOf(parseISO(d).getDay())>=0;
  return true;
}
function hWeekCount(h,ws){let n=0;for(let i=0;i<7;i++){const d=addDays(ws,i);if(hSched(h,d)&&hDone(h,d))n++;}return n;}
const hWeekMet=(h,ws)=>hWeekCount(h,ws)>=hPer(h);
function hStats(h){
  const td=today(),log=h.log||{};
  const total=Object.keys(log).filter(d=>d<=td&&hDone(h,d)).length;
  if(h.freq==='weekly'){
    const cw=weekStart(td);let cur=hWeekMet(h,cw)?1:0,w=addDays(cw,-7);
    for(let i=0;i<104;i++){if(h.start&&addDays(w,6)<h.start)break;if(!hWeekMet(h,w))break;cur++;w=addDays(w,-7);}
    let s=h.start?weekStart(h.start):addDays(cw,-7*52);if(dayDiff(s,cw)>7*104)s=addDays(cw,-7*104);
    let best=0,run=0;for(let x=s;x<=cw;x=addDays(x,7)){if(hWeekMet(h,x)){run++;if(run>best)best=run;}else if(x!==cw)run=0;}
    let met=0,tot=0;for(let k=1;k<=4;k++){const x=addDays(cw,-7*k);if(h.start&&addDays(x,6)<h.start)continue;tot++;if(hWeekMet(h,x))met++;}
    return {cur,best:Math.max(best,cur),rate:tot?met/tot:null,total,unit:['semana','semanas'],win:'últimas 4 semanas'};
  }
  let d=td;if(hSched(h,d)&&!hDone(h,d))d=addDays(d,-1);
  let cur=0;for(let i=0;i<730;i++){if(h.start&&d<h.start)break;if(hSched(h,d)){if(hDone(h,d))cur++;else break;}d=addDays(d,-1);}
  let s=h.start||addDays(td,-365);if(dayDiff(s,td)>730)s=addDays(td,-730);
  let best=0,run=0;for(let x=s;x<=td;x=addDays(x,1)){if(!hSched(h,x))continue;if(hDone(h,x)){run++;if(run>best)best=run;}else if(x!==td)run=0;}
  let sc=0,dn=0;for(let i=0;i<30;i++){const x=addDays(td,-i);if(h.start&&x<h.start)break;if(!hSched(h,x))continue;if(i===0&&!hDone(h,x))continue;sc++;if(hDone(h,x))dn++;}
  return {cur,best:Math.max(best,cur),rate:sc?dn/sc:null,total,unit:['dia','dias'],win:'últimos 30 dias'};
}
function hSchedText(h){
  if(h.freq==='days'){const ds=(h.days||[]).slice().sort((a,b)=>a-b);return ds.length===7?'Todo dia':ds.length?ds.map(i=>DOWS[i]).join(', '):'Sem dias';}
  if(h.freq==='weekly')return `${hPer(h)}x por semana`;
  return 'Todo dia';
}

/* ---------- foco ---------- */
const focusMinOn=d=>((S.focus[d]&&S.focus[d].items)||[]).reduce((a,x)=>a+(+x.min||0),0);
const METHODS={
  pomodoro:{n:'Pomodoro',d:()=>`${S.settings.pomo.focus} min de foco e ${S.settings.pomo.short} de pausa. A cada ${S.settings.pomo.every} ciclos, uma pausa longa de ${S.settings.pomo.long} min.`},
  m5217:{n:'52/17',d:()=>'52 minutos de concentração e 17 de descanso longe da tela.'},
  ultra:{n:'90/20',d:()=>'Um bloco longo de 90 minutos de concentração profunda e 20 de recuperação.'},
  flow:{n:'Livre',d:()=>'Sem relógio fixo: foque enquanto render e pare quando cansar. A pausa sugerida é um quinto do tempo focado.'},
  box:{n:'Tempo definido',d:()=>'Escolha quanto tempo dar para a tarefa e pare quando acabar.'}
};
let T={method:'pomodoro',phase:'focus',running:false,endAt:0,remain:null,cycle:1,task:'',flowStart:0,flowAcc:0,flowBreak:5,box:30,doneFx:0};
try{const v=localStorage.getItem('ritmo.timer');if(v)T=Object.assign(T,JSON.parse(v));}catch(e){}
if(!METHODS[T.method])T.method='pomodoro';
const saveT=()=>{try{localStorage.setItem('ritmo.timer',JSON.stringify(T));}catch(e){}};
const flowFocus=()=>T.method==='flow'&&T.phase==='focus';
const timerActive=()=>!!(T.running||T.remain!=null||T.flowAcc>0);
function phaseLen(){
  const p=S.settings.pomo,f=T.phase==='focus';
  switch(T.method){
    case 'pomodoro':return (f?+p.focus:T.phase==='long'?+p.long:+p.short)*60000;
    case 'm5217':return (f?52:17)*60000;
    case 'ultra':return (f?90:20)*60000;
    case 'box':return (f?+T.box:5)*60000;
    default:return f?0:(+T.flowBreak||5)*60000;
  }
}
function remaining(){
  if(flowFocus())return T.running?Date.now()-T.flowStart:(T.flowAcc||0);
  if(T.running)return Math.max(0,T.endAt-Date.now());
  return T.remain!=null?T.remain:phaseLen();
}
function fmtMs(ms){const s=flowFocus()?Math.floor(ms/1000):Math.ceil(ms/1000);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return h?`${h}:${pad(m)}:${pad(x)}`:`${pad(m)}:${pad(x)}`;}
let AC=null,WL=null;
function unlockAudio(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){}}
function chime(){
  try{if(AC){const t0=AC.currentTime;[[659.25,0],[880,.2],[1046.5,.4]].forEach(([f,dt])=>{const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t0+dt);g.gain.exponentialRampToValueAtTime(.22,t0+dt+.03);g.gain.exponentialRampToValueAtTime(.0001,t0+dt+1.1);o.connect(g);g.connect(AC.destination);o.start(t0+dt);o.stop(t0+dt+1.2);});}}catch(e){}
  try{if(AND&&AND.vibrate)AND.vibrate(450);else if(navigator.vibrate)navigator.vibrate([200,120,200]);}catch(e){}
}
function nativeAlarm(){if(!AND)return;try{if(T.running&&!flowFocus()){const f=T.phase==='focus';AND.scheduleAlarm(T.endAt,f?'Foco concluído':'Pausa encerrada',f?`${METHODS[T.method].n}: hora da pausa.`:'Pronto para o próximo foco?');}else AND.cancelAlarm();}catch(e){}}
async function wake(on){if(AND){try{AND.keepScreenOn(!!on);}catch(e){}return;}try{if(on&&!WL&&navigator.wakeLock){WL=await navigator.wakeLock.request('screen');WL.addEventListener&&WL.addEventListener('release',()=>{WL=null;});}else if(!on&&WL){await WL.release();WL=null;}}catch(e){WL=null;}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&T.running)wake(true);});
function focusChanged(){render();if(S.sheet&&S.sheet.type==='focus')openFocus(true);}
function tStart(){
  unlockAudio();
  if(flowFocus())T.flowStart=Date.now()-(T.flowAcc||0);else T.endAt=Date.now()+remaining();
  T.running=true;T.doneFx=0;saveT();wake(true);nativeAlarm();
  if(AND&&AND.requestNotifications){try{AND.requestNotifications();}catch(e){}}
  focusChanged();
}
function tPause(){
  if(flowFocus())T.flowAcc=Date.now()-T.flowStart;else T.remain=remaining();
  T.running=false;saveT();wake(false);nativeAlarm();focusChanged();
}
function tReset(){T.running=false;T.remain=null;T.flowAcc=0;T.phase='focus';T.cycle=1;T.doneFx=0;saveT();wake(false);nativeAlarm();focusChanged();}
function recordFocus(min,atMs){
  if(min<1)return;
  const at=new Date(atMs||Date.now()),d=isoOf(at);
  const cur=(S.focus[d]&&S.focus[d].items)||[];
  const item={m:T.method,min:Math.round(min),at:`${pad(at.getHours())}:${pad(at.getMinutes())}`};if(T.task)item.task=T.task;
  Store.putFocus(d,{date:d,items:cur.concat([item])});

/* ---------- avisos no celular (eventos, lembretes de tarefas e hábitos) ---------- */
const ALERT_OPTS=[['alarm','Alarme'],['notif','Notificação'],['off','Sem aviso']];
const LEAD_OPTS=[[0,'Na hora'],[5,'5 min'],[10,'10 min'],[15,'15 min'],[30,'30 min'],[60,'1 h']];
const alertOf=e=>{const a=e.alert||((S.settings.alerts||{}).mode)||'alarm';return ALERT_OPTS.some(o=>o[0]===a)?a:'alarm';};
const leadOf=e=>{const v=e.lead!=null&&e.lead!==''?+e.lead:+((S.settings.alerts||{}).lead||0);return isNaN(v)?0:Math.max(0,Math.min(240,v));};
const remModeOf=t=>{const m=t.remMode||((S.settings.rem||{}).mode)||'notif';return m==='alarm'?'alarm':'notif';};
const canAlarm=()=>!!(AND&&AND.setEventAlarms);
const msAt=(d,min)=>{const x=parseISO(d);return new Date(x.getFullYear(),x.getMonth(),x.getDate(),Math.floor(min/60),min%60).getTime();};
function alarmList(){
  const now=Date.now(),td=today(),out=[];
  for(let i=0;i<15;i++){
    const d=addDays(td,i);
    eventsOn(d).forEach(it=>{
      if(it.allDay)return;
      const e=S.events.find(x=>x.id===it.id);if(!e||e.ex)return;
      const mode=alertOf(e);if(mode==='off')return;
      const lead=leadOf(e),startMs=msAt(d,it.s),at=startMs-lead*60000;
      if(at<now-60000)return;
      out.push({k:`${e.id}@${startMs}`,at,t:e.title||'Evento',s:`${hhmm(it.s)} às ${hhmm(it.e)}, ${catName(e.cat,'sem lista')}`,start:hhmm(it.s),lead,m:mode});
    });
  }
  S.tasks.forEach(t=>{
    if(isDone(t)||t.ex||!t.rem)return;const m=toMin(t.rem);if(m==null)return;
    const d=t.date||td,at=msAt(d,m);if(at<now-60000||at>now+15*864e5)return;
    out.push({k:`t:${t.id}@${at}`,at,t:t.title||'Tarefa',s:catName(t.ctx),start:t.rem,lead:0,m:remModeOf(t),h:'Lembrete de tarefa'});
  });
  activeHabits().forEach(h=>{
    if(h.ex||!h.time)return;const m=toMin(h.time);if(m==null)return;
    for(let i=0;i<7;i++){const d=addDays(td,i);if(!hSched(h,d)||hDone(h,d))continue;const at=msAt(d,m);if(at<now-60000)continue;
      out.push({k:`h:${h.id}@${at}`,at,t:h.name||'Hábito',s:hSchedText(h),start:h.time,lead:0,m:'notif',h:'Hora do hábito'});}
  });
  return out.sort((a,b)=>a.at-b.at).slice(0,200);
}
let alarmKey='',alarmT=null,askedNotif=false;
function pushAlarms(){
  if(!canAlarm()||!S.ready)return;
  clearTimeout(alarmT);
  alarmT=setTimeout(()=>{
    const list=alarmList(),json=JSON.stringify(list);
    if(json===alarmKey)return;alarmKey=json;
    try{AND.setEventAlarms(json);}catch(e){}
    if(list.length&&!askedNotif&&AND.requestNotifications){askedNotif=true;try{AND.requestNotifications();}catch(e){}}
  },400);
}

}

/* ---------- Tarefas ---------- */
function sectionsFor(id){
  const td=today(),tm=addDays(td,1),f=listFilter(id),act=S.tasks.filter(t=>!isDone(t)&&f(t));
  if(id==='next7'){
    const secs=[{k:'late',n:'Atrasadas',items:act.filter(t=>t.date<td).sort(byDate)}];
    for(let i=0;i<7;i++){const d=addDays(td,i);secs.push({k:'d'+i,n:i===0?'Hoje':i===1?'Amanhã':cap1(dLong(d)),d,items:act.filter(t=>t.date===d).sort(taskSort)});}
    return secs;
  }
  return [
    {k:'late',n:'Atrasadas',items:act.filter(t=>t.date&&t.date<td).sort(byDate)},
    {k:'today',n:'Hoje',d:td,items:act.filter(t=>t.date===td).sort(taskSort)},
    {k:'tom',n:'Amanhã',d:tm,items:act.filter(t=>t.date===tm).sort(taskSort)},
    {k:'up',n:'Próximos',items:act.filter(t=>t.date&&t.date>tm).sort(byDate)},
    {k:'some',n:'Algum dia',d:'',items:act.filter(t=>!t.date).sort(taskSort)}
  ];
}
function vTarefas(){
  if(!validList(S.list)){S.list='all';saveView();renderBar();}
  const id=S.list;let h='';
  if(hasExamples())h+=`<div class="banner"><span>Estes itens são exemplos para você explorar.</span><button type="button" class="link" data-act="clear-ex">Apagar exemplos</button></div>`;
  if(id==='done')return h+vDoneList();
  const ph=id.startsWith('cat:')?`Adicionar em ${catName(id.slice(4))}`:id==='inbox'?'Adicionar na Entrada':'Adicionar tarefa';
  h+=addBar('task',ph);
  if(S.tView==='quadro')return h+vBoard(id);
  const secs=sectionsFor(id),total=secs.reduce((a,s)=>a+s.items.length,0),showList=!id.startsWith('cat:')&&id!=='inbox';
  if(!total&&id!=='next7')h+=emptyTasks(id);
  secs.forEach(s=>{
    if(!s.items.length&&id!=='next7')return;
    if(!s.items.length&&s.k==='late')return;
    h+=section(s,id,{row:sec=>({date:sec.k==='late'||sec.k==='up',list:showList}),empty:id==='next7'?`<button type="button" class="more-row" data-act="add-on" data-d="${s.d}">${ic('plus')}Adicionar para ${s.k==='d0'?'hoje':s.k==='d1'?'amanhã':esc(DOWM[parseISO(s.d).getDay()])}</button>`:''});
  });
  if(S.showDone){const f=listFilter(id),dn=S.tasks.filter(t=>isDone(t)&&f(t)).sort(byDoneAt).slice(0,40);if(dn.length)h+=section({k:'done',n:'Concluídas',items:dn},id,{row:()=>({date:false,list:showList,sun:false})});}
  return h;
}
function emptyTasks(id){
  const [t,s]=id==='inbox'?['Entrada vazia','Tarefas sem lista ficam aqui. Escreva acima para anotar uma.']:id.startsWith('cat:')?[`${catName(id.slice(4))} está vazia`,'Escreva acima para adicionar a primeira tarefa desta lista.']:id.startsWith('tag:')?['Nenhuma tarefa com esta etiqueta','As etiquetas são colocadas nos detalhes da tarefa.']:['Nada pendente','Escreva acima ou toque em + para anotar uma tarefa. Experimente “Pagar a conta amanhã às 18h”.'];
  return `<div class="empty">${ic('doneall')}<b>${esc(t)}</b><span>${esc(s)}</span></div>`;

function vBoard(id){

      if(!id.startsWith('cat:')){const cc=catOf(t.ctx);meta.push(`<span class="mi"><i class="dot" style="--c:${cc?`var(--p-${esc(cc.c)})`:'var(--faint)'}"></i>${esc(cc?cc.n:'Entrada')}</span>`);}

function vDoneList(){
  const dn=S.tasks.filter(isDone).sort(byDoneAt).slice(0,300);
  if(!dn.length)return `<div class="empty">${ic('doneall')}<b>Nada concluído ainda</b><span>As tarefas que você marcar como feitas aparecem aqui.</span></div>`;
  const groups={};dn.forEach(t=>{const k=t.doneAt||'';(groups[k]=groups[k]||[]).push(t);});
  return Object.keys(groups).sort((a,b)=>b.localeCompare(a)).map(k=>section({k:'dn'+k,n:k?(k===today()?'Hoje':k===addDays(today(),-1)?'Ontem':cap1(dLong(k))):'Sem data',items:groups[k]},'done',{row:()=>({date:false,sun:false})})).join('');

/* ---------- concluir, adiar e excluir ---------- */
function completeTask(id){
  const t=S.tasks.find(x=>x.id===id);if(!t||isDone(t))return;
  const prev=clone(t),td=today();
  Store.putTask(Object.assign({},t,{status:'done',doneAt:td,doneTs:Date.now()}));
  let next=null;
  if(t.rep){
    let nd=nextRep(t.date||td,t.rep);let guard=0;while(nd&&nd<=td&&guard++<800)nd=nextRep(nd,t.rep);
    if(nd){next=Object.assign(clone(t),{id:uid('t'),status:'todo',doneAt:null,doneTs:null,date:nd,created:Date.now(),my:null,myAt:null,subs:subsOf(t).map(s=>Object.assign({},s,{done:false}))});delete next.ex;Store.putTask(next);}
  }
  buzz(14);render();
  toast(next?`Feito! A próxima fica para ${relDay(next.date).toLowerCase()}.`:'Feito!',()=>{Store.putTask(prev);if(next)Store.delTask(next.id);});
}
function reopenTask(id){const t=S.tasks.find(x=>x.id===id);if(!t)return;Store.putTask(Object.assign({},t,{status:'todo',doneAt:null,doneTs:null}));render();}
function deleteTask(id){
  const t=S.tasks.find(x=>x.id===id);if(!t)return;
  if(T.task===id){T.task='';saveT();}
  Store.delTask(id);render();toast('Tarefa excluída',()=>Store.putTask(t));
}
function setMyDay(id,on,pin){
  const t=S.tasks.find(x=>x.id===id);if(!t)return;
  const n=Object.assign({},t);
  if(on){n.my=today();n.myAt=n.myAt&&t.my===today()?n.myAt:Date.now();if(pin!=null)n.pin=!!pin;}
  else{n.my=null;n.pin=false;}
  Store.putTask(n);
}

/* ---------- Meu dia ---------- */
function dismissed(){try{const o=JSON.parse(localStorage.getItem('ritmo.dismiss')||'{}');return o.d===today()&&Array.isArray(o.ids)?o.ids:[];}catch(e){return [];}}
function dismiss(id){const ids=dismissed();if(ids.indexOf(id)<0)ids.push(id);try{localStorage.setItem('ritmo.dismiss',JSON.stringify({d:today(),ids}));}catch(e){}}
function suggestions(){
  if(S.settings.myday&&S.settings.myday.sugg===false)return [];
  const td=today(),tm=addDays(td,1),soon=addDays(td,3),dis=new Set(dismissed()),out=[];
  S.tasks.forEach(t=>{
    if(isDone(t)||inMyDay(t)||dis.has(t.id))return;
    const p=prioOf(t);let sc=0,why='';
    let icon='cal',cls='';
    if(t.date&&t.date<td){sc=100+Math.min(30,dayDiff(t.date,td));why=`Atrasada desde ${relDay(t.date).toLowerCase()}`;cls='late';}
    else if(t.date===td){sc=90;why=t.rem?`Para hoje às ${t.rem}`:'Para hoje';cls='today';}
    else if(p===3&&(!t.date||t.date<=soon)){sc=70;why='Prioridade alta';icon='flag';}
    else if(t.date===tm){sc=50;why='Para amanhã';}
    else if(t.date&&t.date<=soon){sc=30;why=`Para ${DOWM[parseISO(t.date).getDay()]}`;}
    if(!sc)return;out.push({t,sc:sc+p*3,why,icon,cls});
  });
  return out.sort((a,b)=>b.sc-a.sc).slice(0,20);
}
function suggRow(s){

}

  }

/* ---------- Calendário ---------- */
function dayDots(d){
  const ev=eventsOn(d),tk=S.tasks.filter(t=>t.date===d&&!isDone(t)).length;
  return ev.slice(0,3).map(e=>`<i style="--c:${catVar(e.cat)}"></i>`).join('')+(tk&&ev.length<3?'<i style="--c:var(--faint)"></i>':'');
}
function weekStrip(){
  const ws=weekStart(S.sel),td=today();let h='';
  for(let i=0;i<7;i++){const d=addDays(ws,i),x=parseISO(d);
    h+=`<button type="button" class="wd ${d===td?'today':''} ${d===S.sel?'sel':''}" data-act="pick-day" data-d="${d}" aria-pressed="${d===S.sel}" aria-label="${esc(dLong(d))}"><span class="w">${WD1[i]}</span><span class="d">${x.getDate()}</span><span class="dots">${dayDots(d)}</span></button>`;}
  return `<div class="cal-strip">${h}</div>`;
}
function monthGrid(){
  const [y,m]=S.calMonth.split('-').map(Number),first=new Date(y,m-1,1),start=addDays(isoOf(first),-first.getDay()),td=today();
  const cells=Math.ceil((first.getDay()+new Date(y,m,0).getDate())/7)*7;
  let g=WD1.map(w=>`<span class="dw">${w}</span>`).join('');
  for(let i=0;i<cells;i++){const d=addDays(start,i),x=parseISO(d),out=x.getMonth()!==m-1;
    g+=`<button type="button" class="md ${out?'out':''} ${d===td?'today':''} ${d===S.sel?'sel':''}" data-act="pick-day" data-d="${d}" aria-pressed="${d===S.sel}" aria-label="${esc(dLong(d))}"><span class="d">${x.getDate()}</span><span class="dots">${dayDots(d)}</span></button>`;}
  return `<div class="mon"><div class="mgrid">${g}</div></div>`;
}
function vCal(){
  const v=S.calView;let h=S.monOpen?monthGrid():(v==='3d'||v==='semana'?'':weekStrip());
  h+=`<div class="cal-body" id="calBody">${v==='agenda'?calAgenda():v==='dia'?calDays(1):v==='3d'?calDays(3):calDays(7)}</div>`;
  return h;
}
function evItem(it,d){
  const td=today(),past=d<td||(d===td&&!it.allDay&&it.e<=nowMin()),e=S.events.find(x=>x.id===it.id),bell=e&&canAlarm()&&!e.ex&&alertOf(e)!=='off'&&!it.allDay;
  const sub=[catName(it.cat,'Sem lista')];if(it.rep)sub.push(repText(it.rep).toLowerCase());
  return `<button type="button" class="ag-item ${past?'past':''}" data-act="edit-ev" data-id="${esc(it.id)}"><span class="ag-time">${it.allDay?'Dia<small>inteiro</small>':`${hhmm(it.s)}<small>${hhmm(it.e)}</small>`}</span><span class="ag-bar" style="--c:${catVar(it.cat)}"></span><span class="ag-tx"><b>${esc(it.title)}</b><span class="meta"><span class="mi">${esc(sub.join(', '))}</span>${bell?`<span class="mi">${ic('bell')}${alertOf(e)==='alarm'?'Alarme':'Aviso'}${leadOf(e)?` ${leadOf(e)} min antes`:''}</span>`:''}</span></span></button>`;
}
function calAgenda(){
  const start=S.sel,td=today();let h='',gapFrom=null,gapTo=null,shown=0;
  const flush=()=>{if(gapFrom){h+=`<p class="ag-gap">${gapFrom===gapTo?`Nada em ${esc(dLabel(gapFrom,1))}`:`Nada de ${esc(dLabel(gapFrom,1))} a ${esc(dLabel(gapTo,1))}`}</p>`;gapFrom=gapTo=null;}};
  for(let i=0;i<35;i++){
    const d=addDays(start,i),evs=eventsOn(d),tks=tasksOn(d);
    if(!evs.length&&!tks.length&&d!==td&&i>0){if(!gapFrom)gapFrom=d;gapTo=d;continue;}
    flush();shown++;
    const x=parseISO(d),lab=d===td?'Hoje':d===addDays(td,1)?'Amanhã':d===addDays(td,-1)?'Ontem':DOWM[x.getDay()];
    h+=`<section class="ag-day"><div class="ag-h ${d===td?'today':''}"><b>${esc(lab)}</b><span>${esc(lab===DOWM[x.getDay()]?dMid(d):dLong(d))}</span></div>`;
    h+=evs.map(e=>evItem(e,d)).join('');
    if(tks.length)h+=`<div class="rows">${tks.map(t=>taskRow(t,{date:false})).join('')}</div>`;
    if(!evs.length&&!tks.length)h+=`<p class="ag-gap" style="padding-left:0">Nada marcado. Toque em + para criar um evento.</p>`;
    h+='</section>';
  }
  flush();
  return h;
}
function layout(items){
  items=items.map(it=>Object.assign({},it)).sort((a,b)=>a.s-b.s||b.e-a.e);
  let cl=null,end=-1;const cls=[];
  items.forEach(it=>{if(!cl||it.s>=end){cl=[];cls.push(cl);end=it.e;}else end=Math.max(end,it.e);cl.push(it);});

function tdCommitText(){

/* ---------- criação rápida com linguagem natural ---------- */
const WDN=[['domingo','dom'],['segunda','seg'],['terca','ter'],['quarta','qua'],['quinta','qui'],['sexta','sex'],['sabado','sab']];
function wdIdx(w){w=nrm(w).replace(/-feiras?$/,'');if(w.length>3)w=w.replace(/s$/,'');return WDN.findIndex(a=>a.indexOf(w)>=0);}
function parseQuick(raw,habit){
  const r={title:'',date:null,start:null,end:null,dur:null,cat:null,prio:null,target:null,unit:'',per:null,days:[],freq:null};
  const td=today();let s=' '+String(raw||'').replace(/\s+/g,' ')+' ';
  const cut=(re,fn)=>{s=s.replace(re,function(){const v=fn.apply(null,arguments);return v===false?arguments[0]:' ';});};
  cut(/\s#([^\s#!]+)(?=\s)/g,(m,tag)=>{const t=nrm(tag).replace(/[-_]/g,'');const c=cats().find(x=>nrm(x.n).replace(/\s+/g,'')===t);if(!c)return false;r.cat=c.k;});
  cut(/\s!(alta|a|3|m[eé]dia|m|b|2|baixa|c|1)(?=\s)/gi,(m,p)=>{p=nrm(p);r.prio=['alta','a','3'].includes(p)?3:['media','m','b','2'].includes(p)?2:1;});
  if(habit){
    cut(/\s(\d)\s*(?:x|vezes)\s+(?:por|na|a)\s+semana(?=\s)/gi,(m,n)=>{if(+n<1||+n>7)return false;r.per=+n;r.freq='weekly';});
    cut(/\s(?:todos\s+os\s+dias|todo\s+dia|diariamente)(?=\s)/gi,()=>{r.freq='daily';});
    cut(/\s(domingos?|segundas?(?:-feiras?)?|ter[cç]as?(?:-feiras?)?|quartas?(?:-feiras?)?|quintas?(?:-feiras?)?|sextas?(?:-feiras?)?|s[aá]bados?|dom|seg|ter|qua|qui|sex|s[aá]b)(?=[\s,])/gi,(m,w)=>{const i=wdIdx(w);if(i<0)return false;if(r.days.indexOf(i)<0)r.days.push(i);});
    cut(/\s(\d{1,3})\s+([a-zà-ú]{2,20})(?=\s)/gi,(m,n,u)=>{if(r.target)return false;r.target=+n;r.unit=u.toLowerCase();});
    if(r.days.length&&!r.freq)r.freq='days';
  }else{
    cut(/\s(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?(?=\s)/g,(m,dd,mm,yy)=>{let y=yy?+yy:parseISO(td).getFullYear();if(y<100)y+=2000;const dt=new Date(y,+mm-1,+dd);if(dt.getMonth()!==+mm-1||dt.getDate()!==+dd)return false;if(!yy&&isoOf(dt)<td)dt.setFullYear(y+1);r.date=isoOf(dt);});
    cut(/\s(?:no\s+)?dia\s+(\d{1,2})(?=\s)/gi,(m,dd)=>{const t=parseISO(td);let dt=new Date(t.getFullYear(),t.getMonth(),+dd);if(dt.getDate()!==+dd)return false;if(isoOf(dt)<td)dt=new Date(t.getFullYear(),t.getMonth()+1,+dd);r.date=isoOf(dt);});
    cut(/\sdepois\s+de\s+amanh[ãa](?=\s)/gi,()=>{r.date=addDays(td,2);});
    cut(/\samanh[ãa](?=\s)/gi,()=>{if(!r.date)r.date=addDays(td,1);});
    cut(/\shoje(?=\s)/gi,()=>{r.date=td;});
    cut(/\s(?:semana\s+que\s+vem|pr[oó]xima\s+semana)(?=\s)/gi,()=>{r.date=addDays(weekStart(td),8);});
    cut(/\s(?:(?:na|no|nesta|neste|pr[oó]xima|pr[oó]ximo)\s+)?(domingo|segunda(?:-feira)?|ter[cç]a(?:-feira)?|quarta(?:-feira)?|quinta(?:-feira)?|sexta(?:-feira)?|s[aá]bado|dom|seg|ter|qua|qui|sex|s[aá]b)(?=\s)/gi,(m,w)=>{const i=wdIdx(w);if(i<0)return false;let k=(i-parseISO(td).getDay()+7)%7;if(k===0)k=7;r.date=addDays(td,k);});
    cut(/\s(?:por|durante)\s+(?:(\d{1,2})\s*h(?:oras?)?(?:\s*e?\s*(\d{1,2})\s*(?:min(?:utos)?)?)?|(\d{1,3})\s*min(?:utos)?)(?=\s)/gi,(m,h,mi,only)=>{const v=only?+only:(+h*60+(+mi||0));if(!v||v>720)return false;r.dur=v;});
    s=s.replace(/([\dh])\s*[-–]\s*(\d)/gi,'$1 - $2');
    const times=[];
    cut(/\s(?:(?:[àa]s|das|de|at[ée]|a\s+partir\s+das)\s+)?(\d{1,2})(?::(\d{2})|h(\d{2})?)(?=[\s,.])/gi,(m,h,m1,m2)=>{const hh=+h,mm=+(m1||m2||0);if(hh>23||mm>59)return false;times.push(hh*60+mm);});
    cut(/\s(?:às|das)\s+(\d{1,2})(?=\s)/gi,(m,h)=>{if(+h>23)return false;times.push(+h*60);});

  }

  for(let i=0;i<3;i++)t=t.replace(/^(?:e|de|da|do|no|na|em|para|às)\s+/i,'').replace(/\s+(?:e|de|da|do|no|na|em|para|às|dia|a|o)$/i,'').trim();
  r.title=t?t[0].toUpperCase()+t.slice(1):'';
  return r;
}

function qResolve(){

  }

    let date=r.date||chipDate(q)||q.pre.date||null;const rem=r.start!=null?hhmm(r.start):null;
    if(rem&&!date)date=r.start>nowMin()?td:addDays(td,1);
    return {type:'task',title:r.title,date,rem,prio:r.prio||0,ctx:r.cat||(q.pre.ctx!==undefined?q.pre.ctx:null),my:q.my,tags:q.pre.tags||[]};

function qUpdate(){
  const box=$('#qPrev');if(!box||!S.q)return;const v=qResolve(),q=S.q;

function renderSearch(q){

  const tk=S.tasks.filter(t=>has(t.title)||has(t.notes)||subsOf(t).some(s=>has(s.t))||tagsOf(t).some(has)).sort((a,b)=>isDone(a)-isDone(b)||byDate(a,b)).slice(0,30);

  if(hb.length)h+=`<div class="res-h">Hábitos</div><div class="hlist">${hb.map(x=>`<div class="hrow" style="--c:${catVar(x.cat)}"><button type="button" class="hmain" data-act="h-open" data-id="${esc(x.id)}"><span class="hname">${esc(x.name)}</span><span class="hmeta">${esc(hSchedText(x))}${x.archived?', arquivado':''}</span></button></div>`).join('')}</div>`;
