<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Feito</title>
<style>@font-face{font-family:"Inter";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/inter-400.woff2) format("woff2")}@font-face{font-family:"Inter";font-style:normal;font-weight:500;font-display:swap;src:url(fonts/inter-500.woff2) format("woff2")}@font-face{font-family:"Inter";font-style:normal;font-weight:600;font-display:swap;src:url(fonts/inter-600.woff2) format("woff2")}@font-face{font-family:"Inter";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/inter-700.woff2) format("woff2")}</style>
<style>
/* Feito: medidas e cores tiradas do Any.do (ver DESIGN.md). Uma coluna de celular,
   barra superior de 56, seções de 52, barra "Eu quero…" de 56 na base, Inter em tudo. */
:root{
  --f:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --bg:#fff;--card:#fff;--ink:#000;--ink-2:#333;--muted:#9197a3;--ph:#9b9b9b;--icon:#b2b2b2;--faint:#ccc;--hour:#dcdcdc;
  --line:#ececec;--line-2:#f2f2f2;--line-3:#f9f9f9;--fill:#fafafa;--fill-2:#f3f4f6;
  --accent:#0083ff;--accent-2:#0070db;--accent-weak:rgba(0,131,255,.1);--on-accent:#fff;
  --now:#f0063c;--danger:#f0063c;--warn:#ff9500;--ok:#0083ff;
  --pri-1:#0083ff;--pri-2:#ff9500;--pri-3:#f0063c;
  --p-azul:#0083ff;--p-verde:#2fb350;--p-violeta:#a64fd6;--p-terracota:#ff6a3d;--p-turquesa:#00a9b8;--p-rosa:#f2367d;
  --p-ambar:#f5a800;--p-indigo:#5856d6;--p-oliva:#8a9a2b;--p-vinho:#b0244f;--p-ouro:#d99a00;--p-ardosia:#8e8e93;
  --pill-shadow:0 7px 22px -5px rgba(0,0,0,.17),0 0 5px rgba(0,0,0,.05);
  --menu-shadow:0 12px 32px rgba(0,0,0,.14),0 0 0 .5px rgba(0,0,0,.08);
  --grid-shadow:0 4px 9px -4px rgba(0,0,0,.09);
  --head-shadow:0 2px 3px -1px rgba(0,0,0,.09);
  --scrim:rgba(0,0,0,.32);--toast:#1c1c1e;--toast-ink:#fff;--toast-act:#5ab0ff;
  --hh:51px;--gut:50px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000;--card:#1c1c1e;--ink:#fff;--ink-2:#d1d1d6;--muted:#8b919c;--ph:#6e6e73;--icon:#68686e;--faint:#48484a;--hour:#3d3d40;
  --line:#1e1e21;--line-2:#28282c;--line-3:#121214;--fill:#0e0e10;--fill-2:#1c1c1e;
  --accent:#2e95ff;--accent-2:#5aabff;--accent-weak:rgba(46,149,255,.17);
  --now:#ff375f;--danger:#ff453a;--warn:#ff9f0a;--ok:#2e95ff;--pri-1:#2e95ff;--pri-2:#ff9f0a;--pri-3:#ff453a;
  --p-azul:#2e95ff;--p-verde:#32d158;--p-violeta:#bf5af2;--p-terracota:#ff7a4d;--p-turquesa:#2bc8d6;--p-rosa:#ff4f8f;
  --p-ambar:#ffbe1f;--p-indigo:#7d7aff;--p-oliva:#a8b84a;--p-vinho:#e0567f;--p-ouro:#f0b51c;--p-ardosia:#98989f;
  --pill-shadow:0 0 0 1px #26262a;--menu-shadow:0 12px 32px rgba(0,0,0,.6),0 0 0 1px #2c2c2e;
  --grid-shadow:0 1px 0 #1e1e21;--head-shadow:0 1px 0 #1e1e21;
  --scrim:rgba(0,0,0,.6);--toast:#2c2c2e;color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#000;--card:#1c1c1e;--ink:#fff;--ink-2:#d1d1d6;--muted:#8b919c;--ph:#6e6e73;--icon:#68686e;--faint:#48484a;--hour:#3d3d40;
  --line:#1e1e21;--line-2:#28282c;--line-3:#121214;--fill:#0e0e10;--fill-2:#1c1c1e;
  --accent:#2e95ff;--accent-2:#5aabff;--accent-weak:rgba(46,149,255,.17);
  --now:#ff375f;--danger:#ff453a;--warn:#ff9f0a;--ok:#2e95ff;--pri-1:#2e95ff;--pri-2:#ff9f0a;--pri-3:#ff453a;
  --p-azul:#2e95ff;--p-verde:#32d158;--p-violeta:#bf5af2;--p-terracota:#ff7a4d;--p-turquesa:#2bc8d6;--p-rosa:#ff4f8f;
  --p-ambar:#ffbe1f;--p-indigo:#7d7aff;--p-oliva:#a8b84a;--p-vinho:#e0567f;--p-ouro:#f0b51c;--p-ardosia:#98989f;
  --pill-shadow:0 0 0 1px #26262a;--menu-shadow:0 12px 32px rgba(0,0,0,.6),0 0 0 1px #2c2c2e;
  --grid-shadow:0 1px 0 #1e1e21;--head-shadow:0 1px 0 #1e1e21;
  --scrim:rgba(0,0,0,.6);--toast:#2c2c2e;color-scheme:dark;
}

/* ---------- base ---------- */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:17px;line-height:1.3;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow-x:hidden;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
button{font:inherit;color:inherit;background:none;border:0;margin:0;padding:0;cursor:pointer;text-align:inherit;-webkit-appearance:none;appearance:none}
input,textarea,select{font:inherit;color:inherit}
svg{display:block;flex:none}
:focus{outline:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}
.col{width:100%;max-width:640px;margin:0 auto}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- barra superior ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);transition:box-shadow .2s}
.top.scrolled{box-shadow:0 1px 3px rgba(0,0,0,.06)}
body.cal .top.scrolled{box-shadow:none}
.tb{display:grid;grid-template-columns:92px minmax(0,1fr) 92px;align-items:center;height:56px;padding:0 max(8px,env(safe-area-inset-right,0px)) 0 max(8px,env(safe-area-inset-left,0px))}
.tb-l,.tb-r{display:flex;align-items:center;gap:2px;min-width:0}
.tb-r{justify-content:flex-end}
.ib{width:40px;height:40px;display:grid;place-items:center;color:var(--icon);border-radius:20px;position:relative;flex:none}
.ib svg{width:24px;height:24px}
.ib.on{color:var(--accent)}
.ib .badge{position:absolute;top:4px;right:3px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--accent);color:#fff;font-size:10.5px;font-weight:700;line-height:16px;text-align:center}
.tb-t{margin:0;justify-self:center;max-width:100%;text-align:center;font-size:16px;line-height:19.5px;font-weight:700;letter-spacing:0;text-transform:uppercase;text-wrap:balance;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tb-mon{justify-self:center;display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 4px;font-size:16px;font-weight:700;white-space:nowrap}
.tb-mon svg{width:16px;height:16px;color:var(--faint);stroke-width:2}

/* ---------- conteúdo ---------- */
#main{padding-bottom:calc(112px + env(safe-area-inset-bottom,0px));min-height:calc(100vh - 56px)}
body.fb-on #main{padding-bottom:calc(172px + env(safe-area-inset-bottom,0px))}
.pad{padding-left:16px;padding-right:16px}
.note{display:flex;align-items:center;gap:12px;margin:2px 16px 4px;padding:10px 12px 10px 14px;border-radius:10px;background:var(--fill-2);font-size:13px;line-height:18px;color:var(--ink-2)}
.note button{margin-left:auto;color:var(--accent);font-weight:600;white-space:nowrap;padding:4px 2px}
.empty{padding:36px 28px 12px;text-align:center;font-size:13px;line-height:19px;color:var(--muted)}
.empty b{display:block;margin-bottom:6px;font-size:16px;line-height:22px;font-weight:600;color:var(--ink)}
.empty .btn{margin-top:18px}
.lab{font-size:11.25px;line-height:14px;font-weight:600;letter-spacing:.01em;text-transform:uppercase;color:var(--muted)}

/* ---------- seções (Hoje, Amanhã, Em breve, Outro dia) ---------- */
.secs{padding-top:10px}
.sh{display:flex;align-items:center;min-height:52px;padding:0 8px 0 16px}
.sh-t{flex:1;min-width:0;min-height:52px;display:flex;align-items:center;gap:8px;font-size:19px;line-height:24px;font-weight:700;color:var(--ink);text-align:left}
.sh-t .sub{font-size:13px;font-weight:400;color:var(--muted)}
.sh-t.late{color:var(--danger)}
.sh-r{width:40px;height:40px;display:grid;place-items:center;color:var(--icon);flex:none}
.sh-r svg{width:24px;height:24px;stroke-width:1.5}
.cnt{min-width:24px;height:24px;padding:0 6px;border-radius:12px;border:1.25px solid var(--accent);color:var(--accent);font-size:12px;line-height:21.5px;text-align:center;font-weight:400}
.sh+.rows{margin-top:-6px}
.rows{padding-bottom:4px}

/* ---------- linha de tarefa ---------- */
.tr{position:relative;overflow:hidden;touch-action:pan-y}
.tr-in{position:relative;z-index:1;display:flex;align-items:flex-start;padding:0 16px;background:var(--bg);transition:transform .18s ease}
.tr.drag .tr-in{transition:none}
.cb{flex:none;width:34px;min-height:52px;display:flex;align-items:center;padding:0;align-self:flex-start;height:52px}
.cb .box{width:19px;height:19px;border:1.6px solid var(--icon);border-radius:4px;display:grid;place-items:center;transition:background .15s,border-color .15s}
.cb .box svg{width:13px;height:13px;stroke-width:2.6;color:#fff;opacity:0}
.cb.on .box,.cb.pop .box{background:var(--accent);border-color:var(--accent)}
.cb.on .box svg,.cb.pop .box svg{opacity:1}
.tr.done .cb .box{background:var(--icon);border-color:var(--icon)}
.cb.pop .box{animation:pop .3s ease}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.22)}100%{transform:scale(1)}}
.tr-main{flex:1;min-width:0;padding:15px 0;text-align:left;display:block}
.tr-t{display:block;font-size:16px;line-height:22px;color:var(--ink);overflow-wrap:anywhere}
.tr.done .tr-t{color:var(--icon);text-decoration:line-through;text-decoration-color:var(--icon)}
.tr-m{display:flex;flex-wrap:wrap;align-items:center;gap:2px 12px;margin-top:3px;font-size:13px;line-height:18px;color:var(--muted)}
.mi{display:inline-flex;align-items:center;gap:4px;white-space:nowrap;min-width:0}
.mi svg{width:14px;height:14px;stroke-width:1.9}
.mi.late{color:var(--danger)}
.mi.today{color:var(--accent)}
.mi.sun{color:var(--warn)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c,var(--faint));flex:none}
.tag{color:var(--accent);white-space:nowrap}
.flag{flex:none;width:24px;height:52px;display:grid;place-items:center;margin-right:-4px}
.flag svg{width:16px;height:16px;stroke-width:1.9}
.flag.p1{color:var(--pri-1)}.flag.p2{color:var(--pri-2)}.flag.p3{color:var(--pri-3)}
.tr-bg{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 20px;font-size:14px;font-weight:600;color:#fff;opacity:0}
.tr-bg span{display:inline-flex;align-items:center;gap:8px}
.tr-bg svg{width:20px;height:20px;stroke-width:2.2}
.tr.go-r .tr-bg{opacity:1;background:var(--accent)}
.tr.go-l .tr-bg{opacity:1;background:var(--danger)}
.tr.go-r .tr-bg .r,.tr.go-l .tr-bg .l{visibility:hidden}
.addrow{display:flex;align-items:center;gap:0;width:100%;min-height:44px;padding:0 16px;font-size:15px;color:var(--ph)}
.addrow svg{width:19px;height:19px;margin-right:15px;color:var(--icon);stroke-width:1.6}

/* ---------- Meu dia ---------- */
.hello{padding:10px 16px 8px}
.hello h2{margin:4px 0 0;font-size:19px;line-height:24px;font-weight:700}
.hello p{margin:4px 0 0;font-size:13px;line-height:18px;color:var(--muted)}
.prog{height:3px;margin:12px 16px 4px;border-radius:2px;background:var(--line-2);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);border-radius:2px;transition:width .3s}
.sg{display:flex;align-items:flex-start;padding:0 8px 0 16px}
.sg .tr-main{padding-left:34px}
.sg-b{width:40px;height:52px;display:grid;place-items:center;color:var(--icon);flex:none}
.sg-b svg{width:20px;height:20px;stroke-width:1.7}
.sg-b.add{color:var(--accent)}
.er{display:flex;align-items:flex-start;width:100%;padding:0 16px;text-align:left}
.evb{flex:none;width:34px;height:52px;display:flex;align-items:center}
.evb::before{content:"";width:4px;height:19px;margin-left:7.5px;border-radius:2px;background:var(--c,var(--accent))}
.er.past .tr-t{color:var(--muted)}
.focus-row{display:flex;align-items:center;gap:15px;width:100%;min-height:52px;padding:0 16px;text-align:left}
.focus-row .fi{width:19px;display:grid;place-items:center;color:var(--accent)}
.focus-row .fi svg{width:21px;height:21px}
.focus-row b{font-size:16px;font-weight:400}
.focus-row small{display:block;font-size:13px;color:var(--muted)}

/* ---------- calendário ---------- */
.calhead{position:sticky;top:calc(56px + env(safe-area-inset-top,0px));z-index:15;background:var(--bg)}
.calgrid{position:relative;z-index:2;background:var(--bg);box-shadow:var(--grid-shadow);padding-bottom:0}
.wdr,.mg{display:grid;grid-template-columns:repeat(7,1fr)}
.wdr{height:30px;align-items:center;margin-top:2px}
.wdr span{text-align:center;font-size:13px;color:var(--ink-2)}
.md{position:relative;height:30px;display:grid;place-items:center}
.md .n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:14px;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums}
.md.out .n{color:var(--faint)}
.md.sel .n{background:var(--line-2)}
.md.today .n{background:var(--accent);color:#fff;font-weight:700}
.md .dts{position:absolute;bottom:1px;left:50%;transform:translateX(-50%);display:flex;gap:2px}
.md .dts i{width:3.5px;height:3.5px;border-radius:50%;background:var(--c,var(--icon))}
.md.today .dts{display:none}
.dayhead{position:relative;z-index:1;background:var(--bg);box-shadow:var(--head-shadow)}
.dlab{height:34px;display:flex;align-items:center;justify-content:space-between;padding:0 4px}
.dlab .lab{flex:1;text-align:center}
.dlab .nav{width:40px;height:34px;display:grid;place-items:center;color:var(--faint)}
.dlab .nav svg{width:16px;height:16px;stroke-width:2}
.adrow{display:flex;padding-left:var(--gut)}
.adbox{flex:1;min-width:0;min-height:27px;border:1px solid var(--line-2);border-right:0;border-radius:4px 0 0 4px;background:var(--fill);padding:2px 0 2px 6px;display:flex;flex-direction:column;gap:2px}
.adi{display:flex;align-items:center;gap:8px;min-height:21px;font-size:13px;line-height:17px;color:var(--ink);text-align:left;width:100%;padding-right:8px;min-width:0}
.adi span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.adi .ring{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--icon);flex:none}
.adi.done span{text-decoration:line-through;color:var(--icon)}
.adi.done .ring{background:var(--icon)}
.adi .bar{width:3px;height:13px;border-radius:2px;background:var(--c);flex:none}
.adi .t{margin-left:auto;color:var(--muted);font-size:12px}
.adtog{height:29.5px;display:flex;align-items:flex-start}
.adtog button{width:var(--gut);height:22px;display:grid;place-items:center;color:#aaa;margin-top:1px}
.adtog button svg{width:16px;height:16px;stroke-width:2.2}
.adtog .more{font-size:12px;color:var(--muted);padding-top:4px}
.tl{position:relative;display:grid;grid-template-columns:var(--gut) minmax(0,1fr);height:calc(24 * var(--hh));margin-top:14px}
.tl-g{position:relative}
.tl-g span{position:absolute;left:0;width:var(--gut);text-align:center;transform:translateY(-50%);font-size:10px;line-height:14px;color:var(--hour);font-variant-numeric:tabular-nums}
.tl-cols{position:relative;display:grid;background:repeating-linear-gradient(180deg,var(--line) 0,var(--line) 1px,transparent 1px,transparent var(--hh)),repeating-linear-gradient(180deg,transparent 0,transparent calc(var(--hh) / 2),var(--line-3) calc(var(--hh) / 2),var(--line-3) calc(var(--hh) / 2 + 1px),transparent calc(var(--hh) / 2 + 1px),transparent var(--hh))}
.tl-col{position:relative;min-width:0}
.tl-col+.tl-col{border-left:1px solid var(--line-2)}
.slot{position:absolute;left:0;right:0;height:var(--hh)}
.ev{position:absolute;z-index:2;overflow:hidden;border-radius:4px;padding:3px 6px;text-align:left;background:var(--fill-2);background:color-mix(in srgb,var(--c) 14%,var(--bg));border-left:3px solid var(--c);font-size:12.5px;line-height:15px;color:var(--ink)}
.ev b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev span{display:block;color:var(--muted);font-size:11.5px;white-space:nowrap}
.ev.past{opacity:.55}
.ev.short{display:flex;align-items:center;padding-top:0;padding-bottom:0}
.ev.short span{display:none}
.tl.dense .ev{padding:2px 3px 2px 4px;font-size:11px;line-height:13px;border-left-width:2px}
.tl.dense .ev b{white-space:normal;overflow-wrap:anywhere;font-weight:600}
.tl.dense .ev span{display:none}
.ev.tk{border-left-style:dotted}
.nowl{position:absolute;z-index:3;left:0;right:0;height:1.15px;background:var(--now);pointer-events:none}
.nowl::before{content:"";position:absolute;left:0;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:var(--now)}
.mdays{display:grid;padding-left:var(--gut)}
.mday{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0 6px;min-width:0}
.mday .w{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase}
.mday .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:14px;color:var(--ink)}
.mday.today .n{background:var(--accent);color:#fff;font-weight:700}
.mday.sel:not(.today) .n{background:var(--line-2)}
.mday .x{height:12px;font-size:10.5px;color:var(--muted)}
.agh{padding:20px 16px 2px}
.agh.today .lab{color:var(--accent)}
.gap{padding:10px 16px 6px 50px;font-size:13px;color:var(--muted)}
.cal-empty{padding:8px 16px 0 50px;font-size:13px;color:var(--muted)}

/* ---------- hábitos ---------- */
.hwk{display:grid;grid-template-columns:repeat(7,1fr);padding-top:2px}
.hwk .w{height:30px;display:grid;place-items:center;font-size:13px;color:var(--ink-2)}
.hwd{height:38px;display:grid;place-items:center;position:relative}
.hwd svg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.hwd b{position:relative;font-size:14px;font-weight:400;color:var(--ink);font-variant-numeric:tabular-nums}
.hwd.today b{color:var(--accent);font-weight:600}
.hwd.sel b{font-weight:700}
.hwd.full b{color:#fff;font-weight:700}
.hsum{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:14px 16px 4px;flex-wrap:wrap}
.hsum b{font-size:14px;font-weight:600}
.hsum span{font-size:13px;color:var(--muted)}
.hb{display:flex;align-items:flex-start;padding:0 8px 0 16px}
.hb.off{opacity:.55}
.hctl{flex:none;width:34px;height:52px;display:flex;align-items:center;justify-content:flex-start;position:relative;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.hctl .o{width:24px;height:24px;border-radius:50%;border:1.6px solid var(--icon);display:grid;place-items:center;position:relative}
.hctl .o svg.ck{width:14px;height:14px;stroke-width:2.6;color:#fff}
.hctl.done .o{background:var(--accent);border-color:var(--accent)}
.hctl .o.cnt-r{border:0}
.hctl .o.cnt-r svg.rg{position:absolute;inset:0}

.streak{flex:none;height:52px;display:flex;align-items:center;gap:3px;padding:0 8px;font-size:13px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}

.hint{padding:14px 28px 0;text-align:center;font-size:13px;line-height:19px;color:var(--muted)}
.st4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:6px 16px 6px}

.st4 span{display:block;font-size:11.25px;line-height:14px;color:var(--muted)}
.md.done .n{background:var(--accent);color:#fff;font-weight:600}

.md.ns .n,.md.fut .n,.md.pre .n{color:var(--faint)}

.mnav{display:flex;align-items:center;justify-content:space-between;padding:6px 8px 2px 16px}

/* ---------- barra de baixo: Início + "Eu quero…" ---------- */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:25;padding:16px 0 calc(24px + env(safe-area-inset-bottom,0px));pointer-events:none;background:linear-gradient(to bottom,transparent,var(--bg) 26px)}
.dock-in{display:flex;align-items:center;gap:8px;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));pointer-events:auto}

.ask{flex:1;min-width:0;height:56px;display:flex;align-items:center;border-radius:28px;background:var(--card);box-shadow:var(--pill-shadow);padding:0 8px 0 24px}

.ask input::placeholder{color:var(--ph);opacity:1}
.ask-ic{flex:none;width:40px;height:40px;margin-right:8px;display:grid;place-items:center;color:var(--accent)}

.askopts::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:16px;border:1px solid var(--line);background:var(--bg);font-size:13.5px;color:var(--ink-2);white-space:nowrap}
.chip svg{width:15px;height:15px;stroke-width:1.9}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.chip.warn{color:var(--danger);border-color:var(--danger)}
.chips{display:flex;flex-wrap:wrap;gap:8px}

/* ---------- barra do timer de foco ---------- */
.focusbar{position:fixed;left:0;right:0;bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:24;pointer-events:none}
.fb-in{display:flex;align-items:center;gap:12px;margin:0 16px;padding:0 6px 0 16px;height:52px;border-radius:26px;background:var(--card);box-shadow:var(--pill-shadow);pointer-events:auto}
.fb-in .t{flex:1;min-width:0;text-align:left}
.fb-in .t>b{display:block;font-size:15px;line-height:19px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fb-in .t>span{display:block;font-size:12.5px;line-height:16px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.fb-in .p svg{width:18px;height:18px}

/* ---------- folhas ---------- */
.sheet-wrap{position:fixed;inset:0;z-index:40;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;animation:fade .18s ease}
.sheet{position:relative;width:100%;max-width:640px;height:calc(100% - 8px - env(safe-area-inset-top,0px));background:var(--bg);border-radius:14px 14px 0 0;overflow-y:auto;overscroll-behavior:contain;padding-bottom:calc(28px + env(safe-area-inset-bottom,0px));animation:up .24s cubic-bezier(.2,.8,.2,1)}
.sheet.half{height:auto;max-height:calc(100% - 48px)}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.grab{position:absolute;top:6px;left:50%;width:36px;height:4px;margin-left:-18px;border-radius:2px;background:var(--hour);z-index:3}
.sb{position:sticky;top:0;z-index:2;display:grid;grid-template-columns:92px minmax(0,1fr) 92px;align-items:center;height:56px;padding:0 8px;background:var(--bg)}
.sb-l,.sb-r{display:flex;align-items:center;gap:2px}
.sb-r{justify-content:flex-end}
.sb-t svg{display:inline-block;width:14px;height:14px;color:var(--faint);stroke-width:2.2;vertical-align:middle}
.sb-t .logo{width:24px;height:24px;color:inherit}
.sb-t{margin:0;text-align:center;font-size:16px;line-height:19.5px;font-weight:700;text-transform:uppercase;text-wrap:balance;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tbtn{height:40px;padding:0 8px;font-size:15px;color:var(--accent);white-space:nowrap}
.tbtn.b{font-weight:600}

.glab{padding:22px 16px 6px}
.fr{display:flex;align-items:flex-start;gap:15px;width:100%;min-height:52px;padding:0 16px;text-align:left;position:relative}
.fr>.fi{flex:none;width:19px;height:52px;display:grid;place-items:center;color:var(--icon)}
.fr>.fi svg{width:21px;height:21px;stroke-width:1.6}
.fr>.fi.on{color:var(--accent)}
.fr .fc{flex:1;min-width:0;padding:15px 0}
.fr .fv{display:block;font-size:16px;line-height:22px;color:var(--ink)}
.fr .fv.ph{color:var(--ph)}
.fr .fv.late{color:var(--danger)}
.fr .fs{display:block;margin-top:2px;font-size:13px;line-height:18px;color:var(--muted)}
.fr .fx{flex:none;width:40px;height:52px;margin-right:-10px;display:grid;place-items:center;color:var(--icon)}
.fr .fx svg{width:18px;height:18px}
.fr .chev{flex:none;height:52px;display:flex;align-items:center;gap:6px;color:var(--muted);font-size:14px}
.fr .chev svg{width:16px;height:16px;color:var(--faint);stroke-width:2}
.fr .chips{margin-top:10px}
.fl{display:flex;align-items:flex-start;gap:8px}
.fl .fv{flex:1;min-width:0;text-align:left}
.fx2{flex:none;width:32px;height:22px;margin-right:-6px;display:grid;place-items:center;color:var(--icon)}
.fx2 svg{width:18px;height:18px}
.fr input.plain,.fr select.plain{display:block;width:100%;border:0;background:transparent;padding:0;font-size:16px;line-height:22px;color:var(--ink);min-height:22px}
.fr input[type="date"].plain,.fr input[type="time"].plain{width:auto;min-width:120px}
.ti{display:block;width:100%;border:0;background:transparent;resize:none;padding:0;margin:0;font-size:19px;line-height:24px;font-weight:700;color:var(--ink);overflow:hidden}
.ti::placeholder,.ta::placeholder,.plain::placeholder{color:var(--ph);opacity:1}

.td-head{display:flex;align-items:flex-start;padding:6px 16px 10px}

.sw{flex:none;width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;transition:background .18s;margin-top:12px}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .18s}
[aria-pressed="true"]>.sw{background:var(--accent)}
[aria-pressed="true"]>.sw::after{transform:translateX(18px)}
.subs{padding:0 16px}
.sub{display:flex;align-items:center;min-height:44px}
.sub .cb{height:44px;min-height:44px}
.sub input{flex:1;min-width:0;border:0;background:transparent;font-size:15px;line-height:22px;padding:8px 0;color:var(--ink)}
.sub.done input{color:var(--icon);text-decoration:line-through}
.sub .rm{width:36px;height:44px;display:grid;place-items:center;color:var(--faint)}
.sub .rm svg{width:16px;height:16px}
.sub-add{display:flex;align-items:center;min-height:44px}
.sub-add svg{width:19px;height:19px;margin-right:15px;color:var(--accent);stroke-width:1.8}
.sub-add input{flex:1;border:0;background:transparent;font-size:15px;padding:8px 0;color:var(--ink)}
.sub-add input::placeholder{color:var(--accent);opacity:1}
.tags{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tagx{display:inline-flex;align-items:center;gap:2px;height:28px;padding:0 4px 0 10px;border-radius:14px;background:var(--accent-weak);color:var(--accent);font-size:13.5px}
.tagx button{width:22px;height:22px;display:grid;place-items:center}
.tagx svg{width:13px;height:13px}
.tagin{border:0;background:transparent;font-size:15px;min-width:120px;flex:1;padding:4px 0;color:var(--ink)}
.acts{padding:18px 0 0}
.act{display:flex;align-items:center;gap:15px;width:100%;min-height:52px;padding:0 16px;font-size:16px;color:var(--accent);text-align:left}
.act svg{width:21px;height:21px;stroke-width:1.6}
.act.danger{color:var(--danger)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 22px;border-radius:22px;background:var(--accent);color:#fff;font-size:15px;font-weight:600;white-space:nowrap}
.btn svg{width:18px;height:18px}
.btn.soft{background:var(--fill-2);color:var(--ink)}
.btn.ghost{background:transparent;color:var(--accent);padding:0 12px}
.btn.wide{width:100%}
.btns{display:flex;gap:10px;flex-wrap:wrap;padding:8px 16px}
.btns .btn{flex:1 1 140px}
.armed{color:#fff!important;background:var(--danger)!important;border-radius:12px}
.rad{display:flex;align-items:center;width:100%;min-height:50px;padding:0 16px;font-size:16px;text-align:left;color:var(--ink)}
.rad svg{margin-left:auto;width:20px;height:20px;color:var(--accent);stroke-width:2.2;opacity:0}
.rad[aria-pressed="true"] svg{opacity:1}
.rad .dot{margin-right:12px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{height:32px;padding:0 12px;border-radius:16px;border:1px solid var(--line);font-size:13.5px;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.seg button[aria-pressed="true"] .dot{box-shadow:0 0 0 1.5px #fff}
.seg.pal button{width:32px;padding:0;justify-content:center}
.seg.pal i{width:18px;height:18px;border-radius:50%}
.field{padding:6px 16px 10px}
.field>.lab{display:block;margin-bottom:8px}
.inp{width:100%;height:44px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:0 12px;font-size:16px;color:var(--ink)}
.inp.big{height:48px;font-size:17px}
textarea.inp{height:auto;padding:10px 12px;line-height:22px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.search{display:flex;align-items:center;gap:10px;margin:2px 16px 8px;height:44px;padding:0 14px;border-radius:22px;background:var(--fill-2);color:var(--muted)}
.search svg{width:19px;height:19px}
.search input{flex:1;min-width:0;border:0;background:transparent;font-size:16px;color:var(--ink);height:44px}
.search input::placeholder{color:var(--ph);opacity:1}

/* ---------- Início (navegação) ---------- */
.hm{display:flex;align-items:center;gap:0;width:100%;min-height:52px;padding:0 8px 0 16px;text-align:left}
.hm .t{flex:1;min-width:0;font-size:19px;line-height:24px;font-weight:700;color:var(--ink)}
.hm.cur .t{color:var(--accent)}
.hm .r{width:40px;height:40px;display:grid;place-items:center;flex:none;color:var(--muted);font-size:13px}
.hl{display:flex;align-items:center;gap:15px;width:100%;min-height:48px;padding:0 8px 0 16px;text-align:left}
.hl .ld{flex:none;width:19px;display:grid;place-items:center}
.hl .dot{width:10px;height:10px}
.hl svg{width:20px;height:20px;color:var(--icon);stroke-width:1.6}
.hl .t{flex:1;min-width:0;font-size:16px;line-height:22px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hl.cur .t{color:var(--accent);font-weight:600}
.hl .n{width:40px;text-align:center;font-size:13px;color:var(--muted)}
.hlab{display:flex;align-items:center;justify-content:space-between;padding:20px 8px 4px 16px}
.hlab .sh-r{width:40px;height:32px}
.hsep{height:1px;background:var(--line-2);margin:12px 16px}
.brand{display:flex;align-items:center;gap:10px;padding:0 16px 6px}
.brand .logo{width:28px;height:28px}
.brand b{font-size:16px;font-weight:700}

/* ---------- menu suspenso ---------- */
.menu{position:fixed;z-index:60;min-width:210px;max-width:min(300px,calc(100vw - 24px));max-height:min(480px,calc(100vh - 24px));overflow-y:auto;background:var(--card);border-radius:12px;box-shadow:var(--menu-shadow);padding:6px 0;animation:fade .12s ease}
.mitem{display:flex;align-items:center;gap:12px;width:100%;min-height:44px;padding:0 16px;font-size:15px;color:var(--ink);text-align:left}
.mitem svg{width:19px;height:19px;color:var(--icon);stroke-width:1.7}
.mitem .ck{margin-left:auto;color:var(--accent);stroke-width:2.2}
.mitem.danger{color:var(--danger)}
.mitem.danger svg{color:var(--danger)}
.mh{padding:10px 16px 4px}
.msep{height:1px;background:var(--line);margin:6px 0}

/* ---------- aviso ---------- */
.toast{position:fixed;left:50%;bottom:calc(94px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;display:flex;align-items:center;gap:18px;max-width:calc(100% - 32px);width:max-content;padding:12px 16px;border-radius:12px;background:var(--toast);color:var(--toast-ink);font-size:14px;line-height:19px;box-shadow:0 8px 24px rgba(0,0,0,.22);animation:fade .15s ease}
body.fb-on .toast{bottom:calc(152px + env(safe-area-inset-bottom,0px))}
.toast-act{color:var(--toast-act);font-weight:600;white-space:nowrap}

/* ---------- modo foco ---------- */
.fmodes{display:flex;gap:8px;overflow-x:auto;padding:4px 16px 2px;scrollbar-width:none}
.fmodes::-webkit-scrollbar{display:none}
.fring{position:relative;width:236px;height:236px;margin:22px auto 6px}
.fring svg.r{width:100%;height:100%;transform:rotate(-90deg)}
.fring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 30px}
.t-big{font-size:44px;line-height:50px;font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.t-task{margin-top:6px;font-size:13px;line-height:18px;color:var(--muted);max-height:36px;overflow:hidden}
.cyc{display:flex;gap:5px;margin-top:8px}
.cyc i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.cyc i.on{background:var(--accent)}
.ctrl{display:flex;align-items:center;justify-content:center;gap:30px;margin:8px 0 6px}
.play{width:64px;height:64px;border-radius:32px;background:var(--accent);color:#fff;display:grid;place-items:center}
.play svg{width:26px;height:26px}
.mdesc{margin:10px 28px 0;text-align:center;font-size:13px;line-height:19px;color:var(--muted)}
.chart{padding:4px 16px 0}
.chart svg{width:100%;height:auto}
.readout{display:flex;justify-content:space-between;gap:10px;padding:6px 16px;font-size:13px;color:var(--muted)}
.readout b{color:var(--ink);font-weight:600}
.log{display:flex;gap:12px;padding:6px 16px;font-size:14px;color:var(--ink-2)}
.log .tm{width:42px;color:var(--muted);font-variant-numeric:tabular-nums}
.log span:last-child{margin-left:auto;color:var(--muted)}
.donemark{width:72px;height:72px;color:var(--accent)}
.donemark path{stroke-dasharray:24;stroke-dashoffset:24;animation:draw .6s .1s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}

/* ---------- boas-vindas e sobre ---------- */
.welcome{padding:6px 24px 0;text-align:left}
.welcome .logo{width:52px;height:52px;margin-bottom:18px}
.welcome h2{margin:0 0 6px;font-size:19px;line-height:24px;font-weight:700}
.welcome p{margin:0 0 18px;font-size:14px;line-height:21px;color:var(--muted)}
.wl{display:flex;align-items:flex-start;gap:14px;padding:9px 0;font-size:14px;line-height:21px;color:var(--ink-2)}
.wl svg{width:20px;height:20px;color:var(--accent);margin-top:1px;stroke-width:1.7}
.about{display:flex;flex-direction:column;align-items:center;gap:8px;padding:30px 24px;text-align:center}
.about .logo{width:64px;height:64px;margin-bottom:6px}
.about b{font-size:19px}
.about p{margin:0;font-size:13px;line-height:19px;color:var(--muted)}
.perm{display:flex;align-items:center;gap:12px;min-height:52px;padding:0 16px}
.perm .pd{width:9px;height:9px;border-radius:50%;background:var(--danger);flex:none}
.perm .pd.ok{background:#2fb350}
.perm .tx{flex:1;min-width:0}
.perm .tx b{display:block;font-size:15px;font-weight:400}
.perm .tx small{display:block;font-size:12.5px;color:var(--muted)}
.perm .ok{font-size:13px;color:var(--muted)}

/* ---------- toque, movimento ---------- */
@media (hover:hover){
  .ib:hover,.sh-r:hover,.sg-b:hover,.fr .fx:hover{background:var(--fill-2)}
  .hm:hover,.hl:hover,.mitem:hover,.rad:hover,.act:hover,.fr.tap:hover,.er:hover,.tr-in:hover{background:var(--line-3)}

}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (min-width:700px){.sheet{height:calc(100% - 48px);border-radius:14px}.sheet-wrap{align-items:center}}
</style>
</head>
<body>
<header class="top" id="top"><div class="col tb" id="topIn"></div></header>
<main class="col" id="main"><p class="empty">Abrindo o Feito…</p></main>
<div class="focusbar" id="focusbar" hidden></div>
<div class="dock" id="dock">
  <div class="col">
    <div class="askopts" id="askOpts" hidden></div>
    <div class="dock-in">
      <button type="button" class="homeb" data-act="home" aria-label="Início"></button>
      <form class="ask" id="ask" data-form="ask" autocomplete="off">
        <input id="askIn" name="t" placeholder="Eu quero..." enterkeyhint="done" aria-label="Eu quero">
        <button type="submit" class="ask-go" id="askGo" hidden>Salvar</button>
        <button type="button" class="ask-ic" id="askIc" data-act="ask-ic" hidden></button>
      </form>
    </div>
  </div>
</div>
<div class="sheet-wrap" id="sheetWrap" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Detalhes"></div></div>

<div class="toast" id="toast" role="status" hidden></div>
<script>
"use strict";
/* ---------- utilitários ---------- */
const AND=(typeof window!=='undefined'&&window.RitmoAndroid)?window.RitmoAndroid:null;
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));

const pad=n=>String(n).padStart(2,'0');
const isoOf=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseISO=s=>{const [y,m,d]=String(s).split('-').map(Number);return new Date(y,m-1,d);};
const addDays=(s,n)=>{const d=parseISO(s);d.setDate(d.getDate()+n);return isoOf(d);};
const dayDiff=(a,b)=>{const [y1,m1,d1]=a.split('-').map(Number),[y2,m2,d2]=b.split('-').map(Number);return Math.round((Date.UTC(y2,m2-1,d2)-Date.UTC(y1,m1-1,d1))/864e5);};
function addMonths(iso,n){const d=parseISO(iso),day=d.getDate(),t=new Date(d.getFullYear(),d.getMonth()+n,1),last=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();t.setDate(Math.min(day,last));return isoOf(t);}
const toMin=t=>{if(!t||typeof t!=='string'||!t.includes(':'))return null;const [h,m]=t.split(':').map(Number);return isNaN(h)||isNaN(m)?null:h*60+m;};

function cats(){
  if(S._cats)return S._cats;
  const c=S.settings.cats;let out;
  if(Array.isArray(c)&&c.length)out=c.filter(x=>x&&x.k);
  else{const used=new Set();S.tasks.forEach(t=>used.add(t.ctx));S.events.forEach(e=>used.add(e.cat));S.habits.forEach(h=>used.add(h.cat));
    out=DEF_CATS.slice();OLD_CATS.forEach(o=>{if(used.has(o.k)&&!out.some(x=>x.k===o.k))out.push(o);});}
  S._cats=out;return out;
}

    const got={t:0,e:0,f:0,c:0,h:0};
    const ready=()=>{S._cats=null;if(!S.ready&&got.t&&got.e&&got.f&&got.c&&got.h){S.ready=true;onReady();}render();};
    const fail=e=>{console.warn('db',e);if(e&&e.code==='revoked'){S.mode='local';toast('A sincronização foi interrompida nesta tela.');}render();};
    db.collection('tasks').onSnapshot(s=>{S.tasks=s.docs.map(d=>Object.assign({},d.data(),{id:d.id}));got.t=1;ready();},fail);

  saveLocal(){try{localStorage.setItem('ritmo.data',JSON.stringify({tasks:S.tasks,events:S.events,habits:S.habits,focus:S.focus,settings:S.settings}));}catch(e){toast('Não foi possível salvar neste aparelho.');}},
  q(path,fn){
    const run=async()=>{try{return await fn();}catch(e){if(e&&e.code==='unavailable'){await new Promise(r=>setTimeout(r,600+Math.random()*900));return fn();}throw e;}};
    const p=(this.qs[path]||Promise.resolve()).then(run).catch(e=>this.err(e));
    this.qs[path]=p;return p;
  },
  err(e){
    const c=e&&e.code;console.warn('save',e);
    toast(c==='quota_exceeded'?'Espaço cheio. Exclua itens antigos para continuar salvando.':c==='invalid_argument'?'Sem permissão para salvar nesta conta.':'Não foi possível salvar agora. Tente de novo.');
  },
  body(o){const b=clone(o);delete b.id;return b;},
  put(col,arr,item){
    const i=arr.findIndex(x=>x.id===item.id);if(i>=0)arr[i]=item;else arr.push(item);S._cats=null;

  },
  putTask(t){this.put('tasks',S.tasks,t);},
  delTask(id){this.del('tasks','tasks',id);},
  putEvent(e){this.put('events',S.events,e);},
  delEvent(id){this.del('events','events',id);},
  putHabit(h){this.put('habits',S.habits,h);},
  delHabit(id){this.del('habits','habits',id);},
  putFocus(d,doc){S.focus[d]=doc;if(S.mode==='db'&&this.db)this.q('focus/'+d,()=>this.db.doc('focus/'+d).set(clone(doc)));else this.saveLocal();},
  delFocus(d){delete S.focus[d];if(S.mode==='db'&&this.db)this.q('focus/'+d,()=>this.db.doc('focus/'+d).delete());else this.saveLocal();},
  putSettings(s){S.settings=s;S._cats=null;if(S.mode==='db'&&this.db)this.q('config/settings',()=>this.db.doc('config/settings').set(clone(s)));else this.saveLocal();}
};
const setSettings=patch=>Store.putSettings(Object.assign({},S.settings,patch));

/* ---------- tarefas ---------- */
const isDone=t=>t.status==='done';
const listOf=t=>catOf(t.ctx)?t.ctx:null;
const prioOf=t=>{if(t.prio!=null)return Math.max(0,Math.min(3,+t.prio||0));return t.pri==='A'?3:t.pri==='B'?2:t.pri==='C'?1:0;};
const subsOf=t=>Array.isArray(t.subs)?t.subs.filter(x=>x&&typeof x==='object'):[];
const tagsOf=t=>Array.isArray(t.tags)?t.tags.filter(x=>typeof x==='string'&&x):[];
const inMyDay=t=>!isDone(t)&&(!!t.pin||t.my===today());
const cmpRem=(a,b)=>(a.rem||'99').localeCompare(b.rem||'99');
const taskSort=(a,b)=>prioOf(b)-prioOf(a)||cmpRem(a,b)||(a.created||0)-(b.created||0);
const byDate=(a,b)=>(a.date||'9999').localeCompare(b.date||'9999')||taskSort(a,b);
const byDoneAt=(a,b)=>(b.doneAt||'').localeCompare(a.doneAt||'')||(b.doneTs||0)-(a.doneTs||0)||(b.created||0)-(a.created||0);
const mySort=(a,b)=>(!!b.pin-!!a.pin)||prioOf(b)-prioOf(a)||cmpRem(a,b)||(a.myAt||a.created||0)-(b.myAt||b.created||0);
function nextRep(d,rep){
  if(rep==='daily')return addDays(d,1);
  if(rep==='weekdays'){let x=addDays(d,1);while([0,6].includes(parseISO(x).getDay()))x=addDays(x,1);return x;}
  if(rep==='weekly')return addDays(d,7);
  if(rep==='monthly')return addMonths(d,1);
  if(rep==='yearly')return addMonths(d,12);
  return null;
}
function allTags(){const m={};S.tasks.forEach(t=>{if(isDone(t))return;tagsOf(t).forEach(g=>{m[g]=(m[g]||0)+1;});});return Object.keys(m).sort((a,b)=>a.localeCompare(b)).map(g=>[g,m[g]]);}
function listName(id){if(LISTS[id])return LISTS[id][0];if(id.startsWith('cat:'))return catName(id.slice(4));if(id.startsWith('tag:'))return '#'+id.slice(4);return 'Tarefas';}
function listFilter(id){
  if(id==='inbox')return t=>!listOf(t);
  if(id.startsWith('cat:')){const k=id.slice(4);return t=>t.ctx===k;}
  if(id.startsWith('tag:')){const g=id.slice(4);return t=>tagsOf(t).includes(g);}
  if(id==='next7'){const end=addDays(today(),6);return t=>!!t.date&&t.date<=end;}
  return ()=>true;
}
function validList(id){if(LISTS[id])return true;if(id.startsWith('cat:'))return !!catOf(id.slice(4));if(id.startsWith('tag:'))return allTags().some(g=>g[0]===id.slice(4));return false;}
const hasExamples=()=>S.tasks.some(t=>t.ex)||S.events.some(e=>e.ex)||S.habits.some(h=>h.ex);

/* ---------- eventos ---------- */
function evOccurs(e,d){
  if(!e||!e.date)return false;if(e.date===d)return true;if(d<e.date)return false;
  switch(e.rep){
    case 'daily':return true;
    case 'weekdays':{const w=parseISO(d).getDay();return w>0&&w<6;}
    case 'weekly':return dayDiff(e.date,d)%7===0;
    case 'monthly':return parseISO(e.date).getDate()===parseISO(d).getDate();
    case 'yearly':return e.date.slice(5)===d.slice(5);
    default:return false;
  }
}
function eventsOn(d){
  return S.events.filter(e=>evOccurs(e,d)).map(e=>{
    if(e.allDay)return {id:e.id,title:e.title,cat:e.cat,allDay:true,s:0,e:1440,ex:e.ex,rep:e.rep};
    const s=toMin(e.start)??480;let en=toMin(e.end);if(en==null||en<=s)en=en!=null&&en<s?1440:s+60;
    return {id:e.id,title:e.title,cat:e.cat,s,e:Math.max(en,s+15),ex:e.ex,rep:e.rep};
  }).sort((a,b)=>(b.allDay?1:0)-(a.allDay?1:0)||a.s-b.s||a.e-b.e);
}
const tasksOn=d=>S.tasks.filter(t=>t.date===d&&(!isDone(t)||t.doneAt===d)).sort((a,b)=>isDone(a)-isDone(b)||taskSort(a,b));

/* ---------- hábitos ---------- */
const hTarget=h=>h.type==='count'?Math.max(1,+h.target||1):1;
const hVal=(h,d)=>+((h.log||{})[d]||0);
const hDone=(h,d)=>hVal(h,d)>=hTarget(h);
const hPer=h=>Math.min(7,Math.max(1,+h.per||1));
const activeHabits=()=>S.habits.filter(h=>!h.archived).sort((a,b)=>(a.order||0)-(b.order||0)||(a.created||0)-(b.created||0));
function hSched(h,d){
  if(h.start&&d<h.start)return false;
  if(h.freq==='days')return (h.days||[]).indexOf(parseISO(d).getDay())>=0;
  return true;
}
function hWeekCount(h,ws){let n=0;for(let i=0;i<7;i++){const d=addDays(ws,i);if(hSched(h,d)&&hDone(h,d))n++;}return n;}
const hWeekMet=(h,ws)=>hWeekCount(h,ws)>=hPer(h);
function hStats(h){
  const td=today(),log=h.log||{};
  const total=Object.keys(log).filter(d=>d<=td&&hDone(h,d)).length;
  if(h.freq==='weekly'){
    const cw=weekStart(td);let cur=hWeekMet(h,cw)?1:0,w=addDays(cw,-7);
    for(let i=0;i<104;i++){if(h.start&&addDays(w,6)<h.start)break;if(!hWeekMet(h,w))break;cur++;w=addDays(w,-7);}
    let s=h.start?weekStart(h.start):addDays(cw,-7*52);if(dayDiff(s,cw)>7*104)s=addDays(cw,-7*104);
    let best=0,run=0;for(let x=s;x<=cw;x=addDays(x,7)){if(hWeekMet(h,x)){run++;if(run>best)best=run;}else if(x!==cw)run=0;}
    let met=0,tot=0;for(let k=1;k<=4;k++){const x=addDays(cw,-7*k);if(h.start&&addDays(x,6)<h.start)continue;tot++;if(hWeekMet(h,x))met++;}
    return {cur,best:Math.max(best,cur),rate:tot?met/tot:null,total,unit:['semana','semanas'],win:'últimas 4 semanas'};
  }
  let d=td;if(hSched(h,d)&&!hDone(h,d))d=addDays(d,-1);
  let cur=0;for(let i=0;i<730;i++){if(h.start&&d<h.start)break;if(hSched(h,d)){if(hDone(h,d))cur++;else break;}d=addDays(d,-1);}
  let s=h.start||addDays(td,-365);if(dayDiff(s,td)>730)s=addDays(td,-730);
  let best=0,run=0;for(let x=s;x<=td;x=addDays(x,1)){if(!hSched(h,x))continue;if(hDone(h,x)){run++;if(run>best)best=run;}else if(x!==td)run=0;}
  let sc=0,dn=0;for(let i=0;i<30;i++){const x=addDays(td,-i);if(h.start&&x<h.start)break;if(!hSched(h,x))continue;if(i===0&&!hDone(h,x))continue;sc++;if(hDone(h,x))dn++;}
  return {cur,best:Math.max(best,cur),rate:sc?dn/sc:null,total,unit:['dia','dias'],win:'últimos 30 dias'};
}
function hSchedText(h){
  if(h.freq==='days'){const ds=(h.days||[]).slice().sort((a,b)=>a-b);return ds.length===7?'Todo dia':ds.length?ds.map(i=>DOWS[i]).join(', '):'Sem dias';}
  if(h.freq==='weekly')return `${hPer(h)}x por semana`;
  return 'Todo dia';
}

/* ---------- foco ---------- */
const focusMinOn=d=>((S.focus[d]&&S.focus[d].items)||[]).reduce((a,x)=>a+(+x.min||0),0);
const METHODS={
  pomodoro:{n:'Pomodoro',d:()=>`${S.settings.pomo.focus} min de foco e ${S.settings.pomo.short} de pausa. A cada ${S.settings.pomo.every} ciclos, uma pausa longa de ${S.settings.pomo.long} min.`},
  m5217:{n:'52/17',d:()=>'52 minutos de concentração e 17 de descanso longe da tela.'},
  ultra:{n:'90/20',d:()=>'Um bloco longo de 90 minutos de concentração profunda e 20 de recuperação.'},
  flow:{n:'Livre',d:()=>'Sem relógio fixo: foque enquanto render e pare quando cansar. A pausa sugerida é um quinto do tempo focado.'},
  box:{n:'Tempo definido',d:()=>'Escolha quanto tempo dar para a tarefa e pare quando acabar.'}
};
let T={method:'pomodoro',phase:'focus',running:false,endAt:0,remain:null,cycle:1,task:'',flowStart:0,flowAcc:0,flowBreak:5,box:30,doneFx:0};
try{const v=localStorage.getItem('ritmo.timer');if(v)T=Object.assign(T,JSON.parse(v));}catch(e){}
if(!METHODS[T.method])T.method='pomodoro';
const saveT=()=>{try{localStorage.setItem('ritmo.timer',JSON.stringify(T));}catch(e){}};
const flowFocus=()=>T.method==='flow'&&T.phase==='focus';
const timerActive=()=>!!(T.running||T.remain!=null||T.flowAcc>0);
function phaseLen(){
  const p=S.settings.pomo,f=T.phase==='focus';
  switch(T.method){
    case 'pomodoro':return (f?+p.focus:T.phase==='long'?+p.long:+p.short)*60000;
    case 'm5217':return (f?52:17)*60000;
    case 'ultra':return (f?90:20)*60000;
    case 'box':return (f?+T.box:5)*60000;
    default:return f?0:(+T.flowBreak||5)*60000;
  }
}
function remaining(){
  if(flowFocus())return T.running?Date.now()-T.flowStart:(T.flowAcc||0);
  if(T.running)return Math.max(0,T.endAt-Date.now());
  return T.remain!=null?T.remain:phaseLen();
}
function fmtMs(ms){const s=flowFocus()?Math.floor(ms/1000):Math.ceil(ms/1000);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return h?`${h}:${pad(m)}:${pad(x)}`:`${pad(m)}:${pad(x)}`;}
let AC=null,WL=null;
function unlockAudio(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){}}
function chime(){
  try{if(AC){const t0=AC.currentTime;[[659.25,0],[880,.2],[1046.5,.4]].forEach(([f,dt])=>{const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t0+dt);g.gain.exponentialRampToValueAtTime(.22,t0+dt+.03);g.gain.exponentialRampToValueAtTime(.0001,t0+dt+1.1);o.connect(g);g.connect(AC.destination);o.start(t0+dt);o.stop(t0+dt+1.2);});}}catch(e){}
  try{if(AND&&AND.vibrate)AND.vibrate(450);else if(navigator.vibrate)navigator.vibrate([200,120,200]);}catch(e){}
}
function nativeAlarm(){if(!AND)return;try{if(T.running&&!flowFocus()){const f=T.phase==='focus';AND.scheduleAlarm(T.endAt,f?'Foco concluído':'Pausa encerrada',f?`${METHODS[T.method].n}: hora da pausa.`:'Pronto para o próximo foco?');}else AND.cancelAlarm();}catch(e){}}
async function wake(on){if(AND){try{AND.keepScreenOn(!!on);}catch(e){}return;}try{if(on&&!WL&&navigator.wakeLock){WL=await navigator.wakeLock.request('screen');WL.addEventListener&&WL.addEventListener('release',()=>{WL=null;});}else if(!on&&WL){await WL.release();WL=null;}}catch(e){WL=null;}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&T.running)wake(true);});
function focusChanged(){render();if(S.sheet&&S.sheet.type==='focus')openFocus(true);}
function tStart(){
  unlockAudio();
  if(flowFocus())T.flowStart=Date.now()-(T.flowAcc||0);else T.endAt=Date.now()+remaining();
  T.running=true;T.doneFx=0;saveT();wake(true);nativeAlarm();
  if(AND&&AND.requestNotifications){try{AND.requestNotifications();}catch(e){}}
  focusChanged();
}
function tPause(){
  if(flowFocus())T.flowAcc=Date.now()-T.flowStart;else T.remain=remaining();
  T.running=false;saveT();wake(false);nativeAlarm();focusChanged();
}
function tReset(){T.running=false;T.remain=null;T.flowAcc=0;T.phase='focus';T.cycle=1;T.doneFx=0;saveT();wake(false);nativeAlarm();focusChanged();}
function recordFocus(min,atMs){
  if(min<1)return;
  const at=new Date(atMs||Date.now()),d=isoOf(at);
  const cur=(S.focus[d]&&S.focus[d].items)||[];
  const item={m:T.method,min:Math.round(min),at:`${pad(at.getHours())}:${pad(at.getMinutes())}`};if(T.task)item.task=T.task;
  Store.putFocus(d,{date:d,items:cur.concat([item])});
  if(T.task){const t=S.tasks.find(x=>x.id===T.task);if(t)Store.putTask(Object.assign({},t,{pomos:(t.pomos||0)+1}));}
}
function nextPhase(){
  if(T.phase==='focus'){const ev=T.method==='pomodoro'?Math.max(1,+S.settings.pomo.every):1;T.phase=T.method==='pomodoro'&&T.cycle%ev===0?'long':'short';}
  else{T.phase='focus';T.cycle++;}
  T.running=false;T.remain=null;T.flowAcc=0;saveT();
}
function tComplete(){
  const wasFocus=T.phase==='focus',endAt=T.endAt;
  if(wasFocus)recordFocus(phaseLen()/60000,endAt);
  chime();wake(false);nextPhase();if(wasFocus)T.doneFx=Date.now();saveT();
  toast(wasFocus?(T.method==='box'?'Feito! Tempo encerrado.':'Feito! Hora da pausa.'):'Pausa encerrada. Pronto para o próximo foco?');
  focusChanged();
}
function tSkip(){
  if(flowFocus())return tFlowStop();
  const wasFocus=T.phase==='focus';
  if(wasFocus){const done=(phaseLen()-remaining())/60000;if(done>=1)recordFocus(done);}
  wake(false);nextPhase();nativeAlarm();focusChanged();
}
function tFlowStop(){
  const ms=T.running?Date.now()-T.flowStart:(T.flowAcc||0);
  if(ms>=60000)recordFocus(ms/60000);
  T.flowBreak=Math.max(5,Math.round(ms/60000/5));
  T.phase='short';T.running=false;T.remain=null;T.flowAcc=0;T.doneFx=ms>=60000?Date.now():0;saveT();wake(false);nativeAlarm();
  toast(ms>=60000?`Feito! ${dur(ms/60000)} de foco. Pausa sugerida: ${T.flowBreak} min.`:'Sessão curta demais para registrar.');
  focusChanged();
}

/* ---------- avisos no celular (eventos, lembretes de tarefas e hábitos) ---------- */
const ALERT_OPTS=[['alarm','Alarme'],['notif','Notificação'],['off','Sem aviso']];
const LEAD_OPTS=[[0,'Na hora'],[5,'5 min'],[10,'10 min'],[15,'15 min'],[30,'30 min'],[60,'1 h']];
const alertOf=e=>{const a=e.alert||((S.settings.alerts||{}).mode)||'alarm';return ALERT_OPTS.some(o=>o[0]===a)?a:'alarm';};
const leadOf=e=>{const v=e.lead!=null&&e.lead!==''?+e.lead:+((S.settings.alerts||{}).lead||0);return isNaN(v)?0:Math.max(0,Math.min(240,v));};
const remModeOf=t=>{const m=t.remMode||((S.settings.rem||{}).mode)||'notif';return m==='alarm'?'alarm':'notif';};
const canAlarm=()=>!!(AND&&AND.setEventAlarms);
const msAt=(d,min)=>{const x=parseISO(d);return new Date(x.getFullYear(),x.getMonth(),x.getDate(),Math.floor(min/60),min%60).getTime();};
function alarmList(){
  const now=Date.now(),td=today(),out=[];
  for(let i=0;i<15;i++){
    const d=addDays(td,i);
    eventsOn(d).forEach(it=>{
      if(it.allDay)return;
      const e=S.events.find(x=>x.id===it.id);if(!e||e.ex)return;
      const mode=alertOf(e);if(mode==='off')return;
      const lead=leadOf(e),startMs=msAt(d,it.s),at=startMs-lead*60000;
      if(at<now-60000)return;
      out.push({k:`${e.id}@${startMs}`,at,t:e.title||'Evento',s:`${hhmm(it.s)} às ${hhmm(it.e)}, ${catName(e.cat,'sem lista')}`,start:hhmm(it.s),lead,m:mode});
    });
  }
  S.tasks.forEach(t=>{
    if(isDone(t)||t.ex||!t.rem)return;const m=toMin(t.rem);if(m==null)return;
    const d=t.date||td,at=msAt(d,m);if(at<now-60000||at>now+15*864e5)return;
    out.push({k:`t:${t.id}@${at}`,at,t:t.title||'Tarefa',s:catName(t.ctx),start:t.rem,lead:0,m:remModeOf(t),h:'Lembrete de tarefa'});
  });
  activeHabits().forEach(h=>{
    if(h.ex||!h.time)return;const m=toMin(h.time);if(m==null)return;
    for(let i=0;i<7;i++){const d=addDays(td,i);if(!hSched(h,d)||hDone(h,d))continue;const at=msAt(d,m);if(at<now-60000)continue;
      out.push({k:`h:${h.id}@${at}`,at,t:h.name||'Hábito',s:hSchedText(h),start:h.time,lead:0,m:'notif',h:'Hora do hábito'});}
  });
  return out.sort((a,b)=>a.at-b.at).slice(0,200);
}
let alarmKey='',alarmT=null,askedNotif=false;
function pushAlarms(){
  if(!canAlarm()||!S.ready)return;
  clearTimeout(alarmT);
  alarmT=setTimeout(()=>{
    const list=alarmList(),json=JSON.stringify(list);
    if(json===alarmKey)return;alarmKey=json;
    try{AND.setEventAlarms(json);}catch(e){}
    if(list.length&&!askedNotif&&AND.requestNotifications){askedNotif=true;try{AND.requestNotifications();}catch(e){}}
  },400);
}
function alarmStatus(){if(!AND||!AND.alarmStatus)return null;try{return JSON.parse(AND.alarmStatus());}catch(e){return null;}}

/* ---------- tema e barras do celular ---------- */

try{new MutationObserver(()=>{const v=document.documentElement.getAttribute('data-theme');if(v!==OUR_THEME)HOST_THEME=v;}).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});}catch(e){}
function applyTheme(){

const isLight=()=>{const dt=document.documentElement.getAttribute('data-theme');if(dt)return dt==='light';try{return !window.matchMedia('(prefers-color-scheme: dark)').matches;}catch(e){return true;}};

/* ---------- aviso rápido ---------- */
let undoFn=null,toastT=null;
function toast(msg,undo){

/* ---------- folhas (sobem de baixo, com barra própria) ---------- */
const sheetOpen=()=>!$('#sheetWrap').hidden;
function openSheet(html,o){
  o=o||{};closeMenu();
  const s=$('#sheet'),keep=o.keep&&sheetOpen(),top=keep?s.scrollTop:0;
  s.className='sheet'+(o.half?' half':'');

function timeSecs(f){
  const td=today(),tm=addDays(td,1),act=S.tasks.filter(t=>!isDone(t)&&f(t));
  const late=act.filter(t=>t.date&&t.date<td).sort(byDate);
  return [
    {k:'today',n:'Hoje',add:'today',items:late.concat(act.filter(t=>t.date===td).sort(taskSort))},
    {k:'tom',n:'Amanhã',add:'tomorrow',items:act.filter(t=>t.date===tm).sort(taskSort)},
    {k:'up',n:'Em breve',add:'nextweek',items:act.filter(t=>t.date&&t.date>tm).sort(byDate)},
    {k:'some',n:'Outro dia',add:'someday',items:act.filter(t=>!t.date).sort(taskSort)}

}
function vTarefas(){

function completeTask(id){

  if(t.rep){
    let nd=nextRep(t.date||td,t.rep);let guard=0;while(nd&&nd<=td&&guard++<800)nd=nextRep(nd,t.rep);
    if(nd){next=Object.assign(clone(t),{id:uid('t'),status:'todo',doneAt:null,doneTs:null,date:nd,created:Date.now(),my:null,myAt:null,pin:false,subs:subsOf(t).map(s=>Object.assign({},s,{done:false}))});delete next.ex;Store.putTask(next);}
  }

}

/* ---------- Meu dia ---------- */
function dismissed(){try{const o=JSON.parse(localStorage.getItem('ritmo.dismiss')||'{}');return o.d===today()&&Array.isArray(o.ids)?o.ids:[];}catch(e){return [];}}
function dismiss(id){const ids=dismissed();if(ids.indexOf(id)<0)ids.push(id);try{localStorage.setItem('ritmo.dismiss',JSON.stringify({d:today(),ids}));}catch(e){}}
function suggestions(){
  if(S.settings.myday&&S.settings.myday.sugg===false)return [];
  const td=today(),tm=addDays(td,1),soon=addDays(td,3),dis=new Set(dismissed()),out=[];
  S.tasks.forEach(t=>{
    if(isDone(t)||inMyDay(t)||dis.has(t.id))return;
    const p=prioOf(t);let sc=0,why='',cls='';
    if(t.date&&t.date<td){sc=100+Math.min(30,dayDiff(t.date,td));why=`Atrasada desde ${relDay(t.date).toLowerCase()}`;cls='late';}

function layout(items){

  let cl=null,end=-1;const cls=[];
  items.forEach(it=>{if(!cl||it.s>=end){cl=[];cls.push(cl);end=it.e;}else end=Math.max(end,it.e);cl.push(it);});

/* ---------- linguagem natural ---------- */
const WDN=[['domingo','dom'],['segunda','seg'],['terca','ter'],['quarta','qua'],['quinta','qui'],['sexta','sex'],['sabado','sab']];
function wdIdx(w){w=nrm(w).replace(/-feiras?$/,'');if(w.length>3)w=w.replace(/s$/,'');return WDN.findIndex(a=>a.indexOf(w)>=0);}
function parseQuick(raw,habit){
  const r={title:'',date:null,start:null,end:null,dur:null,cat:null,prio:null,target:null,unit:'',per:null,days:[],freq:null};
  const td=today();let s=' '+String(raw||'').replace(/\s+/g,' ')+' ';
  const cut=(re,fn)=>{s=s.replace(re,function(){const v=fn.apply(null,arguments);return v===false?arguments[0]:' ';});};
  cut(/\s#([^\s#!]+)(?=\s)/g,(m,tag)=>{const t=nrm(tag).replace(/[-_]/g,'');const c=cats().find(x=>nrm(x.n).replace(/\s+/g,'')===t);if(!c)return false;r.cat=c.k;});
  cut(/\s!(alta|a|3|m[eé]dia|m|b|2|baixa|c|1)(?=\s)/gi,(m,p)=>{p=nrm(p);r.prio=['alta','a','3'].includes(p)?3:['media','m','b','2'].includes(p)?2:1;});
  if(habit){
    cut(/\s(\d)\s*(?:x|vezes)\s+(?:por|na|a)\s+semana(?=\s)/gi,(m,n)=>{if(+n<1||+n>7)return false;r.per=+n;r.freq='weekly';});
    cut(/\s(?:todos\s+os\s+dias|todo\s+dia|diariamente)(?=\s)/gi,()=>{r.freq='daily';});
    cut(/\s(domingos?|segundas?(?:-feiras?)?|ter[cç]as?(?:-feiras?)?|quartas?(?:-feiras?)?|quintas?(?:-feiras?)?|sextas?(?:-feiras?)?|s[aá]bados?|dom|seg|ter|qua|qui|sex|s[aá]b)(?=[\s,])/gi,(m,w)=>{const i=wdIdx(w);if(i<0)return false;if(r.days.indexOf(i)<0)r.days.push(i);});
    cut(/\s(\d{1,3})\s+([a-zà-ú]{2,20})(?=\s)/gi,(m,n,u)=>{if(r.target)return false;r.target=+n;r.unit=u.toLowerCase();});
    if(r.days.length&&!r.freq)r.freq='days';
  }else{
    cut(/\s(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?(?=\s)/g,(m,dd,mm,yy)=>{let y=yy?+yy:parseISO(td).getFullYear();if(y<100)y+=2000;const dt=new Date(y,+mm-1,+dd);if(dt.getMonth()!==+mm-1||dt.getDate()!==+dd)return false;if(!yy&&isoOf(dt)<td)dt.setFullYear(y+1);r.date=isoOf(dt);});
    cut(/\s(?:no\s+)?dia\s+(\d{1,2})(?=\s)/gi,(m,dd)=>{const t=parseISO(td);let dt=new Date(t.getFullYear(),t.getMonth(),+dd);if(dt.getDate()!==+dd)return false;if(isoOf(dt)<td)dt=new Date(t.getFullYear(),t.getMonth()+1,+dd);r.date=isoOf(dt);});
    cut(/\sdepois\s+de\s+amanh[ãa](?=\s)/gi,()=>{r.date=addDays(td,2);});
    cut(/\samanh[ãa](?=\s)/gi,()=>{if(!r.date)r.date=addDays(td,1);});
    cut(/\shoje(?=\s)/gi,()=>{r.date=td;});
    cut(/\s(?:semana\s+que\s+vem|pr[oó]xima\s+semana)(?=\s)/gi,()=>{r.date=addDays(weekStart(td),8);});
    cut(/\s(?:(?:na|no|nesta|neste|pr[oó]xima|pr[oó]ximo)\s+)?(domingo|segunda(?:-feira)?|ter[cç]a(?:-feira)?|quarta(?:-feira)?|quinta(?:-feira)?|sexta(?:-feira)?|s[aá]bado|dom|seg|ter|qua|qui|sex|s[aá]b)(?=\s)/gi,(m,w)=>{const i=wdIdx(w);if(i<0)return false;let k=(i-parseISO(td).getDay()+7)%7;if(k===0)k=7;r.date=addDays(td,k);});
    cut(/\s(?:por|durante)\s+(?:(\d{1,2})\s*h(?:oras?)?(?:\s*e?\s*(\d{1,2})\s*(?:min(?:utos)?)?)?|(\d{1,3})\s*min(?:utos)?)(?=\s)/gi,(m,h,mi,only)=>{const v=only?+only:(+h*60+(+mi||0));if(!v||v>720)return false;r.dur=v;});
    s=s.replace(/([\dh])\s*[-–]\s*(\d)/gi,'$1 - $2');
    const times=[];
    cut(/\s(?:(?:[àa]s|das|de|at[ée]|a\s+partir\s+das)\s+)?(\d{1,2})(?::(\d{2})|h(\d{2})?)(?=[\s,.])/gi,(m,h,m1,m2)=>{const hh=+h,mm=+(m1||m2||0);if(hh>23||mm>59)return false;times.push(hh*60+mm);});
    cut(/\s(?:às|das)\s+(\d{1,2})(?=\s)/gi,(m,h)=>{if(+h>23)return false;times.push(+h*60);});
    cut(/\s[-–](?=\s)/g,()=>{});
    if(times.length){r.start=times[0];if(times[1]!=null&&times[1]>times[0])r.end=times[1];}
  }

  for(let i=0;i<3;i++)t=t.replace(/^(?:e|de|da|do|no|na|em|para|às)\s+/i,'').replace(/\s+(?:e|de|da|do|no|na|em|para|às|dia|a|o)$/i,'').trim();
  r.title=t?t[0].toUpperCase()+t.slice(1):'';

}

function focusStats(){

  const vals=days.map(focusMinOn),sel=Math.min(6,Math.max(0,S.chartSel));
  const top=Math.max(60,Math.ceil(Math.max(...vals)/30)*30),tot=vals.reduce((a,b)=>a+b,0);
  const W=320,H=150,L=30,R=6,Tp=10,B=24,pw=W-L-R,ph=H-Tp-B,bw=pw/7;
  let g='';[0,.5,1].forEach(f=>{const y=Tp+ph-f*ph;g+=`<line x1="${L}" x2="${W-R}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" style="stroke:var(--line)" stroke-width="1"/><text x="${L-6}" y="${(y+3.5).toFixed(1)}" text-anchor="end" font-size="10" style="fill:var(--hour);font-family:var(--f)">${Math.round(top*f)}</text>`;});
  vals.forEach((v,i)=>{const x=L+i*bw,bh=v/top*ph,y=Tp+ph-bh,on=i===sel;g+=`<g data-act="bar" data-i="${i}" style="cursor:pointer"><rect x="${x.toFixed(1)}" y="${Tp}" width="${bw.toFixed(1)}" height="${ph+B}" style="fill:transparent"/>${v?`<rect x="${(x+bw*.25).toFixed(1)}" y="${y.toFixed(1)}" width="${(bw*.5).toFixed(1)}" height="${Math.max(2,bh).toFixed(1)}" rx="3" style="fill:var(--accent)" fill-opacity="${on?1:.4}"/>`:''}<text x="${(x+bw/2).toFixed(1)}" y="${H-7}" text-anchor="middle" font-size="10.5" style="fill:var(${on?'--ink':'--muted'});font-family:var(--f)" font-weight="${on?700:400}">${DOWS[parseISO(days[i]).getDay()]}</text></g>`;});
  const sd=days[sel],items=(S.focus[sd]&&S.focus[sd].items)||[];
  let h=`<div class="glab lab">Tempo de foco: ${dur(tot)} em 7 dias</div><div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Minutos de foco por dia nos últimos 7 dias">${g}</svg></div>`;
  h+=`<div class="readout"><span><b>${relDay(sd)}</b>: ${dur(vals[sel])} de foco</span><span>${items.length} ${items.length===1?'sessão':'sessões'}</span></div>`;
  if(items.length)h+=items.slice().reverse().map(x=>{const t=x.task&&S.tasks.find(k=>k.id===x.task);return `<div class="log"><span class="tm">${esc(x.at)}</span><span>${esc((METHODS[x.m]||{n:x.m}).n)}${t?`, <span class="muted">${esc(t.title)}</span>`:''}</span><span>${x.min} min</span></div>`;}).join('');
  else h+='<p class="hint" style="padding-top:4px">Conclua uma sessão de foco para ela aparecer aqui.</p>';
  return h;
}

async function exportData(){
  const data={app:'Feito',version:3,exportedAt:new Date().toISOString(),settings:S.settings,tasks:S.tasks,events:S.events,habits:S.habits,focus:S.focus};
  const json=JSON.stringify(data,null,1),name=`feito-backup-${today()}.json`;
  if(AND&&AND.saveFile){try{AND.saveFile(name,json);}catch(e){toast('Não foi possível exportar.');}return;}
  let dl=null;try{if(window.claude&&typeof window.claude.use==='function')dl=await window.claude.use('downloads');}catch(e){}
  if(dl){try{await dl.save({filename:name,data:json});toast('Backup salvo');return;}catch(e){if(e&&(e.code==='declined'||e.code==='rate_limited'))return;}}
  try{await navigator.clipboard.writeText(json);toast('Backup copiado. Cole num arquivo .json para guardar.');}catch(e){toast('Não foi possível exportar nesta tela.');}
}
const okId=id=>typeof id==='string'&&/^[A-Za-z0-9_\-.~:@+]{1,200}$/.test(id)&&id!=='.'&&id!=='..';
function readImport(file){
  const box=$('#impBox');if(!file||!box)return;
  const r=new FileReader();
  r.onload=()=>{
    let o=null;try{o=JSON.parse(String(r.result));}catch(e){}
    if(!o||typeof o!=='object'||!(Array.isArray(o.tasks)||Array.isArray(o.events)||Array.isArray(o.habits))){box.innerHTML='<p class="hint" style="color:var(--danger);text-align:left;padding:8px 16px">Este arquivo não é um backup do Feito.</p>';return;}
    const pick=a=>(Array.isArray(a)?a:[]).filter(x=>x&&typeof x==='object'&&okId(x.id));
    S.imp={tasks:pick(o.tasks),events:pick(o.events),habits:pick(o.habits),focus:o.focus&&typeof o.focus==='object'?o.focus:{},settings:o.settings&&typeof o.settings==='object'?o.settings:null};
    const fd=Object.keys(S.imp.focus).length;
    box.innerHTML=`<div class="note" style="flex-direction:column;align-items:stretch;margin-top:8px"><span>O backup tem <b>${S.imp.tasks.length}</b> tarefas, <b>${S.imp.events.length}</b> eventos, <b>${S.imp.habits.length}</b> hábitos e <b>${fd}</b> dias de foco${S.imp.settings?', além dos ajustes':''}. Itens iguais são atualizados; nada é apagado.</span><div class="btns" style="padding:8px 0 0"><button type="button" class="btn" data-act="imp-go">Importar</button><button type="button" class="btn ghost" data-act="imp-cancel">Cancelar</button></div></div>`;
  };
  r.onerror=()=>{box.innerHTML='<p class="hint" style="color:var(--danger);text-align:left;padding:8px 16px">Não foi possível ler o arquivo.</p>';};
  r.readAsText(file);
}
async function applyImport(){
  const o=S.imp;if(!o)return;const box=$('#impBox');if(box)box.innerHTML='<p class="hint">Importando…</p>';
  const items=[];o.tasks.forEach(t=>items.push(['tasks',t]));o.events.forEach(e=>items.push(['events',e]));o.habits.forEach(h=>items.push(['habits',h]));
  items.forEach(([c,it])=>{const arr=S[c],i=arr.findIndex(x=>x.id===it.id),v=clone(it);if(i>=0)arr[i]=v;else arr.push(v);});
  const fdays={};
  Object.keys(o.focus).forEach(d=>{if(!/^\d{4}-\d{2}-\d{2}$/.test(d))return;const inc=(o.focus[d]&&Array.isArray(o.focus[d].items))?o.focus[d].items:[],cur=(S.focus[d]&&S.focus[d].items)||[];const seen=new Set(cur.map(x=>`${x.at}|${x.m}|${x.min}`));fdays[d]={date:d,items:cur.concat(inc.filter(x=>x&&!seen.has(`${x.at}|${x.m}|${x.min}`)))};S.focus[d]=fdays[d];});
  if(o.settings)S.settings=merge(S.settings,o.settings);
  S._cats=null;let failed=false;
  if(S.mode==='db'&&Store.db){
    try{
      let n=0;const pause=()=>new Promise(r=>setTimeout(r,250));
      for(const [c,it] of items){await Store.db.doc(c+'/'+it.id).set(Store.body(it));if(++n%20===0)await pause();}
      for(const d of Object.keys(fdays)){await Store.db.doc('focus/'+d).set(clone(fdays[d]));if(++n%20===0)await pause();}
      if(o.settings)await Store.db.doc('config/settings').set(clone(S.settings));
    }catch(e){failed=true;Store.err(e);}
  }else Store.saveLocal();
  S.imp=null;closeSheet();
  if(!failed)toast(`Importado: ${o.tasks.length} tarefas, ${o.events.length} eventos e ${o.habits.length} hábitos.`);
}
async function wipeAll(){
  const tk=S.tasks.map(t=>t.id),ev=S.events.map(e=>e.id),hb=S.habits.map(h=>h.id),fd=Object.keys(S.focus);
  if(S.mode==='db'&&Store.db){
    S.tasks=[];S.events=[];S.habits=[];S.focus={};S._cats=null;render();
    try{let n=0;const pause=()=>new Promise(r=>setTimeout(r,250));
      for(const id of tk){await Store.db.doc('tasks/'+id).delete();if(++n%20===0)await pause();}
      for(const id of ev){await Store.db.doc('events/'+id).delete();if(++n%20===0)await pause();}
      for(const id of hb){await Store.db.doc('habits/'+id).delete();if(++n%20===0)await pause();}
      for(const d of fd){await Store.db.doc('focus/'+d).delete();if(++n%20===0)await pause();}
    }catch(e){Store.err(e);}
  }else{S.tasks=[];S.events=[];S.habits=[];S.focus={};S._cats=null;Store.saveLocal();}
  T.task='';saveT();closeSheet();toast('Todos os dados foram apagados.');
}

/* ---------- formulários ---------- */
const FORMS={
  ask(){askSubmit();},
  ev(f){
    const el=n=>f.elements.namedItem(n),tg=tgOf(f),title=el('title').value.replace(/\s+/g,' ').trim();
    if(!title){el('title').focus();toast('Dê um título ao evento.');return;}
    const id=f.dataset.id,old=id?S.events.find(x=>x.id===id):null,allDay=tg('allday');
    const start=el('start').value||'09:00',end=el('end').value||'10:00';
    if(!allDay&&toMin(end)<=toMin(start)&&toMin(end)!==0){toast('O fim precisa ser depois do início.');el('end').focus();return;}
    const ev=Object.assign({},old||{id:uid('e'),created:Date.now()},{title,date:el('date').value||S.sel,start,end,allDay,cat:el('cat').value||firstCat(),rep:el('rep').value||'',alert:el('alert').value||'alarm',lead:+el('lead').value||0,notes:el('notes').value.trim()||null});
    delete ev.ex;if(f.dataset.task)ev.task=f.dataset.task;
    Store.putEvent(ev);S.sel=ev.date;S.calMonth=ev.date.slice(0,7);closeSheet();toast(old?'Evento salvo':'Evento criado');
  },
  habit(f){
    const el=n=>f.elements.namedItem(n),seg=segOf(f),name=el('name').value.replace(/\s+/g,' ').trim();
    if(!name){el('name').focus();toast('Dê um nome ao hábito.');return;}
    const type=seg('type')||'check',freq=seg('freq')||'daily';
    const days=[...f.querySelectorAll('[data-seg="days"] [aria-pressed="true"]')].map(b=>+b.dataset.v);
    if(freq==='days'&&!days.length){toast('Escolha pelo menos um dia da semana.');return;}
    const num=(n,d,a,b)=>{const v=parseInt(el(n).value,10);return isNaN(v)?d:Math.min(b,Math.max(a,v));};
    const id=f.dataset.id,old=id?S.habits.find(x=>x.id===id):null;
    const h=Object.assign({},old||{id:uid('h'),created:Date.now(),log:{},order:S.habits.length+1});
    Object.assign(h,{name,type,target:type==='count'?num('target',1,1,999):1,unit:type==='count'?el('unit').value.trim():'',freq,days,per:num('per',3,1,7),time:el('time').value||'',cat:seg('cat')||firstCat(),start:el('start').value||today()});
    delete h.ex;delete h.shift;
    Store.putHabit(h);
    if(old){render();openHabit(h.id);}else{closeSheet(true);go('habitos');}
    toast(old?'Hábito salvo':'Hábito criado');
  },
  cat(f){
    const name=f.elements.namedItem('name').value.trim();if(!name){f.elements.namedItem('name').focus();return;}
    const color=segOf(f)('color')||freeColor(),k=f.dataset.k,sh=S.sheet||{};
    if(k){Store.putSettings(Object.assign({},S.settings,{cats:cats().map(c=>c.k===k?Object.assign({},c,{n:name,c:color}):Object.assign({},c))}));toast('Lista salva');render();openCats();return;}
    const nk=newCat(name,color);toast(`Lista “${name}” criada`);
    if(sh.ret==='task'&&sh.task){const t=S.tasks.find(x=>x.id===sh.task);if(t)Store.putTask(Object.assign({},t,{ctx:nk}));render();openTask(sh.task);return;}
    if(sh.ret==='home'){closeSheet(true);go('tarefas','cat:'+nk);return;}
    render();openCats();
  },
  'set-perfil'(f){setSettings({name:f.elements.namedItem('pName').value.trim().slice(0,40)});render();openSettings();toast('Nome salvo');},
  'set-pomo'(f){const v=(n,d,a,b)=>{const x=parseInt(f.elements.namedItem(n).value,10);return isNaN(x)?d:Math.min(b,Math.max(a,x));};setSettings({pomo:{focus:v('pF',25,1,180),short:v('pS',5,1,60),long:v('pL',15,1,90),every:v('pE',4,1,12)}});render();openSettings();toast('Tempos salvos');},
  'set-alarmes'(f){const sg=segOf(f);setSettings({alerts:{mode:sg('alMode')||'alarm',lead:+sg('alLead')||0},rem:{mode:sg('remMode')||'notif'}});render();openSettings();toast('Avisos salvos');},
  welcome(f){const n=f.elements.namedItem('wName').value.trim().slice(0,40);setSettings({name:n,onboarded:true});closeSheet();toast(n?`Que bom ter você aqui, ${n}!`:'Tudo pronto. Bom proveito!');}
};

function tdMenu(el,kind){
