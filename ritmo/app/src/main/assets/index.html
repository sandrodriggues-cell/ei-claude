<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Ritmo Pessoal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: app de coluna única para celular — cabeçalho fixo, mostrador de 24 h com o turno, abas no rodapé, folhas deslizantes para edição */
:root{
  --bg:#0d1320; --surface:#141c2b; --surface-2:#1b2537; --line:#283346; --fg:#ebe6da; --muted:#919aab; --faint:#5f697d;
  --accent:#c9a84c; --accent-soft:rgba(201,168,76,.15); --accent-ink:#17120a;
  --ok:#5aab87; --ok-soft:rgba(90,171,135,.16); --warn:#d9a441; --crit:#d76a5f; --crit-soft:rgba(215,106,95,.15); --info:#6f9fd8;
  --p-ouro:#c9a84c; --p-azul:#6f9fd8; --p-violeta:#a98bd8; --p-verde:#5aab87; --p-terracota:#d08a5e; --p-ardosia:#8190aa;
  --p-turquesa:#4fb3b8; --p-rosa:#d77fa1; --p-ambar:#e0a53c; --p-indigo:#8a93e6; --p-oliva:#a3b25a; --p-vinho:#c76b6b;
  --scrim:rgba(4,7,12,.6); --shadow:0 12px 32px rgba(0,0,0,.38);
  --f-display:"Cormorant Garamond","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#f2f3f6; --surface:#ffffff; --surface-2:#eceff4; --line:#dbe0e8; --fg:#131a28; --muted:#586174; --faint:#8b93a3;
  --accent:#96731f; --accent-soft:rgba(150,115,31,.12); --accent-ink:#ffffff;
  --ok:#2c8660; --ok-soft:rgba(44,134,96,.12); --warn:#a8720c; --crit:#bb473c; --crit-soft:rgba(187,71,60,.1); --info:#3a6db3;
  --p-ouro:#96731f; --p-azul:#3a6db3; --p-violeta:#7655b5; --p-verde:#2c8660; --p-terracota:#b2683a; --p-ardosia:#64718a;
  --p-turquesa:#1f8187; --p-rosa:#b44f78; --p-ambar:#a8720c; --p-indigo:#4e58b8; --p-oliva:#6f7d24; --p-vinho:#a33f3f;
  --scrim:rgba(19,26,40,.4); --shadow:0 12px 32px rgba(19,26,40,.14);
  color-scheme:light;
}}
:root[data-theme="light"]{
  --bg:#f2f3f6; --surface:#ffffff; --surface-2:#eceff4; --line:#dbe0e8; --fg:#131a28; --muted:#586174; --faint:#8b93a3;
  --accent:#96731f; --accent-soft:rgba(150,115,31,.12); --accent-ink:#ffffff;
  --ok:#2c8660; --ok-soft:rgba(44,134,96,.12); --warn:#a8720c; --crit:#bb473c; --crit-soft:rgba(187,71,60,.1); --info:#3a6db3;
  --p-ouro:#96731f; --p-azul:#3a6db3; --p-violeta:#7655b5; --p-verde:#2c8660; --p-terracota:#b2683a; --p-ardosia:#64718a;
  --p-turquesa:#1f8187; --p-rosa:#b44f78; --p-ambar:#a8720c; --p-indigo:#4e58b8; --p-oliva:#6f7d24; --p-vinho:#a33f3f;
  --scrim:rgba(19,26,40,.4); --shadow:0 12px 32px rgba(19,26,40,.14);
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;padding-bottom:calc(72px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}

/* Cabeçalho */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:8px}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.mark{font-family:var(--f-display);font-weight:700;font-size:26px;letter-spacing:.01em;line-height:1}
.mark i{font-style:normal;color:var(--accent)}
.hdr-date{font-size:11px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-act{display:flex;align-items:center;gap:2px;flex:none}
.icon-btn{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;color:var(--muted)}
.icon-btn:hover{background:var(--surface-2);color:var(--fg)}
.icon-btn svg{width:21px;height:21px}
.sync{width:7px;height:7px;border-radius:50%;background:var(--faint);margin-right:8px}
.sync.on{background:var(--ok)} .sync.local{background:var(--warn)}

main{padding-block:16px 104px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;min-width:0}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.title{font-family:var(--f-display);font-weight:600;font-size:23px;line-height:1.1}
.link{color:var(--accent);font-weight:600;font-size:13px;white-space:nowrap}
.hint{font-size:13px;color:var(--muted);max-width:62ch}
.banner{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px 12px;padding:10px 14px;border-radius:12px;background:var(--accent-soft);font-size:13px}
.empty{padding:18px 16px;border:1px dashed var(--line);border-radius:14px;color:var(--muted);font-size:14px;text-align:center}

/* Hoje */
.hero{padding:20px 18px 18px}
.hero-grid{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center}
.display{font-family:var(--f-display);font-weight:600;font-size:clamp(34px,9.5vw,48px);line-height:1;letter-spacing:-.01em;margin-top:4px}
.clock{font-size:14px;color:var(--muted);margin-top:8px;letter-spacing:.04em}
.dial{width:132px;height:132px;flex:none}
@media (max-width:370px){.dial{width:108px;height:108px}}
.shift-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin-top:16px;font-size:14px}
.shift-row b{font-weight:600}
.pill{display:inline-flex;align-items:center;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:4px 10px;border-radius:999px;white-space:nowrap}
.pill.turno{color:var(--accent);background:var(--accent-soft)}
.pill.folga{color:var(--ok);background:var(--ok-soft)}
.pill.livre{color:var(--muted);background:var(--surface-2)}
.bar{height:4px;border-radius:4px;background:var(--surface-2);overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.next-off{margin-top:12px;font-size:13px;color:var(--muted)}
.next-off b{color:var(--fg);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 12px 10px;min-width:0}
.stat .v{font-family:var(--f-mono);font-size:21px;font-variant-numeric:tabular-nums;line-height:1.2}
.stat .v small{font-size:13px;color:var(--muted)}
.stat .l{font-size:10.5px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-top:3px;font-weight:600}
.frog-t{font-family:var(--f-display);font-size:24px;font-weight:600;line-height:1.15;overflow-wrap:anywhere}
.meter{display:flex;gap:4px}
.meter i{width:16px;height:8px;border-radius:3px;background:var(--surface-2);border:1px solid var(--line)}
.meter i.on{background:var(--accent-soft);border-color:var(--accent)}
.meter i.done{background:var(--accent);border-color:var(--accent)}
.p135{display:flex;flex-direction:column;gap:10px}
.p135-row{display:grid;grid-template-columns:92px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13px}
.p135-row .c{font-family:var(--f-mono);color:var(--muted);font-size:12px}

/* Linhas de tarefa */
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:flex-start;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.list > .row:first-child{border-top:0}
.chk{flex:none;width:22px;height:22px;border-radius:50%;border:1.6px solid var(--faint);display:grid;place-items:center;margin-top:1px}
.chk:hover{border-color:var(--ok)}
.chk.on{background:var(--ok);border-color:var(--ok)}
.chk.on::after{content:"";width:5px;height:10px;border:solid var(--surface);border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}
.row-main{flex:1;min-width:0;text-align:left}
.row-t{font-size:15px;line-height:1.35;overflow-wrap:anywhere}
.row.done .row-t{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--faint)}
.meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.tag{font-size:11px;line-height:1.5;padding:1px 7px;border-radius:6px;background:var(--surface-2);color:var(--muted);font-weight:500;white-space:nowrap}
.tag.pri-A{color:var(--crit);background:var(--crit-soft);font-weight:600}
.tag.pri-B{color:var(--warn);font-weight:600}
.tag.pri-C{color:var(--info);font-weight:600}
.tag.frog{color:var(--ok);background:var(--ok-soft);font-weight:600}
.tag.gold{color:var(--accent);background:var(--accent-soft);font-weight:600}
.tag.late{color:var(--crit);background:var(--crit-soft)}
.tag.ex{background:transparent;border:1px dashed var(--faint);padding:0 6px}
.group-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:18px 0 2px}
.group-h:first-child{margin-top:0}
.group-h h3{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.group-h .n{font-family:var(--f-mono);font-size:12px;color:var(--faint)}

/* Chips e segmentos */
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;border:1px solid var(--line);font-size:13px;font-weight:500;color:var(--muted);background:var(--surface);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.cap{display:flex;gap:8px}
.cap .inp{flex:1;min-width:0}
.cap .btn{flex:none;min-width:0}

/* Eisenhower */
.eis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.quad{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;min-height:150px;min-width:0;display:flex;flex-direction:column;gap:7px}
.q-h{display:flex;align-items:center;gap:7px;font-weight:600;font-size:14px}
.q-key{width:9px;height:9px;border-radius:2px;flex:none}
.q-sub{font-size:10.5px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-top:-4px}
.mini{display:block;width:100%;text-align:left;font-size:13px;line-height:1.35;padding:7px 9px;border-radius:9px;background:var(--surface-2);overflow-wrap:anywhere}
.mini.done{color:var(--muted);text-decoration:line-through}

/* Kanban */
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(240px,84%);gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px}
@media (min-width:720px){.kanban{grid-auto-flow:row;grid-template-columns:repeat(3,minmax(0,1fr));overflow:visible}}
.col{scroll-snap-align:start;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.col-h{display:flex;justify-content:space-between;align-items:baseline;font-weight:600;font-size:14px}
.col-h span{font-family:var(--f-mono);font-size:12px;color:var(--faint);font-weight:400}
.kcard{background:var(--surface-2);border-radius:11px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.kcard .t{font-size:14px;line-height:1.35;overflow-wrap:anywhere;text-align:left}
.kmove{display:flex;justify-content:space-between;gap:6px}
.kbtn{font-size:12px;color:var(--muted);padding:4px 9px;border-radius:8px;border:1px solid var(--line);background:var(--surface)}
.kbtn:disabled{opacity:.35;cursor:default}

/* 1-3-5 e Ivy Lee */
.slots{display:flex;flex-direction:column;gap:8px}
.slot{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;border:1px dashed var(--line);border-radius:13px;color:var(--muted);font-size:14px;text-align:left;min-width:0}
.slot.filled{border-style:solid;background:var(--surface);color:var(--fg)}
.slot .n{font-family:var(--f-mono);font-size:12px;color:var(--faint);width:16px;flex:none}
.slot .tx{flex:1;min-width:0;overflow-wrap:anywhere}
.slot.done .tx{color:var(--muted);text-decoration:line-through}
.slot.now{border-color:var(--accent);background:var(--accent-soft)}
.slot-act{display:flex;gap:4px;flex:none}
.sbtn{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:var(--muted);border:1px solid var(--line);background:var(--surface-2)}
.sbtn svg{width:15px;height:15px}
.sbtn:disabled{opacity:.3;cursor:default}

/* Calendário */
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.cal-nav{display:flex;gap:2px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.dow{font-size:10.5px;text-align:center;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;padding-block:2px 6px;font-weight:600}
.day{min-height:52px;border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:3px;padding:5px 1px 6px;font-size:14px;border:1px solid transparent;min-width:0}
.day.out{opacity:.32}
.day.off{background:var(--ok-soft)}
.day.sel{border-color:var(--accent)}
.num{width:27px;height:27px;display:grid;place-items:center;border-radius:50%;font-variant-numeric:tabular-nums}
.day.today .num{background:var(--fg);color:var(--bg);font-weight:600}
.sm{width:16px;height:2.5px;border-radius:2px;background:transparent;flex:none}
.work .sm{background:var(--accent)}
.dots{display:flex;gap:3px;height:5px}
.dots i{width:5px;height:5px;border-radius:50%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-top:12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.lg{width:12px;height:8px;border-radius:2px;flex:none}
.msum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.msum .v{font-family:var(--f-mono);font-size:18px}
.msum .l{font-size:10.5px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;font-weight:600}

/* Agenda */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.wd{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 7px;border-radius:12px;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600;min-width:0}
.wd .n{font-size:17px;color:var(--fg);font-family:var(--f-mono);letter-spacing:0;font-weight:500}
.wd.off{background:var(--ok-soft)}
.wd.sel{background:var(--fg);color:var(--bg)}
.wd.sel .n{color:var(--bg)}
.wd.sel .sm{background:var(--bg)}
.day-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.tl{position:relative;--hh:50px;height:calc(24 * var(--hh));margin-left:46px;border-left:1px solid var(--line)}
.hr{position:absolute;left:0;right:0;height:var(--hh);border-top:1px solid var(--line);display:block;width:100%}
.hr:hover{background:var(--surface-2)}
.hr span{position:absolute;left:-46px;top:-8px;width:38px;text-align:right;font-size:11px;color:var(--faint);font-family:var(--f-mono)}
.blk{position:absolute;border-radius:10px;padding:5px 8px;font-size:12px;line-height:1.3;overflow:hidden;text-align:left;border:1px solid transparent;z-index:2;min-width:0}
.blk b{display:block;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.blk span{color:var(--muted);font-family:var(--f-mono);font-size:11px}
.blk.ev{background:color-mix(in srgb,var(--cat) 20%,var(--surface));border-color:color-mix(in srgb,var(--cat) 50%,transparent)}
.blk.shift{background:repeating-linear-gradient(135deg,var(--accent-soft) 0 7px,transparent 7px 14px),var(--surface);border:1px dashed color-mix(in srgb,var(--accent) 60%,transparent);color:var(--accent)}
.blk.sleep{background:var(--surface-2);border:1px dashed var(--line);color:var(--muted)}
.now{position:absolute;left:-5px;right:0;height:0;border-top:2px solid var(--crit);z-index:3;pointer-events:none}
.now::before{content:"";position:absolute;left:0;top:-6px;width:10px;height:10px;border-radius:50%;background:var(--crit)}
.ag{display:flex;flex-direction:column}
.ag-row{display:grid;grid-template-columns:94px minmax(0,1fr);gap:10px;padding:10px 0;border-top:1px solid var(--line);align-items:start;width:100%;text-align:left}
.ag > .ag-row:first-child{border-top:0}
.ag-time{font-family:var(--f-mono);font-size:12px;color:var(--muted);padding-top:2px}
.ag-t{font-size:14px;display:flex;align-items:center;gap:8px;min-width:0;overflow-wrap:anywhere}
.cat-dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--cat)}
.ag-row.past{opacity:.5}
.ag-row.live .ag-time{color:var(--accent);font-weight:500}

/* Foco */
.ring-wrap{position:relative;width:min(272px,74vw);aspect-ratio:1;max-width:100%;margin:6px auto 0}
.ring-wrap svg{width:100%;height:100%;transform:rotate(-90deg);display:block}
.ring-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:0 30px}
.t-big{font-family:var(--f-mono);font-size:clamp(42px,12.5vw,58px);font-weight:500;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1}
.t-phase{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:600}
.t-task{font-size:13px;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cyc{display:flex;gap:6px;justify-content:center;margin-top:2px}
.cyc i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.cyc i.on{background:var(--accent)}
.ctrl{display:flex;justify-content:center;align-items:center;gap:18px;margin-top:14px}
.play{width:70px;height:70px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:var(--shadow)}
.play svg{width:28px;height:28px}
.round{width:48px;height:48px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--muted);background:var(--surface)}
.round svg{width:20px;height:20px}
.mdesc{font-size:13px;color:var(--muted);text-align:center;max-width:46ch;margin:10px auto 0}
.chart svg{width:100%;height:auto;display:block}
.readout{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px;margin-top:8px}
.readout b{font-weight:600}
.log{display:flex;flex-direction:column}
.log-row{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:13px;align-items:baseline}
.log > .log-row:first-child{border-top:0}
.log-row .tm{font-family:var(--f-mono);color:var(--muted);font-size:12px}
.log-row .mn{font-family:var(--f-mono)}

/* Hábitos */
.hlist{display:flex;flex-direction:column;gap:10px}
.hcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 12px 10px;display:flex;flex-direction:column;gap:10px;min-width:0}
.hcard.dim{opacity:.6}
.hlist.compact{gap:0}
.hlist.compact .hcard{background:transparent;border:0;border-top:1px solid var(--line);border-radius:0;padding:9px 0}
.hlist.compact .hcard:first-child{border-top:0;padding-top:2px}
.hrow{display:flex;align-items:center;gap:12px;min-width:0}
.hchk{flex:none;width:34px;height:34px;border-radius:11px;border:1.6px solid var(--cat);display:grid;place-items:center;background:transparent}
.hchk.on{background:var(--cat)}
.hchk.on::after{content:"";width:7px;height:13px;border:solid var(--surface);border-width:0 2.4px 2.4px 0;transform:translateY(-1px) rotate(45deg)}
.hmain{flex:1;min-width:0;text-align:left;display:flex;flex-direction:column;gap:2px}
.hname{font-size:15px;font-weight:500;line-height:1.3;overflow-wrap:anywhere}
.hmeta{font-size:12px;color:var(--muted)}
.hstreak{flex:none;display:flex;flex-direction:column;align-items:flex-end;line-height:1.15}
.hstreak b{font-size:18px;font-weight:500}
.hstreak span{font-size:9.5px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.hcount{flex:none;display:flex;align-items:center;gap:6px}
.hv{font-size:15px;min-width:42px;text-align:center}
.hv small{font-size:11px;color:var(--muted)}
.hv.ok{color:var(--cat);font-weight:600}
.hdots{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.hd{height:26px;border-radius:8px;font-size:10.5px;font-weight:600;color:var(--muted);display:grid;place-items:center;border:1px solid var(--line);background:transparent}
.hd.dn{background:var(--cat);border-color:var(--cat);color:var(--surface)}
.hd.td{border-color:var(--cat);color:var(--fg)}
.hd.ms{background:var(--surface-2)}
.hd.ns{border-style:dashed;opacity:.55}
.hd.sel{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--fg)}
.hweek{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:14px}
.hwd{display:flex;flex-direction:column;align-items:center;gap:5px;padding:7px 0 6px;border-radius:11px;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600;min-width:0}
.hwd b{font-size:13px;color:var(--fg);letter-spacing:0;font-weight:500}
.hwd.sel{background:var(--surface-2)}
.hbar{display:flex;align-items:flex-end;width:10px;height:34px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.hwd.sel .hbar{background:var(--line)}
.hbar i{display:block;width:100%;background:var(--accent);border-radius:4px}
.hstats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
.hstats .s{font-size:11px;color:var(--faint);margin-top:1px}
.heat svg{width:100%;height:auto;display:block}
.heat rect{cursor:pointer}

.nal{display:flex;align-items:center;gap:6px}
.nal svg{width:14px;height:14px;flex:none;color:var(--accent)}
.bell{display:inline-flex;vertical-align:-2px;margin-left:5px;color:var(--accent)}
.bell svg{width:13px;height:13px}
.perms{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);margin-bottom:10px}
.perm{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line)}
.perm:first-child{border-top:0}
.pdot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--crit)}
.pdot.ok{background:var(--ok)}
.ptx{flex:1;min-width:0;font-size:14px}
.ptx small{display:block;color:var(--muted);font-size:12px}
.pok{font-size:12px;color:var(--ok);font-weight:600}

.seg .seg-add{border-style:dashed;color:var(--accent);background:transparent}
.catnew{display:flex;flex-direction:column;gap:10px;margin-top:10px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2)}
.pal{gap:8px}
.pal button{width:36px;height:36px;padding:0;border-radius:50%;display:grid;place-items:center;background:transparent;border:2px solid transparent}
.pal button i{width:24px;height:24px;border-radius:50%;display:block}
.pal button[aria-pressed="true"]{border-color:var(--fg);background:transparent}
.catlist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.catrow{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);text-align:left;width:100%;background:var(--surface-2)}
.catrow:first-child{border-top:0}
.cat-dot.big{width:14px;height:14px}
.catchips{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.catchips span{display:inline-flex;align-items:center;gap:6px}
.legend .link{font-size:12px}

/* Botão flutuante e abas */
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px),calc(50vw - 364px));bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:8;height:50px;padding:0 18px 0 14px;border-radius:16px;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:15px;display:flex;align-items:center;gap:6px;box-shadow:var(--shadow)}
.fab svg{width:20px;height:20px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;font-size:10.5px;color:var(--muted);font-weight:500;min-width:0;white-space:nowrap}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent)}

/* Folhas e formulários */
.sheet-wrap{position:fixed;inset:0;z-index:20;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:640px;max-height:90%;overflow:auto;overscroll-behavior:contain;background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;padding-block:8px calc(22px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-shadow:var(--shadow);animation:up .22s ease-out}
@keyframes up{from{transform:translateY(28px);opacity:.5}to{transform:none;opacity:1}}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:4px auto 14px}
.sheet h2{font-family:var(--f-display);font-size:27px;font-weight:600;line-height:1.1}
.form{display:flex;flex-direction:column;gap:16px}
.field{display:flex;flex-direction:column;gap:7px;min-width:0}
.lbl{font-size:11px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;font-weight:600}
.inp{width:100%;min-width:0;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-size:16px;color:var(--fg)}
.inp:focus{outline:none;border-color:var(--accent)}
textarea.inp{resize:vertical;min-height:70px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{padding:8px 12px;border-radius:10px;border:1px solid var(--line);font-size:13px;font-weight:500;color:var(--muted);background:var(--surface-2)}
.seg button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.quadpick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.quadpick button{padding:9px 10px;border-radius:11px;border:1px solid var(--line);background:var(--surface-2);text-align:left;font-size:13px;font-weight:600;display:flex;flex-direction:column;gap:2px;min-width:0}
.quadpick button small{font-weight:400;color:var(--muted);font-size:11px}
.quadpick button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 12px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);font-size:14px;text-align:left;width:100%}
.toggle small{display:block;color:var(--muted);font-size:12px;margin-top:1px}
.swt{width:40px;height:24px;border-radius:12px;background:var(--line);position:relative;flex:none;transition:background .15s}
.swt::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--fg);transition:transform .15s}
.toggle[aria-pressed="true"] .swt{background:var(--accent)}
.toggle[aria-pressed="true"] .swt::after{transform:translateX(16px);background:var(--accent-ink)}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{flex:1 1 120px;padding:12px 16px;border-radius:12px;font-weight:600;font-size:15px;border:1px solid var(--line);background:var(--surface-2);text-align:center}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--crit);border-color:var(--crit-soft);background:transparent}
.btn.danger.armed{background:var(--crit);color:#fff;border-color:var(--crit)}
.btn.ghost{background:transparent}
.qchips{display:flex;gap:6px;flex-wrap:wrap}
.qchips button{font-size:12px;padding:5px 10px;border-radius:8px;border:1px solid var(--line);color:var(--muted)}
.divider{height:1px;background:var(--line);margin:4px 0}
.mlist{display:flex;flex-direction:column;gap:10px}
.mgroup{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-top:8px}
.mcard{border:1px solid var(--line);border-radius:14px;padding:13px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;background:var(--surface-2)}
.mcard h3{font-family:var(--f-display);font-size:21px;font-weight:600;line-height:1.15}
.mcard p{font-size:13.5px;color:var(--muted);grid-column:1 / -1;max-width:62ch}
.pick-list{display:flex;flex-direction:column;gap:6px}
.pick-list .mini{padding:11px 12px;font-size:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(146px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;box-shadow:var(--shadow);width:max-content;max-width:calc(100% - 32px);text-align:center}
.loading{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.loading i{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap top-in">
    <div class="brand"><span class="mark">Ritmo<i>.</i></span><span class="hdr-date" id="hdrDate"></span></div>
    <div class="top-act">
      <span class="sync" id="sync" title="Conectando"></span>
      <button class="icon-btn" type="button" data-act="methods" aria-label="Métodos de gestão do tempo" id="btnMethods"></button>
      <button class="icon-btn" type="button" data-act="settings" aria-label="Ajustes" id="btnSettings"></button>
    </div>
  </div>
</header>
<main class="wrap" id="main">
  <div class="card"><div class="loading"><i></i>Abrindo sua agenda…</div></div>
</main>
<button class="fab" type="button" id="fab" hidden></button>
<nav class="tabs" aria-label="Seções">
  <div class="tabs-in" id="tabs"></div>
</nav>
<div class="sheet-wrap" id="sheetWrap" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Editor"></div>
</div>
<div class="toast" id="toast" role="status" hidden></div>
<script>
"use strict";
/* ---------- utilitários ---------- */
const AND=(typeof window!=='undefined'&&window.RitmoAndroid)?window.RitmoAndroid:null;
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const isoOf=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseISO=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
const addDays=(s,n)=>{const d=parseISO(s);d.setDate(d.getDate()+n);return isoOf(d);};
const dayDiff=(a,b)=>{const [y1,m1,d1]=a.split('-').map(Number),[y2,m2,d2]=b.split('-').map(Number);return Math.round((Date.UTC(y2,m2-1,d2)-Date.UTC(y1,m1-1,d1))/864e5);};
const toMin=t=>{if(!t||typeof t!=='string'||!t.includes(':'))return null;const [h,m]=t.split(':').map(Number);return h*60+m;};
const hhmm=m=>m>=1440?'24:00':`${pad(Math.floor(m/60))}:${pad(m%60)}`;
const nowMin=()=>{const d=new Date();return d.getHours()*60+d.getMinutes();};
const today=()=>isoOf(new Date());
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const dur=min=>{min=Math.max(0,Math.round(min));const h=Math.floor(min/60),m=min%60;return h?`${h}h${m?pad(m):''}`:`${m} min`;};
const DOW=['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
const DOWS=['dom','seg','ter','qua','qui','sex','sáb'];
const MES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const MESS=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const dLabel=(d,m)=>{const x=parseISO(d);return `${DOWS[x.getDay()]} ${x.getDate()}${m?' '+MESS[x.getMonth()]:''}`;};
const dLong=d=>{const x=parseISO(d);return `${DOW[x.getDay()]}, ${x.getDate()} de ${MES[x.getMonth()]}`;};
const relDay=d=>d===today()?'Hoje':d===addDays(today(),1)?'Amanhã':d===addDays(today(),-1)?'Ontem':dLabel(d,1);
const clone=o=>JSON.parse(JSON.stringify(o));
function merge(base,over){const out=clone(base);if(!over||typeof over!=='object')return out;for(const k of Object.keys(over)){const v=over[k];if(v&&typeof v==='object'&&!Array.isArray(v)&&out[k]&&typeof out[k]==='object')out[k]=merge(out[k],v);else if(v!==undefined)out[k]=v;}return out;}

/* ---------- ícones ---------- */
const IC={
  hoje:'<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"/>',
  calendario:'<rect x="3" y="4.5" width="18" height="16" rx="2.5"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/>',
  agenda:'<path d="M3.5 6h2.5M3.5 12h2.5M3.5 18h2.5"/><rect x="9" y="4" width="11.5" height="4" rx="1.5"/><rect x="9" y="10" width="7.5" height="4" rx="1.5"/><rect x="9" y="16" width="11.5" height="4" rx="1.5"/>',
  tarefas:'<rect x="3.5" y="4" width="5.5" height="5.5" rx="1.3"/><path d="M4.6 16.3l1.6 1.6 2.9-3.2M12 6.8h8.5M12 16.5h8.5"/>',
  habitos:'<path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20.2 3.8v3.6h-3.6"/><path d="M8.4 12.3l2.5 2.5 4.8-5"/>',
  minus:'<path d="M5 12h14"/>',
  bell:'<path d="M6.5 16.5V11a5.5 5.5 0 0 1 11 0v5.5l1.5 2h-14z"/><path d="M10 21h4"/>',
  foco:'<circle cx="12" cy="13.5" r="7.5"/><path d="M12 13.5V9.5M9.5 2.5h5M18.6 6.4l1.6-1.6"/>',
  book:'<path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15.5H6.5A1.5 1.5 0 0 0 5 20zM5 20a1.5 1.5 0 0 0 1.5 1.5H19M9 7.5h6"/>',
  sliders:'<path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  left:'<path d="M15 6l-6 6 6 6"/>',right:'<path d="M9 6l6 6-6 6"/>',
  up:'<path d="M6 15l6-6 6 6"/>',down:'<path d="M6 9l6 6 6-6"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',
  play:'<path d="M8 5.5v13l10.5-6.5z" fill="currentColor" stroke="none"/>',
  pause:'<path d="M8.5 5.5v13M15.5 5.5v13" stroke-width="3"/>',
  stop:'<rect x="6.5" y="6.5" width="11" height="11" rx="2" fill="currentColor" stroke="none"/>',
  reset:'<path d="M4.5 12a7.5 7.5 0 1 0 2.3-5.4M4.5 4v4.5H9"/>',
  skip:'<path d="M6 5.5v13l9-6.5zM18 5.5v13"/>'
};
const ic=n=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]||''}</svg>`;

/* ---------- constantes ---------- */
const TABS=[['hoje','Hoje'],['calendario','Mês'],['agenda','Agenda'],['tarefas','Tarefas'],['habitos','Hábitos'],['foco','Foco']];
const DEF_CATS=[{k:'trabalho',n:'Trabalho',c:'ouro'},{k:'pessoal',n:'Pessoal',c:'azul'},{k:'estudo',n:'Estudo',c:'violeta'},{k:'saude',n:'Saúde',c:'verde'},{k:'casa',n:'Casa',c:'terracota'},{k:'descanso',n:'Descanso',c:'ardosia'}];
const cats=()=>(Array.isArray(S.settings.cats)&&S.settings.cats.length?S.settings.cats:DEF_CATS);
const catOf=k=>cats().find(c=>c.k===k)||null;
const catName=k=>{const c=catOf(k);return c?c.n:'Sem categoria';};
const catVar=k=>{const c=catOf(k);return c?`var(--p-${c.c})`:'var(--faint)';};
const firstCat=()=>cats()[0].k;
const QUAD={1:['Fazer agora','Urgente e importante','var(--crit)'],2:['Agendar','Importante, não urgente','var(--accent)'],3:['Delegar','Urgente, não importante','var(--info)'],4:['Eliminar','Nem urgente nem importante','var(--faint)']};
const PRI={A:'Deve fazer — consequência séria se não fizer',B:'Deveria fazer — consequência leve',C:'Seria bom fazer — sem consequência',D:'Delegar para outra pessoa',E:'Eliminar da lista'};
const SIZE={G:'Grande',M:'Média',P:'Pequena'};
const DEF_SETTINGS={shift:{on:false,start:'22:00',end:'06:00',work:6,off:2,anchor:''},sleep:{on:false,start:'08:00',end:'14:00'},pomo:{focus:25,short:5,long:15,every:4},alerts:{mode:'alarm',lead:0},cats:DEF_CATS};

/* ---------- estado ---------- */
const S={
  tab:'hoje',mode:'loading',ready:false,
  tasks:[],events:[],habits:[],focus:{},settings:clone(DEF_SETTINGS),hDay:today(),showArch:false,
  sel:today(),calMonth:today().slice(0,7),
  taskView:'lista',showDone:false,d135:'hoje',dIvy:'hoje',
  chartSel:6,pick:null,scrollAg:false
};
try{const v=localStorage.getItem('ritmo.view');if(v){const o=JSON.parse(v);if(o.taskView)S.taskView=o.taskView;}}catch(e){}
const h0=(location.hash||'').slice(1);if(TABS.some(t=>t[0]===h0))S.tab=h0;
function saveView(){try{localStorage.setItem('ritmo.view',JSON.stringify({taskView:S.taskView}));}catch(e){}}

/* ---------- armazenamento ---------- */
const Store={
  db:null,qs:{},
  async init(){
    let db=null;
    try{if(window.claude&&typeof window.claude.use==='function')db=await window.claude.use('db');}catch(e){db=null;}
    if(!db){this.local();return;}
    this.db=db;S.mode='db';
    const got={t:0,e:0,f:0,c:0,h:0};
    const ready=()=>{if(got.t&&got.e&&got.f&&got.c&&got.h)S.ready=true;render();};
    const fail=e=>{console.warn('db',e);if(e&&e.code==='revoked'){S.mode='local';toast('A sincronização foi interrompida nesta tela.');}render();};
    db.collection('tasks').onSnapshot(s=>{S.tasks=s.docs.map(d=>Object.assign({},d.data(),{id:d.id}));got.t=1;ready();},fail);
    db.collection('events').onSnapshot(s=>{S.events=s.docs.map(d=>Object.assign({},d.data(),{id:d.id}));got.e=1;ready();},fail);
    db.collection('habits').onSnapshot(s=>{S.habits=s.docs.map(d=>Object.assign({},d.data(),{id:d.id}));got.h=1;ready();},fail);
    db.collection('focus').onSnapshot(s=>{const f={};s.docs.forEach(d=>{f[d.id]=d.data();});S.focus=f;got.f=1;ready();},fail);
    db.doc('config/settings').onSnapshot(s=>{S.settings=merge(DEF_SETTINGS,s.exists?s.data():{});got.c=1;ready();},fail);
  },
  local(){
    S.mode='local';
    let raw=null;try{raw=localStorage.getItem('ritmo.data');}catch(e){}
    try{if(raw){const o=JSON.parse(raw);S.tasks=o.tasks||[];S.events=o.events||[];S.habits=o.habits||[];S.focus=o.focus||{};S.settings=merge(DEF_SETTINGS,o.settings||{});}
      else if(AND){const x=exampleData();S.tasks=x.tasks;S.events=x.events;S.habits=x.habits;this.saveLocal();}}catch(e){}
    S.ready=true;render();
  },
  saveLocal(){try{localStorage.setItem('ritmo.data',JSON.stringify({tasks:S.tasks,events:S.events,habits:S.habits,focus:S.focus,settings:S.settings}));}catch(e){}},
  q(path,fn){
    const run=async()=>{try{return await fn();}catch(e){if(e&&e.code==='unavailable'){await new Promise(r=>setTimeout(r,600+Math.random()*900));return fn();}throw e;}};
    const p=(this.qs[path]||Promise.resolve()).then(run).catch(e=>this.err(e));
    this.qs[path]=p;return p;
  },
  err(e){
    const c=e&&e.code;console.warn('save',e);
    toast(c==='quota_exceeded'?'Espaço cheio. Exclua itens antigos para continuar salvando.':c==='invalid_argument'?'Sem permissão para salvar nesta conta.':'Não foi possível salvar agora. Tente de novo.');
  },
  body(o){const b=clone(o);delete b.id;return b;},
  put(col,arr,item){
    const i=arr.findIndex(x=>x.id===item.id);if(i>=0)arr[i]=item;else arr.push(item);
    if(S.mode==='db'&&this.db)this.q(col+'/'+item.id,()=>this.db.doc(col+'/'+item.id).set(this.body(item)));else this.saveLocal();
  },
  del(col,key,id){
    S[key]=S[key].filter(x=>x.id!==id);
    if(S.mode==='db'&&this.db)this.q(col+'/'+id,()=>this.db.doc(col+'/'+id).delete());else this.saveLocal();
  },
  putTask(t){this.put('tasks',S.tasks,t);},
  delTask(id){this.del('tasks','tasks',id);},
  putEvent(e){this.put('events',S.events,e);},
  delEvent(id){this.del('events','events',id);},
  putHabit(h){this.put('habits',S.habits,h);},
  delHabit(id){this.del('habits','habits',id);},
  putFocus(d,doc){S.focus[d]=doc;if(S.mode==='db'&&this.db)this.q('focus/'+d,()=>this.db.doc('focus/'+d).set(clone(doc)));else this.saveLocal();},
  putSettings(s){S.settings=s;if(S.mode==='db'&&this.db)this.q('config/settings',()=>this.db.doc('config/settings').set(clone(s)));else this.saveLocal();}
};

/* ---------- escala de turnos ---------- */
function shiftOn(){const s=S.settings.shift;return !!(s&&s.on&&s.anchor&&/^\d{4}-\d{2}-\d{2}$/.test(s.anchor));}
function workDay(d){
  if(!shiftOn())return null;
  const s=S.settings.shift,w=Math.max(1,+s.work||0),o=Math.max(0,+s.off||0),c=w+o;
  const k=((dayDiff(s.anchor,d)%c)+c)%c;
  return k>=o;
}
function fixedBlocks(d){
  const out=[];if(!shiftOn())return out;
  const s=S.settings.shift,st=toMin(s.start),en=toMin(s.end);if(st==null||en==null)return out;
  const x=en<=st,prev=workDay(addDays(d,-1));
  if(x&&prev)out.push({kind:'shift',title:'Turno',sub:'fim do turno',s:0,e:en});
  if(workDay(d))out.push({kind:'shift',title:'Turno',sub:'',s:st,e:x?1440:en});
  const sl=S.settings.sleep,a=toMin(sl.start),b=toMin(sl.end);
  if(sl.on&&x&&prev&&a!=null&&b!=null&&b>a)out.push({kind:'sleep',title:'Sono',sub:'depois do turno',s:a,e:b});
  return out;
}
function shiftNow(){
  if(!shiftOn())return null;
  const s=S.settings.shift,d=today(),n=nowMin(),st=toMin(s.start),en=toMin(s.end),x=en<=st;
  const len=x?1440-st+en:en-st;
  if(x&&workDay(addDays(d,-1))&&n<en)return {state:'on',end:en,left:en-n,len};
  if(workDay(d)){
    if(n>=st&&(x||n<en)){const left=x?1440-n+en:en-n;return {state:'on',end:en,left,len};}
    if(n<st)return {state:'later',start:st,inMin:st-n};
    return {state:'after'};
  }
  return {state:'off'};
}
function offRun(d){let e=d;while(workDay(addDays(e,1))===false)e=addDays(e,1);return e;}
function nextOff(){
  if(!shiftOn())return null;
  const t=today();
  if(workDay(t)===false){const e=offRun(t);return {today:true,from:t,to:e,back:addDays(e,1)};}
  for(let i=1;i<90;i++){const d=addDays(t,i);if(workDay(d)===false)return {today:false,from:d,to:offRun(d),inDays:i};}
  return null;
}
function upcomingOffs(n){
  const out=[];if(!shiftOn())return out;let d=today();
  for(let i=0;i<120&&out.length<n;i++){const x=addDays(d,i);if(workDay(x)===false&&workDay(addDays(x,-1))!==false){out.push([x,offRun(x)]);}}
  return out;
}

/* ---------- eventos e tarefas ---------- */
function eventsOn(d){
  return S.events.filter(e=>{
    if(!e.date)return false;if(e.date===d)return true;if(d<e.date)return false;
    if(e.rep==='daily')return true;if(e.rep==='weekly')return dayDiff(e.date,d)%7===0;return false;
  }).map(e=>{const s=toMin(e.start)??480;let en=toMin(e.end);if(en==null||en<=s)en=en!=null&&en<s?1440:s+60;return {kind:'ev',id:e.id,title:e.title,cat:e.cat||'pessoal',s,e:Math.max(en,s+15),ex:e.ex,rep:e.rep};});
}
const dayItems=d=>[...fixedBlocks(d),...eventsOn(d)].sort((a,b)=>a.s-b.s||a.e-b.e);
const isDone=t=>t.status==='done';
const activeTasks=()=>S.tasks.filter(t=>!isDone(t));
const byOrder=(a,b)=>((b.frog===today())-(a.frog===today()))||(!!b.hi-!!a.hi)||((a.pri||'Z').localeCompare(b.pri||'Z'))||((a.created||0)-(b.created||0));
const focusMinOn=d=>((S.focus[d]&&S.focus[d].items)||[]).reduce((a,x)=>a+(+x.min||0),0);

/* ---------- interface comum ---------- */
let toastT=null;
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true;},2800);}
const sheetOpen=()=>!$('#sheetWrap').hidden;
function openSheet(html){const s=$('#sheet');s.innerHTML='<div class="grab"></div>'+html;$('#sheetWrap').hidden=false;s.scrollTop=0;document.body.style.overflow='hidden';setTimeout(()=>{const a=s.querySelector('[data-autofocus]');if(a&&window.matchMedia('(hover:hover)').matches)a.focus();},60);}
function closeSheet(){$('#sheetWrap').hidden=true;document.body.style.overflow='';S.pick=null;}
function taskTags(t,o){
  o=o||{};const tags=[],td=today(),late=t.date&&t.date<td&&!isDone(t);
  if(t.frog===td&&!isDone(t))tags.push('<span class="tag frog">Sapo do dia</span>');
  if(t.pri)tags.push(`<span class="tag pri-${esc(t.pri)}">${esc(t.pri)}</span>`);
  if(t.hi)tags.push('<span class="tag gold">80/20</span>');
  if(t.est)tags.push(`<span class="tag">${+t.est<=2?'2 min':dur(t.est)}</span>`);
  if(t.date&&!o.noDate)tags.push(`<span class="tag ${late?'late':''}">${late?'Atrasada · ':''}${relDay(t.date)}</span>`);
  if(t.ctx&&catOf(t.ctx))tags.push(`<span class="tag" style="color:${catVar(t.ctx)}">${esc(catName(t.ctx))}</span>`);
  if(t.pomos)tags.push(`<span class="tag">${t.pomos} ciclo${t.pomos>1?'s':''}</span>`);
  if(t.ex)tags.push('<span class="tag ex">exemplo</span>');
  return tags.length?`<div class="meta">${tags.join('')}</div>`:'';
}
function taskRow(t,o){
  const d=isDone(t);
  return `<div class="row ${d?'done':''}"><button type="button" class="chk ${d?'on':''}" data-act="toggle" data-id="${esc(t.id)}" aria-label="${d?'Reabrir':'Concluir'}: ${esc(t.title)}"></button><button type="button" class="row-main" data-act="edit-task" data-id="${esc(t.id)}"><div class="row-t">${esc(t.title)}</div>${taskTags(t,o)}</button></div>`;
}
/* ---------- mostrador de 24 h ---------- */
function dialSvg(items){
  const C=60,R=41;
  const pt=(m,r)=>{const a=m/1440*2*Math.PI-Math.PI/2;return [C+r*Math.cos(a),C+r*Math.sin(a)];};
  const arc=(s,e,r)=>{if(e-s>=1440)e=s+1439.5;const [x1,y1]=pt(s,r),[x2,y2]=pt(e,r);return `M${x1.toFixed(2)} ${y1.toFixed(2)}A${r} ${r} 0 ${e-s>720?1:0} 1 ${x2.toFixed(2)} ${y2.toFixed(2)}`;};
  let g=`<circle cx="${C}" cy="${C}" r="${R}" fill="none" style="stroke:var(--surface-2)" stroke-width="9"/>`;
  for(let h=0;h<24;h++){const major=h%6===0;const [a,b]=pt(h*60,R+7),[c,d]=pt(h*60,R+(major?13:10));g+=`<line x1="${a.toFixed(1)}" y1="${b.toFixed(1)}" x2="${c.toFixed(1)}" y2="${d.toFixed(1)}" style="stroke:var(${major?'--muted':'--line'})" stroke-width="${major?1.4:1}"/>`;}
  [[0,'0'],[360,'6'],[720,'12'],[1080,'18']].forEach(([m,l])=>{const [x,y]=pt(m,R-15);g+=`<text x="${x.toFixed(1)}" y="${(y+3).toFixed(1)}" text-anchor="middle" font-size="8.5" style="fill:var(--faint);font-family:var(--f-mono)">${l}</text>`;});
  items.forEach(it=>{const col=it.kind==='shift'?'var(--accent)':it.kind==='sleep'?'var(--p-ardosia)':catVar(it.cat);g+=`<path d="${arc(it.s,it.e,R)}" fill="none" style="stroke:${col}" stroke-width="9" stroke-opacity="${it.kind==='sleep'?.55:.95}"/>`;});
  const n=nowMin(),[hx,hy]=pt(n,R+4);
  g+=`<line x1="${C}" y1="${C}" x2="${hx.toFixed(1)}" y2="${hy.toFixed(1)}" style="stroke:var(--fg)" stroke-width="1.6" stroke-linecap="round"/><circle cx="${C}" cy="${C}" r="3" style="fill:var(--fg)"/>`;
  return `<svg class="dial" viewBox="0 0 120 120" role="img" aria-label="Relógio de 24 horas com os blocos de hoje">${g}</svg>`;
}

/* ---------- Hoje ---------- */
function vHoje(){
  const d=today(),x=parseISO(d),items=dayItems(d),n=nowMin();
  let shift='';
  if(!S.ready)shift='<div class="shift-row muted">Carregando escala…</div>';
  else if(!shiftOn())shift=`<div class="shift-row"><span class="pill livre">Escala</span><button type="button" class="link" data-act="settings">Configurar escala de turnos</button></div>`;
  else{
    const sn=shiftNow(),no=nextOff(),st=S.settings.shift;
    if(sn.state==='on')shift=`<div class="shift-row"><span class="pill turno">Em turno</span><span>termina às <b class="mono">${hhmm(sn.end)}</b> · faltam <b>${dur(sn.left)}</b></span></div><div class="bar" aria-hidden="true"><i style="width:${Math.min(100,Math.max(2,(1-sn.left/sn.len)*100)).toFixed(1)}%"></i></div>`;
    else if(sn.state==='later')shift=`<div class="shift-row"><span class="pill turno">Turno hoje</span><span>começa às <b class="mono">${esc(st.start)}</b> · em <b>${dur(sn.inMin)}</b></span></div>`;
    else if(sn.state==='after')shift=`<div class="shift-row"><span class="pill livre">Turno encerrado</span></div>`;
    else shift=`<div class="shift-row"><span class="pill folga">Folga</span><span>aproveite para descansar</span></div>`;
    if(no){
      if(no.today)shift+=`<div class="next-off">Folga até <b>${dLabel(no.to,1)}</b> · retorno ${dLabel(no.back)} às ${esc(st.start)}</div>`;
      else shift+=`<div class="next-off">Próxima folga · <b>${dLabel(no.from)}${no.to!==no.from?' e '+dLabel(no.to):''}</b> · em ${no.inDays} dia${no.inDays>1?'s':''}</div>`;
    }
  }
  const tt=S.tasks.filter(t=>t.date===d),done=tt.filter(isDone).length;
  const fm=focusMinOn(d),cycles=((S.focus[d]&&S.focus[d].items)||[]).length;
  const frog=S.tasks.find(t=>t.frog===d);
  const late=S.tasks.filter(t=>t.date&&t.date<d&&!isDone(t)).length;
  const inbox=S.tasks.filter(t=>t.inbox&&!isDone(t)).length;

  const na=nextAlarm();
  if(na){const ad=new Date(na.at),ai=isoOf(ad);shift+=`<div class="next-off nal">${ic('bell')}<span>Próximo alarme · <b>${ai===today()?'hoje':dLabel(ai)} ${pad(ad.getHours())}:${pad(ad.getMinutes())}</b> · ${esc(na.t)}</span></div>`;}
  let h=`<section class="card hero"><div class="hero-grid"><div style="min-width:0"><div class="eyebrow">${DOW[x.getDay()]}</div><h1 class="display">${x.getDate()} de ${MES[x.getMonth()]}</h1><div class="clock mono" id="clock"></div></div>${dialSvg(items)}</div>${shift}</section>`;
  h+=`<section class="stats" aria-label="Resumo de hoje"><div class="stat"><div class="v">${done}<small>/${tt.length}</small></div><div class="l">Tarefas hoje</div></div><div class="stat"><div class="v">${dur(fm).replace(' min','<small> min</small>')}</div><div class="l">Foco hoje</div></div><div class="stat"><div class="v">${cycles}</div><div class="l">Sessões</div></div></section>`;
  if(T.running||T.remain!=null||T.flowAcc)h+=`<button type="button" class="card banner" data-act="tab" data-tab="foco" style="border:0"><span>${esc(METHODS[T.method].n)} · ${T.phase==='focus'?'foco':'pausa'}${T.running?'':' (pausado)'}</span><b class="mono" id="miniTime"></b></button>`;
  if(late||inbox)h+=`<div class="banner"><span>${late?`<b>${late}</b> tarefa${late>1?'s':''} atrasada${late>1?'s':''}`:''}${late&&inbox?' · ':''}${inbox?`<b>${inbox}</b> na Entrada para processar`:''}</span><button type="button" class="link" data-act="go" data-go="tarefas:lista">Ver tarefas</button></div>`;

  h+=`<section class="card"><div class="sec-h"><div><div class="eyebrow">Engolir o sapo</div><h2 class="title">Sapo do dia</h2></div>${frog?'<button type="button" class="link" data-act="pick" data-mode="frog">Trocar</button>':''}</div>`;
  if(frog){h+=`<div class="frog-t" style="${isDone(frog)?'text-decoration:line-through;color:var(--muted)':''}">${esc(frog.title)}</div>${taskTags(frog,{noDate:1})}<div class="btns" style="margin-top:14px"><button type="button" class="btn ${isDone(frog)?'':'primary'}" data-act="toggle" data-id="${esc(frog.id)}">${isDone(frog)?'Reabrir':'Concluir'}</button>${isDone(frog)?'':`<button type="button" class="btn" data-act="focus-task" data-id="${esc(frog.id)}">Focar agora</button>`}</div>`;}
  else h+=`<p class="hint">A tarefa mais difícil e importante do dia, feita antes de todas as outras.</p><div class="btns" style="margin-top:12px"><button type="button" class="btn" data-act="pick" data-mode="frog">Escolher o sapo</button></div>`;
  h+=`</section>`;

  h+=hojeHabits();
  h+=`<section class="card"><div class="sec-h"><h2 class="title">Agenda de hoje</h2><button type="button" class="link" data-act="open-agenda" data-d="${d}">Abrir agenda</button></div>`;
  if(!items.length)h+=`<div class="empty">Nenhum compromisso hoje. Bloqueie horários na Agenda.</div>`;
  else h+=`<div class="ag">${items.map(it=>{const cls=it.e<=n?'past':it.s<=n?'live':'';const col=it.kind==='shift'?'var(--accent)':it.kind==='sleep'?'var(--p-ardosia)':catVar(it.cat);const act=it.kind==='ev'?`data-act="edit-ev" data-id="${esc(it.id)}"`:'data-act="settings"';return `<button type="button" class="ag-row ${cls}" ${act}><span class="ag-time">${hhmm(it.s)}–${hhmm(it.e)}</span><span class="ag-t"><i class="cat-dot" style="--cat:${col}"></i>${esc(it.title)}${it.sub?`<span class="muted small">· ${esc(it.sub)}</span>`:''}${it.ex?' <span class="tag ex">exemplo</span>':''}${evBell(it)}</span></button>`;}).join('')}</div>`;
  h+=`</section>`;

  const cap={G:1,M:3,P:5},rows=Object.keys(cap).map(k=>{const ts=tt.filter(t=>t.size===k);const dn=ts.filter(isDone).length;let m='';for(let i=0;i<cap[k];i++)m+=`<i class="${i<dn?'done':i<ts.length?'on':''}"></i>`;return `<div class="p135-row"><span>${k==='G'?'1 grande':k==='M'?'3 médias':'5 pequenas'}</span><span class="meter" aria-hidden="true">${m}</span><span class="c">${ts.length}/${cap[k]}</span></div>`;}).join('');
  h+=`<section class="card"><div class="sec-h"><div><div class="eyebrow">Regra 1-3-5</div><h2 class="title">Plano do dia</h2></div><button type="button" class="link" data-act="go" data-go="tarefas:135">Planejar</button></div><div class="p135">${rows}</div></section>`;
  return h;
}

/* ---------- Calendário ---------- */
function vCal(){
  const [y,m]=S.calMonth.split('-').map(Number),first=new Date(y,m-1,1),dim=new Date(y,m,0).getDate();
  const start=addDays(isoOf(first),-first.getDay()),cells=Math.ceil((first.getDay()+dim)/7)*7,td=today();
  let g=DOWS.map(w=>`<div class="dow">${w}</div>`).join('');
  let nW=0,nO=0,nE=0;const usedCats=new Set();
  for(let i=0;i<cells;i++){
    const d=addDays(start,i),x=parseISO(d),out=x.getMonth()!==m-1,w=workDay(d),ev=eventsOn(d),tk=S.tasks.filter(t=>t.date===d&&!isDone(t)).length;
    if(!out){if(w===true)nW++;if(w===false)nO++;nE+=ev.length;ev.forEach(e=>usedCats.add(e.cat));}
    const dots=ev.slice(0,3).map(e=>`<i style="background:${catVar(e.cat)}"></i>`).join('')+(tk?'<i style="background:var(--muted)"></i>':'');
    const lab=`${dLong(d)}${w===true?', turno':w===false?', folga':''}${ev.length?`, ${ev.length} evento${ev.length>1?'s':''}`:''}${tk?`, ${tk} tarefa${tk>1?'s':''}`:''}`;
    g+=`<button type="button" class="day ${out?'out':''} ${w===true?'work':''} ${w===false?'off':''} ${d===td?'today':''} ${d===S.sel?'sel':''}" data-act="pick-day" data-d="${d}" aria-label="${esc(lab)}" aria-pressed="${d===S.sel}"><span class="num">${x.getDate()}</span><span class="sm"></span><span class="dots">${dots}</span></button>`;
  }
  const monthCats=cats().filter(c=>usedCats.has(c.k));
  let h=`<section class="card"><div class="cal-head"><h2 class="title" style="font-size:26px">${MES[m-1][0].toUpperCase()+MES[m-1].slice(1)} <span class="muted mono" style="font-size:16px">${y}</span></h2><div class="cal-nav"><button type="button" class="icon-btn" data-act="cal-prev" aria-label="Mês anterior">${ic('left')}</button><button type="button" class="link" data-act="cal-today" style="padding:0 8px">Hoje</button><button type="button" class="icon-btn" data-act="cal-next" aria-label="Próximo mês">${ic('right')}</button></div></div><div class="cal">${g}</div>`;
  h+=`<div class="legend"><span><i class="lg" style="height:3px;background:var(--accent)"></i>Turno</span><span><i class="lg" style="background:var(--ok-soft);border:1px solid var(--ok)"></i>Folga</span><span><i class="lg" style="width:6px;height:6px;border-radius:50%;background:var(--muted)"></i>Tarefa</span>${monthCats.map(c=>`<span><i class="lg" style="width:6px;height:6px;border-radius:50%;background:var(--p-${esc(c.c)})"></i>${esc(c.n)}</span>`).join('')}<button type="button" class="link" data-act="cats">Editar categorias</button></div>`;
  if(shiftOn())h+=`<div class="msum"><div><div class="v">${nW}</div><div class="l">Dias de turno</div></div><div><div class="v">${nO}</div><div class="l">Folgas</div></div><div><div class="v">${nE}</div><div class="l">${nE===1?'Evento':'Eventos'}</div></div></div>`;
  h+=`</section>`;
  const d=S.sel,w=workDay(d),its=dayItems(d),tks=S.tasks.filter(t=>t.date===d).sort(byOrder);
  h+=`<section class="card"><div class="sec-h"><div style="min-width:0"><div class="eyebrow">${w===true?'Dia de turno':w===false?'Folga':'Dia selecionado'}</div><h2 class="title">${dLong(d)}</h2></div><button type="button" class="link" data-act="open-agenda" data-d="${d}">Abrir agenda</button></div>`;

  return items;
}

/* ---------- backup: exportar e importar ---------- */
async function exportData(){
  const data={app:'Ritmo',version:2,exportedAt:new Date().toISOString(),settings:S.settings,tasks:S.tasks,events:S.events,habits:S.habits,focus:S.focus};
  const json=JSON.stringify(data,null,1),name=`ritmo-backup-${today()}.json`;
  if(AND&&AND.saveFile){try{AND.saveFile(name,json);}catch(e){toast('Não foi possível exportar.');}return;}
  let dl=null;try{if(window.claude&&typeof window.claude.use==='function')dl=await window.claude.use('downloads');}catch(e){}
  if(dl){try{await dl.save({filename:name,data:json});toast('Backup salvo');return;}catch(e){if(e&&(e.code==='declined'||e.code==='rate_limited'))return;}}
  try{await navigator.clipboard.writeText(json);toast('Backup copiado. Cole num arquivo .json para guardar.');}catch(e){toast('Exportação indisponível nesta tela.');}
}
const okId=id=>typeof id==='string'&&/^[A-Za-z0-9_\-.~:@+]{1,200}$/.test(id)&&id!=='.'&&id!=='..';
function readImport(file){
  const box=$('#impBox');if(!file||!box)return;
  const r=new FileReader();
  r.onload=()=>{
    let o=null;try{o=JSON.parse(String(r.result));}catch(e){}
    if(!o||typeof o!=='object'||!(Array.isArray(o.tasks)||Array.isArray(o.events)||Array.isArray(o.habits))){box.innerHTML='<p class="hint" style="color:var(--crit)">Este arquivo não é um backup do Ritmo.</p>';return;}
    const pick=a=>(Array.isArray(a)?a:[]).filter(x=>x&&okId(x.id)&&typeof x==='object');
    S.imp={tasks:pick(o.tasks),events:pick(o.events),habits:pick(o.habits),focus:o.focus&&typeof o.focus==='object'?o.focus:{},settings:o.settings&&typeof o.settings==='object'?o.settings:null};
    const fd=Object.keys(S.imp.focus).length;
    box.innerHTML=`<div class="banner" style="flex-direction:column;align-items:stretch"><span>O backup tem <b>${S.imp.tasks.length}</b> tarefas, <b>${S.imp.events.length}</b> eventos, <b>${S.imp.habits.length}</b> hábitos e <b>${fd}</b> dias de foco${S.imp.settings?', além dos ajustes':''}. Itens com o mesmo código são atualizados; nada é apagado.</span><div class="btns"><button type="button" class="btn primary" data-act="imp-go">Importar</button><button type="button" class="btn ghost" data-act="imp-cancel">Cancelar</button></div></div>`;
  };
  r.onerror=()=>{box.innerHTML='<p class="hint" style="color:var(--crit)">Não consegui ler o arquivo.</p>';};
  r.readAsText(file);
}
async function applyImport(){
  const o=S.imp;if(!o)return;const box=$('#impBox');if(box)box.innerHTML='<div class="loading"><i></i>Importando…</div>';
  const items=[];o.tasks.forEach(t=>items.push(['tasks',t]));o.events.forEach(e=>items.push(['events',e]));o.habits.forEach(h=>items.push(['habits',h]));
  items.forEach(([c,it])=>{const arr=S[c],i=arr.findIndex(x=>x.id===it.id),v=clone(it);if(i>=0)arr[i]=v;else arr.push(v);});
  const fdays={};
  Object.keys(o.focus).forEach(d=>{if(!/^\d{4}-\d{2}-\d{2}$/.test(d))return;const inc=(o.focus[d]&&Array.isArray(o.focus[d].items))?o.focus[d].items:[],cur=(S.focus[d]&&S.focus[d].items)||[];const seen=new Set(cur.map(x=>`${x.at}|${x.m}|${x.min}`));fdays[d]={date:d,items:cur.concat(inc.filter(x=>x&&!seen.has(`${x.at}|${x.m}|${x.min}`)))};S.focus[d]=fdays[d];});
  if(o.settings)S.settings=merge(DEF_SETTINGS,o.settings);
  let failed=false;
  if(S.mode==='db'&&Store.db){
    try{
      let n=0;const pause=()=>new Promise(r=>setTimeout(r,250));
      for(const [c,it] of items){await Store.db.doc(c+'/'+it.id).set(Store.body(it));if(++n%20===0)await pause();}
      for(const d of Object.keys(fdays)){await Store.db.doc('focus/'+d).set(clone(fdays[d]));if(++n%20===0)await pause();}
      if(o.settings)await Store.db.doc('config/settings').set(clone(S.settings));
    }catch(e){failed=true;Store.err(e);}
  }else Store.saveLocal();
  S.imp=null;closeSheet();render();
  if(!failed)toast(`Importado: ${o.tasks.length} tarefas, ${o.events.length} eventos, ${o.habits.length} hábitos.`);
}

/* ---------- alarmes dos eventos (app Android) ---------- */
const ALERT_OPTS=[['alarm','Alarme'],['notif','Notificação'],['off','Sem aviso']];
const LEAD_OPTS=[[0,'Na hora'],[5,'5 min'],[10,'10 min'],[15,'15 min'],[30,'30 min'],[60,'1 h']];
const alertOf=e=>{const a=e.alert||((S.settings.alerts||{}).mode)||'alarm';return ALERT_OPTS.some(o=>o[0]===a)?a:'alarm';};
const leadOf=e=>{const v=e.lead!=null&&e.lead!==''?+e.lead:+((S.settings.alerts||{}).lead||0);return isNaN(v)?0:Math.max(0,Math.min(240,v));};
const canAlarm=()=>!!(AND&&AND.setEventAlarms);
function alarmList(){
  const now=Date.now(),td=today(),out=[];
  for(let i=0;i<15;i++){
    const d=addDays(td,i);
    eventsOn(d).forEach(it=>{
      const e=S.events.find(x=>x.id===it.id);if(!e||e.ex)return;
      const mode=alertOf(e);if(mode==='off')return;
      const lead=leadOf(e),x=parseISO(d),startMs=new Date(x.getFullYear(),x.getMonth(),x.getDate(),Math.floor(it.s/60),it.s%60).getTime(),at=startMs-lead*60000;
      if(at<now-60000)return;
      out.push({k:`${e.id}@${startMs}`,at,t:e.title||'Evento',s:`${hhmm(it.s)}–${hhmm(it.e)} · ${catName(e.cat)}`,start:hhmm(it.s),lead,m:mode,d});
    });
  }
  return out.sort((a,b)=>a.at-b.at).slice(0,200);
}
let alarmKey='',alarmT=null,askedNotif=false;
function pushAlarms(){
  if(!canAlarm()||!S.ready)return;
  clearTimeout(alarmT);
  alarmT=setTimeout(()=>{
    const list=alarmList(),json=JSON.stringify(list.map(({d,...r})=>r));
    if(json===alarmKey)return;alarmKey=json;
    try{AND.setEventAlarms(json);}catch(e){}
    if(list.length&&!askedNotif&&AND.requestNotifications){askedNotif=true;try{AND.requestNotifications();}catch(e){}}
  },400);
}

function render(){
  const now=new Date();
  $('#hdrDate').textContent=`${DOWS[now.getDay()]}, ${now.getDate()} ${MESS[now.getMonth()]}`;
  const sy=$('#sync');sy.className='sync '+(S.mode==='db'?'on':S.mode==='local'?'local':'');
  sy.title=S.mode==='db'?'Sincronizado na sua conta':S.mode==='local'?'Salvo só neste aparelho':'Conectando';
  const main=$('#main'),ae=document.activeElement;let keep=null;
  if(ae&&ae.id&&main.contains(ae)&&(ae.tagName==='INPUT'||ae.tagName==='TEXTAREA'))keep={id:ae.id,v:ae.value,s:ae.selectionStart,e:ae.selectionEnd};
  const V={hoje:vHoje,calendario:vCal,agenda:vAgenda,tarefas:vTarefas,habitos:vHabitos,foco:vFoco}[S.tab]||vHoje;
  let html='';
  try{html=V();}catch(err){console.error(err);html=`<div class="empty">Algo saiu errado ao montar esta tela. Toque em outra aba e volte.</div>`;}
  if(S.mode==='local'&&!AND&&S.tab==='hoje')html=`<div class="banner"><span>Modo local: os dados ficam salvos só neste aparelho.</span></div>`+html;
  main.innerHTML=html;
  if(keep){const n=document.getElementById(keep.id);if(n){n.value=keep.v;n.focus();try{n.setSelectionRange(keep.s,keep.e);}catch(e){}}}

  if(fc){fab.hidden=false;fab.dataset.act=fc[0];fab.innerHTML=ic('plus')+fc[1];fab.setAttribute('aria-label',fc[2]);}else fab.hidden=true;

      window.scrollTo(0,Math.max(0,tl.getBoundingClientRect().top+window.scrollY+m/60*hh-170));}

}
function tickUI(){
  const c=$('#clock');if(c){const d=new Date();c.textContent=`${pad(d.getHours())}:${pad(d.getMinutes())}`;}
  const r=remaining(),txt=fmtMs(r);
  const tt=$('#tTime');if(tt)tt.textContent=txt;
  const mt=$('#miniTime');if(mt)mt.textContent=txt;
  const ring=$('#tRing');
  if(ring){let fr;if(flowFocus())fr=(r/60000%25)/25;else{const L=phaseLen();fr=L?1-r/L:0;}ring.style.strokeDashoffset=(CIRC*(1-Math.min(1,Math.max(0,fr)))).toFixed(1);}
  const nl=$('#nowLine');if(nl)nl.style.top=`calc(${(nowMin()/60).toFixed(3)} * var(--hh))`;
}

/* ---------- eventos globais ---------- */
document.addEventListener('click',e=>{
  if(e.target===$('#sheetWrap')){closeSheet();return;}
  const el=e.target.closest('[data-act]');if(!el||el.disabled)return;
  const f=ACT[el.dataset.act];if(f)f(el,e);
});
document.addEventListener('submit',e=>{const f=e.target;if(!f.dataset||!f.dataset.form)return;e.preventDefault();const h=FORMS[f.dataset.form];if(h)h(f);});
document.addEventListener('change',e=>{
  if(e.target.id==='focTask'){T.task=e.target.value;saveT();render();}
  if(e.target.id==='impFile'&&e.target.files&&e.target.files[0])readImport(e.target.files[0]);
});
let barsKey='';
function syncBars(){
  if(!AND||!AND.setBars)return;
  try{const cs=getComputedStyle(document.documentElement),bg=cs.getPropertyValue('--bg').trim(),nav=cs.getPropertyValue('--surface').trim(),light=!!(window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches),k=bg+nav+light;if(!bg||k===barsKey)return;barsKey=k;AND.setBars(bg,nav,light);}catch(e){}
}
window.ritmoBack=function(){if(sheetOpen()){closeSheet();return true;}if(S.tab!=='hoje'){switchTab('hoje');return true;}return false;};
try{window.matchMedia('(prefers-color-scheme: light)').addEventListener('change',()=>{barsKey='';syncBars();});}catch(e){}
document.addEventListener('input',e=>{const f=e.target.closest&&e.target.closest('form[data-form="settings"]');if(f)offPreview(f);});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&sheetOpen())closeSheet();});
let lastMin=-1;
setInterval(()=>{
  if(T.running&&!flowFocus()&&T.endAt<=Date.now())tComplete();
  tickUI();
  const m=nowMin();
  if(m!==lastMin){
    const first=lastMin<0;lastMin=m;
    if(!first&&['hoje','agenda','calendario'].includes(S.tab)&&!sheetOpen()){const a=document.activeElement;if(!(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)))render();}
  }
},500);

/* ---------- início ---------- */
$('#tabs').innerHTML=TABS.map(([k,l])=>`<button type="button" class="tab" data-act="tab" data-tab="${k}">${ic(k)}<span>${l}</span></button>`).join('');
$('#btnMethods').innerHTML=ic('book');
$('#btnSettings').innerHTML=ic('sliders');
render();
Store.init();
if(T.running)nativeAlarm();

FORMS.habit=function(f){
  const el=n=>f.elements.namedItem(n),seg=segOf(f),name=el('name').value.trim();
  if(!name){el('name').focus();return;}
  const type=seg('type')||'check',freq=seg('freq')||'daily';
  const days=[...f.querySelectorAll('[data-seg="days"] [aria-pressed="true"]')].map(b=>+b.dataset.v);
  if(freq==='days'&&!days.length){toast('Escolha pelo menos um dia da semana.');return;}
  const num=(n,d,a,b)=>{const v=parseInt(el(n).value,10);return isNaN(v)?d:Math.min(b,Math.max(a,v));};
  const id=f.dataset.id,old=id?S.habits.find(x=>x.id===id):null;
  const h=Object.assign({},old||{id:uid('h'),created:Date.now(),log:{},order:S.habits.length+1});
  Object.assign(h,{name,type,target:type==='count'?num('target',1,1,999):1,unit:type==='count'?el('unit').value.trim():'',freq,days,per:num('per',3,1,7),shift:seg('shift')||'all',time:el('time').value||'',cat:seg('cat')||firstCat(),start:el('start').value||today()});
  delete h.ex;
  Store.putHabit(h);closeSheet();if(!old)S.tab='habitos';render();toast(old?'Hábito salvo':'Hábito criado');
};
/* ---------- categorias editáveis ---------- */
const PALETTE=[['ouro','Ouro'],['azul','Azul'],['violeta','Violeta'],['verde','Verde'],['terracota','Terracota'],['ardosia','Ardósia'],['turquesa','Turquesa'],['rosa','Rosa'],['ambar','Âmbar'],['indigo','Índigo'],['oliva','Oliva'],['vinho','Vinho']];
const catCount=k=>({ev:S.events.filter(e=>e.cat===k).length,tk:S.tasks.filter(t=>t.ctx===k).length,hb:S.habits.filter(h=>h.cat===k).length});
const usedText=n=>[n.ev?`${n.ev} evento${n.ev>1?'s':''}`:'',n.tk?`${n.tk} tarefa${n.tk>1?'s':''}`:'',n.hb?`${n.hb} hábito${n.hb>1?'s':''}`:''].filter(Boolean).join(' · ');
function freeColor(){const used=cats().map(c=>c.c);const f=PALETTE.find(p=>used.indexOf(p[0])<0);return f?f[0]:'ouro';}
const paletteSeg=(name,val)=>`<div class="seg pal" data-seg="${name}" data-req="1">${PALETTE.map(([k,n])=>`<button type="button" data-act="seg" data-v="${k}" aria-pressed="${k===val}" aria-label="${n}" title="${n}"><i style="background:var(--p-${k})"></i></button>`).join('')}</div>`;
/* Seletor de categoria dos editores, com "+ Nova" que cria sem sair do formulário. */
function catSeg(name,val,o){
  o=o||{};
  const btns=cats().map(c=>`<button type="button" data-act="seg" data-v="${esc(c.k)}" aria-pressed="${c.k===val}"><i class="cat-dot" style="--cat:var(--p-${esc(c.c)});display:inline-block;margin-right:6px"></i>${esc(c.n)}</button>`).join('');
  return `<div class="seg" data-seg="${name}" ${o.req?'data-req="1"':''}>${btns}<button type="button" class="seg-add" data-act="cat-inline" data-for="${name}">+ Nova</button></div><div class="catnew" id="catNew-${name}" hidden><input class="inp" id="catNewName-${name}" maxlength="30" placeholder="Nome da categoria" aria-label="Nome da nova categoria">${paletteSeg('newColor-'+name,freeColor())}<div class="btns"><button type="button" class="btn primary" data-act="cat-add-inline" data-for="${name}">Adicionar</button><button type="button" class="btn ghost" data-act="cat-inline" data-for="${name}">Cancelar</button></div></div>`;
}
function newCat(name,color){
  const list=cats().map(c=>Object.assign({},c)),k='c'+Date.now().toString(36);
  list.push({k,n:name,c:color||freeColor()});
  Store.putSettings(Object.assign({},S.settings,{cats:list}));
  return k;
}
function openCats(){
  const list=cats();
  openSheet(`<h2>Categorias</h2><p class="hint" style="margin:6px 0 14px">Valem para eventos, tarefas e hábitos. A cor aparece no calendário, na agenda e no relógio de 24 horas.</p>
<div class="catlist">${list.map(c=>`<button type="button" class="catrow" data-act="cat-edit" data-k="${esc(c.k)}"><i class="cat-dot big" style="--cat:var(--p-${esc(c.c)})"></i><span class="ptx"><b>${esc(c.n)}</b><small>${usedText(catCount(c.k))||'Sem uso'}</small></span><span class="link">Editar</span></button>`).join('')}</div>
<div class="btns" style="margin-top:14px"><button type="button" class="btn primary" data-act="cat-edit" data-k="">Nova categoria</button><button type="button" class="btn ghost" data-act="settings">Voltar aos ajustes</button></div>`);
}
function openCatEdit(k){
  const c=k?catOf(k):null;if(k&&!c)return openCats();
  const others=cats().filter(x=>x.k!==k),n=c?catCount(c.k):null,total=n?n.ev+n.tk+n.hb:0;
  openSheet(`<form class="form" data-form="cat" data-k="${c?esc(c.k):''}">
<h2>${c?'Editar categoria':'Nova categoria'}</h2>
<div class="field"><label class="lbl" for="cName">Nome</label><input class="inp" id="cName" name="name" required maxlength="30" value="${esc(c?c.n:'')}" data-autofocus placeholder="Ex.: Faculdade, Família, Finanças"></div>
<div class="field"><span class="lbl">Cor</span>${paletteSeg('color',c?c.c:freeColor())}</div>
<div class="btns"><button type="submit" class="btn primary">Salvar</button><button type="button" class="btn ghost" data-act="cats">Voltar</button></div>
${c&&others.length?`<button type="button" class="btn danger" data-act="cat-del" data-k="${esc(c.k)}">Excluir categoria</button>${total?`<p class="hint">Ao excluir, ${usedText(n)} passa${total>1?'m':''} para ${esc(others[0].n)}.</p>`:''}`:''}
</form>`);
}
function delCat(k){
  const list=cats(),rest=list.filter(c=>c.k!==k);if(!rest.length)return;const to=rest[0].k;
  S.events.filter(e=>e.cat===k).forEach(e=>Store.putEvent(Object.assign({},e,{cat:to})));
  S.tasks.filter(t=>t.ctx===k).forEach(t=>Store.putTask(Object.assign({},t,{ctx:to})));
  S.habits.filter(h=>h.cat===k).forEach(h=>Store.putHabit(Object.assign({},h,{cat:to})));
  Store.putSettings(Object.assign({},S.settings,{cats:rest.map(c=>Object.assign({},c))}));
}
Object.assign(ACT,{
  cats:()=>openCats(),
  'cat-edit':el=>openCatEdit(el.dataset.k||null),
  'cat-del'(el){if(!armed(el,'Toque de novo para excluir'))return;delCat(el.dataset.k);render();openCats();toast('Categoria excluída');},
  'cat-inline'(el){const b=document.getElementById('catNew-'+el.dataset.for);if(!b)return;b.hidden=!b.hidden;if(!b.hidden){const i=document.getElementById('catNewName-'+el.dataset.for);if(i)i.focus();}},
  'cat-add-inline'(el){
    const name=el.dataset.for,i=document.getElementById('catNewName-'+name),v=i?i.value.trim():'';
    if(!v){if(i)i.focus();toast('Dê um nome para a categoria.');return;}
    const box=document.getElementById('catNew-'+name),pick=box&&box.querySelector('[aria-pressed="true"]');
    const k=newCat(v,pick?pick.dataset.v:freeColor());
    const seg=document.querySelector(`.seg[data-seg="${name}"]`);
    if(seg){const tmp=document.createElement('div');tmp.innerHTML=catSeg(name,k,{req:!!seg.dataset.req});seg.replaceWith(tmp.children[0]);box.replaceWith(tmp.children[0]);}
    toast(`Categoria "${v}" criada`);
  }
});
FORMS.cat=function(f){
  const name=f.elements.namedItem('name').value.trim();if(!name){f.elements.namedItem('name').focus();return;}
  const color=segOf(f)('color')||freeColor(),k=f.dataset.k;
  if(k){Store.putSettings(Object.assign({},S.settings,{cats:cats().map(c=>c.k===k?Object.assign({},c,{n:name,c:color}):Object.assign({},c))}));toast('Categoria salva');}
  else{newCat(name,color);toast('Categoria criada');}
  render();openCats();
};
</script>
