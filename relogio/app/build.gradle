plugins {
    id 'com.android.application'
}

def buildNumber = (System.getenv('BUILD_NUMBER') ?: '1') as Integer

android {
    namespace 'com.eiclaude.relogio'
    compileSdk 36

    defaultConfig {
        // Mesmo id e mesma chave do app do celular: o Google Play Services só deixa os dois
        // conversarem (Data Layer) assim. Os números de versão do relógio ficam abaixo de 1000 e
        // os do celular acima, então um APK nunca substitui o outro por engano.
        applicationId 'com.eiclaude.app'
        minSdk 30
        targetSdk 34
        versionCode buildNumber
        versionName "relogio-${buildNumber}"
    }

    signingConfigs {
        fixa {
            storeFile file('../../app/eiclaude.keystore')
            storeType 'pkcs12'
            storePassword 'eiclaude'
            keyAlias 'eiclaude'
            keyPassword 'eiclaude'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.fixa
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.fixa
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

dependencies {
    // Conversa com o Ei Claude do celular (Wear OS Data Layer).
    implementation 'com.google.android.gms:play-services-wearable:20.0.1'
}
